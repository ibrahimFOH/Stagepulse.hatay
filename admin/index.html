<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#090909">
<title>Stagepulse Admin</title>
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=20261007-admin-rbac6">
<script>
(function () {
  var sources = [
    { url: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4' },
    { url: 'https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2.112.4' },
    { url: 'https://unpkg.com/@supabase/supabase-js@2.112.4' }
  ];
  var timeoutId;
  function showFailure(details) {
    document.body.innerHTML = '<div role="alert" style="padding:28px;font:16px/1.5 system-ui;color:#fff;background:#090909;min-height:100vh;box-sizing:border-box"><strong>Supabase kütüphanesi yüklenemedi.</strong><p>Bu, veritabanı kayıtlarının silindiği anlamına gelmez. Bağlantı veya CDN yüklemesi başarısız oldu.</p><p id="spLoadDetail" style="color:#bbb;font-size:13px"></p><button id="spRetry" style="padding:12px 18px;background:#ffb000;border:0;border-radius:8px;font-weight:700">Tekrar dene</button></div>';
    var detail = document.getElementById('spLoadDetail');
    if (detail) detail.textContent = details || 'İki CDN denemesi de başarısız.';
    document.getElementById('spRetry')?.addEventListener('click', function () { location.reload(); });
    console.error('Stagepulse Supabase SDK load failure:', details);
  }
  function load(index, errors) {
    if (index >= sources.length) {
      clearTimeout(timeoutId);
      showFailure(errors.join(' | '));
      return;
    }
    var source = sources[index];
    var script = document.createElement('script');
    var settled = false;
    function fail(reason) {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      script.remove();
      errors.push(source.url + ': ' + reason);
      load(index + 1, errors);
    }
    timeoutId = setTimeout(function () { fail('zaman aşımı'); }, 12000);
    script.src = source.url;
    script.onload = function () {
      if (settled) return;
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        settled = true;
        clearTimeout(timeoutId);
        var app = document.createElement('script');
        app.src = 'admin.js?v=20261015-supabase-loader-diagnostics3';
        app.onerror = function () { showFailure('Supabase SDK yüklendi ancak admin.js yüklenemedi.'); };
        document.body.appendChild(app);
      } else {
        fail('SDK yüklendi fakat createClient bulunamadı');
      }
    };
    script.onerror = function () { fail('ağ, CDN veya SRI doğrulaması başarısız'); };
    document.head.appendChild(script);
  }
  if (navigator.onLine === false) {
    window.__stagepulseAdminOfflineBootstrap = true;
    return;
  }
  load(0, []);
})();
</script>
</head>
<body class="admin-body">

<!-- LOGIN -->
<div id="loginView" class="auth-shell">
  <div class="auth-card">
    <div class="auth-mark">SP</div>
    <p class="admin-brand">STAGEPULSE ADMIN</p>
    <h1>Giriş</h1>
    <p class="auth-sub">Yönetici hesabı ile devam et</p>
    <form id="loginForm" autocomplete="on">
      <label>Kullanıcı adı
        <input id="loginUsername" autocomplete="username" autocapitalize="none" required>
      </label>
      <label>Şifre
        <input id="loginPassword" type="password" autocomplete="current-password" minlength="8" required>
      </label>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Giriş Yap</button>
      <p id="loginError" class="form-error" role="alert"></p>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appView" class="app-shell is-hidden">
  <div id="mobileOverlay" class="overlay" hidden></div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-dot">SP</span>
        <span class="brand-text">STAGEPULSE<span>Admin</span></span>
      </div>
      <button type="button" id="sidebarClose" class="icon-btn only-mobile" aria-label="Kapat">✕</button>
    </div>

    <nav class="nav" id="sideNav">
      <p class="nav-label">Satış</p>
      <button type="button" data-view="dashboard">Genel Bakış</button>
      <button type="button" data-view="offers">Teklifler <em id="navOfferBadge" hidden></em></button>
      <button type="button" data-view="customers">Müşteriler</button>
      <button type="button" data-view="settlements">Gelir · Gider</button>
      <button type="button" data-view="pricing">Fiyatlandırma</button>

      <p class="nav-label">Operasyon</p>
      <button type="button" data-view="equipment">Ekipman</button>
      <button type="button" data-view="calendar">Takvim</button>
      <button type="button" data-view="finance">Ödemeler</button>
      <button type="button" data-view="personnel">Personel</button>
      <button type="button" data-view="analytics">Analitik</button>
      <button type="button" data-view="activity">Aktivite</button>
      <button type="button" data-view="notifications">Bildirimler</button>

      <p class="nav-label">Sistem</p>
      <button type="button" data-view="settings">Ayarlar</button>
      <button type="button" id="logoutBtn" class="nav-logout">Çıkış</button>
    </nav>

    <div class="sidebar-user">
      <span class="avatar">SP</span>
      <div>
        <strong id="sideAdminName">Admin</strong>
        <small id="adminUser">@admin</small>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button type="button" id="menuBtn" class="icon-btn" aria-label="Menü">☰</button>
      <div class="topbar-title">
        <h1 id="viewTitle">Genel Bakış</h1>
        <p id="viewSubtitle">Özet</p>
      </div>
      <a class="site-link" href="../" target="_blank" rel="noopener">Site ↗</a>
    </header>
    <main id="content" class="content"></main>
  </div>
</div>


<script src="/offline-sync.js"></script>
<script>
(async function () {
  if (!window.__stagepulseAdminOfflineBootstrap) return;
  const root = document.body;
  try {
    const cached = JSON.parse(localStorage.getItem('stagepulse-admin-offline-context') || 'null');
    if (!cached || Date.now() - Number(cached.validatedAt || 0) >= 7 * 24 * 60 * 60 * 1000) {
      root.innerHTML = '<main style="padding:28px;font:16px/1.5 system-ui;background:#090909;color:#fff;min-height:100vh"><h1>Çevrimdışı erişim kullanılamıyor</h1><p>Bu cihazdaki yönetici doğrulaması 7 günden eski veya bulunamadı. İnternete bağlanıp giriş yapmanız gerekiyor.</p></main>';
      return;
    }
    if (!window.StagepulseOffline) throw new Error('Çevrimdışı depolama modülü yüklenemedi.');
    if (!cached.userId) throw new Error('Doğrulanmış yönetici kimliği bulunamadı.');
    const calendar = await window.StagepulseOffline.getCache('admin.calendar:' + cached.userId);
    if (!calendar) {
      root.innerHTML = '<main style="padding:28px;font:16px/1.5 system-ui;background:#090909;color:#fff;min-height:100vh"><h1>Çevrimdışı takvim bulunamadı</h1><p>Takvimi internet bağlantısı varken en az bir kez açıp eşitleyin.</p></main>';
      return;
    }
    root.innerHTML = '<main id="spOfflineShell" style="padding:18px;min-height:100vh;background:#090909;color:#fff;font:15px/1.5 system-ui"><header style="padding:12px 0;border-bottom:1px solid #444;margin-bottom:14px"><strong>STAGEPULSE ADMIN · ÇEVRİMDIŞI</strong><p style="margin:4px 0">Yönetici: ' + String(cached.displayName || cached.username || 'Admin').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) + '</p><p style="margin:4px 0">Yalnızca cihazda son eşitlenen takvim gösterilir. Sunucu işlemleri çevrimiçi yapılmalıdır.</p></header><section id="spOfflineCalendar"></section></main>';
    const area = document.getElementById('spOfflineCalendar');
    area.innerHTML = calendar;
    area.querySelectorAll('script').forEach(el => el.remove());
    area.querySelectorAll('[onclick],[onchange],[onsubmit]').forEach(el => {
      el.removeAttribute('onclick'); el.removeAttribute('onchange'); el.removeAttribute('onsubmit');
    });
    area.querySelectorAll('button,input,select,textarea,a').forEach(el => {
      if (el.tagName === 'A') el.removeAttribute('href');
      if ('disabled' in el) el.disabled = true;
    });
    await window.StagepulseOffline.renderBanner();
  } catch (error) {
    console.error('Stagepulse offline bootstrap:', error);
    root.innerHTML = '<main style="padding:28px;font:16px/1.5 system-ui;background:#090909;color:#fff;min-height:100vh"><h1>Çevrimdışı ekran açılamadı</h1><p>Önbellek okunamadı. İnternete bağlanıp takvimi yeniden eşitleyin.</p></main>';
  }
})();
</script>
</body>
</html>
