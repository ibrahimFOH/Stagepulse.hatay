<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Stagepulse JARVIS</title><link rel="stylesheet" href="jarvis.css?v=20260908-jarvis4"></head><body><header class="top"><strong>Patron Orchestrator</strong><span id="modeBadge" class="badge">ONLINE · canlı</span><span class="badge">canonical JARVIS</span><div class="spacer"></div><button id="btnHealth" type="button">Sistem Testi</button><a href="../" class="btn-link">Admin</a></header><main class="layout"><section class="chat"><div id="msgs" class="msgs"></div><form id="form" class="form"><input id="input" autocomplete="off" placeholder="JARVIS'e yaz…"><button type="submit">Gönder</button></form><div class="quick"><button id="btnSkills" type="button">Yetenekler</button><button id="btnJobs" type="button">İşler</button><button id="btnClear" type="button">Temizle</button></div><div id="skillsPanel" class="skills"></div></section><aside class="side"><h3>Canonical JARVIS</h3><p>Canlı AI, şirket verileri, araçlar ve approval akışı tek Patron JARVIS endpointinden çalışır.</p><button id="btnLive" type="button">Canlı Özet</button><div id="healthBox" class="health"></div></aside></main><script src="../shared/runtime-config.js?v=20260908-runtime2"></script><script src="knowledge.js?v=20260908-jarvis2"></script><script src="agent.js?v=20260908-jarvis3"></script><script src="app.js?v=20260908-jarvis4"></script><script>(function(){const h=document.getElementById('btnHealth'),l=document.getElementById('btnLive'),box=document.getElementById('healthBox');async function token(){const c=window.__stagepulseAdminClient||window.sb||window.supabaseClient;if(!c?.auth)throw Error('Admin oturumu hazır değil.');const r=await c.auth.getSession();if(r.error)throw r.error;return r.data?.session?.access_token||null}async function call(url,body){const t=await token();if(!t)throw Error('Oturum gerekli.');const r=await fetch((window.STAGEPULSE_RUNTIME?.supabaseUrl||'').replace(/\/$/,'')+url,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||('HTTP '+r.status));return j}h?.addEventListener('click',async()=>{box.textContent='Sistem test ediliyor…';try{const j=await call('/functions/v1/patron-ai',{health:true});box.textContent='JARVIS: '+(j.ai_configured?'AI hazır':'AI fallback')+' · GitHub: '+(j.github_configured?'hazır':'yapılandırılmamış')}catch(e){box.textContent='Hata: '+e.message}});l?.addEventListener('click',()=>{const input=document.getElementById('input');if(input){input.value='canlı özet';document.getElementById('form')?.requestSubmit()}})})();</script></body></html>
