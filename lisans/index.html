<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Stagepulse Lisans Yönetimi</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#151515;--line:#343434;--gold:#d6b15d;--text:#f4f1e8;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}header{padding:20px max(18px,calc((100vw - 1100px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0;color:var(--gold)}main{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}h2{font-size:17px;margin:0 0 16px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}input,select,textarea,button{font:inherit;border-radius:7px;border:1px solid #444;padding:10px;background:#0e0e0e;color:var(--text);width:100%}button{cursor:pointer;background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}button.secondary{background:#242424;color:var(--text);border-color:#444}button.danger{background:#541d1d;color:white;border-color:#733}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;align-items:end}.actions button{width:auto;white-space:nowrap}.hidden{display:none!important}.status{padding:10px 12px;border-radius:7px;background:#222;margin:12px 0;white-space:pre-wrap}.status.error{color:#ffb0a8}.status.ok{color:#c5f0c7}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold);font-size:13px}.key{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.pill{padding:3px 8px;border:1px solid var(--line);border-radius:20px;font-size:12px}.top-actions{display:flex;gap:8px}.top-actions button{width:auto}@media(max-width:640px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.panel{padding:16px}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}}
</style></head><body>
<header><h1>STAGEPULSE · LİSANS YÖNETİMİ</h1><div class="top-actions"><button id="refresh" class="secondary hidden">Yenile</button><button id="logout" class="secondary hidden">Çıkış</button></div></header>
<main>
<section id="loginPanel" class="panel"><h2>Yönetici girişi</h2><p>Stagepulse, Ses Merkezi ve JARVIS yönetimi için ortak Supabase hesabınla giriş yap.</p><form id="loginForm"><label for="email">E-posta</label><input id="email" type="email" autocomplete="username" required maxlength="320"><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><div style="margin-top:16px"><button id="loginButton">Giriş yap</button></div></form><div id="loginMessage" class="status hidden" role="status"></div></section>
<section id="appPanel" class="hidden">
<div class="panel"><h2>Yeni lisans oluştur</h2><form id="createForm"><div class="grid"><div><label for="customer">Müşteri / kurum</label><input id="customer" required maxlength="160"></div><div><label for="product">Uygulama</label><select id="product" required><option value="stagepulse">Stagepulse</option><option value="ses-merkezi">Ses Merkezi · Windows</option><option value="ses-merkezi-android">Ses Merkezi · Android</option><option value="jarvis-windows">JARVIS · Windows</option><option value="jarvis-android">JARVIS · Android</option></select></div><div><label for="devices">En fazla cihaz</label><input id="devices" type="number" min="1" max="100" value="1" required></div><div><label for="expiry">Bitiş tarihi (isteğe bağlı)</label><input id="expiry" type="date"></div></div><label for="payment">Ödeme durumu</label><select id="payment"><option value="unpaid">Ödenmedi</option><option value="paid">Ödendi</option><option value="refunded">İade edildi</option></select><label for="notes">Not</label><textarea id="notes" rows="2" maxlength="1000"></textarea><div style="margin-top:14px"><button id="createButton">Lisans oluştur</button></div></form><div id="createdKey" class="status hidden"></div></div>
<div class="panel"><div class="actions" style="justify-content:space-between;flex-direction:row;align-items:center"><h2 style="margin:0">Lisanslar</h2><button id="loadButton" class="secondary">Listeyi yenile</button></div><div id="appMessage" class="status hidden" role="status"></div><div class="table-wrap"><table><thead><tr><th>Müşteri</th><th>Ürün</th><th>Durum</th><th>Cihaz</th><th>Bitiş</th><th>İşlem</th></tr></thead><tbody id="licensesBody"><tr><td colspan="6">Henüz yüklenmedi.</td></tr></tbody></table></div></div>
</section>
</main>
<script>
(function(){
"use strict";
const supabaseUrl="https://itasctyjzyewcykozuex.supabase.co";
const publishableKey="sb_publishable_tP3CMhVAjv6FNtrkYfVEOA_dbF9m8Jb";
const endpoint=supabaseUrl+"/functions/v1/license-core";
let token="",expiry=0;
const $=id=>document.getElementById(id);
function message(id,text,type){const el=$(id);el.textContent=text;el.className="status "+(type||"");el.classList.remove("hidden")}
function showApp(){ const key=$("createdKey"); if(key.parentElement!==$("createForm").parentElement)$("createForm").parentElement.appendChild(key); $("loginPanel").classList.add("hidden");$("appPanel").classList.remove("hidden");$("logout").classList.remove("hidden");$("refresh").classList.remove("hidden"); }
function showLogin(){token="";expiry=0;const key=$("createdKey");if(!key.classList.contains("hidden"))$("loginPanel").appendChild(key);$("loginPanel").classList.remove("hidden");$("appPanel").classList.add("hidden");$("logout").classList.add("hidden");$("refresh").classList.add("hidden");$("password").value=""}
async function api(action,data={}){const h={"Content-Type":"application/json","apikey":publishableKey};if(token)h.Authorization="Bearer "+token;const response=await fetch(endpoint,{method:"POST",headers:h,body:JSON.stringify({action,...data})});const body=await response.json().catch(()=>({error:"Sunucu yanıtı okunamadı."}));if(response.status===401){showLogin();throw new Error(body.error||"Oturum sona erdi.")}if(!response.ok)throw new Error(body.error||"İstek başarısız.");return body}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginButton").disabled=true;try{const response=await fetch(supabaseUrl+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":publishableKey},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});const auth=await response.json().catch(()=>({}));if(!response.ok||!auth.access_token)throw new Error(auth.msg||auth.message||"E-posta veya şifre hatalı.");token=auth.access_token;expiry=Date.now()+Number(auth.expires_in||3600)*1000;showApp();await loadLicenses()}catch(err){message("loginMessage",err.message,"error")}finally{$("loginButton").disabled=false}});
async function loadLicenses(){if(!token||Date.now()>=expiry){showLogin();return}const b=$("licensesBody");b.innerHTML="<tr><td colspan='6'>Yükleniyor…</td></tr>";try{const r=await api("admin_list");b.replaceChildren();for(const item of r.licenses||[]){const tr=document.createElement("tr");const names={stagepulse:"Stagepulse","ses-merkezi":"Ses Merkezi",jarvis:"JARVIS"};const vals=[item.customer_name,names[item.product_code]||item.product_code,item.status,(item.active_devices||0)+" / "+item.max_devices,item.expires_at?new Date(item.expires_at).toLocaleDateString("tr-TR"):"Süresiz"];for(const v of vals){const td=document.createElement("td");td.textContent=String(v??"");tr.appendChild(td)}const td=document.createElement("td");if(item.status==="active"){const btn=document.createElement("button");btn.className="danger";btn.textContent="İptal et";btn.addEventListener("click",()=>revoke(item.id,item.customer_name));td.appendChild(btn)}else td.textContent="—";tr.appendChild(td);b.appendChild(tr)}if(!b.children.length)b.innerHTML="<tr><td colspan='6'>Lisans bulunamadı.</td></tr>";message("appMessage",r.licenses.length+" lisans listelendi.","ok")}catch(err){message("appMessage",err.message,"error");b.replaceChildren()}}
async function revoke(id,name){if(!confirm(name+" lisansını iptal etmek istiyor musunuz? Bu işlem uygulamaların sonraki doğrulamasında erişimi kapatır."))return;try{await api("admin_revoke",{license_id:id});message("appMessage","Lisans iptal edildi.","ok");await loadLicenses()}catch(err){message("appMessage",err.message,"error")}}
$("createForm").addEventListener("submit",async e=>{e.preventDefault();$("createButton").disabled=true;$("createdKey").classList.add("hidden");try{const r=await api("admin_create",{app_id:$("product").value,max_devices:Number($("devices").value),customer_name:$("customer").value.trim(),expires_at:$("expiry").value?new Date($("expiry").value+"T23:59:59").toISOString():null,payment_status:$("payment").value,notes:$("notes").value.trim()});message("createdKey","Lisans anahtarı (yalnızca bir kez gösterilir): "+r.license_key+"\nAnahtarı şimdi güvenli bir yere kopyalayın.","ok");$("customer").value="";$("notes").value="";await loadLicenses()}catch(err){message("appMessage",err.message,"error")}finally{$("createButton").disabled=false}});
$("loadButton").addEventListener("click",loadLicenses);$("refresh").addEventListener("click",loadLicenses);$("logout").addEventListener("click",showLogin);
window.addEventListener("pageshow",()=>{if(token&&Date.now()>=expiry)showLogin()});
})();
</script></body></html>
