<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Stagepulse Lisans Yönetimi</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#151515;--line:#343434;--gold:#d6b15d;--text:#f4f1e8;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}header{padding:20px max(18px,calc((100vw - 1100px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0;color:var(--gold)}main{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}h2{font-size:17px;margin:0 0 16px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}input,select,textarea,button{font:inherit;border-radius:7px;border:1px solid #444;padding:10px;background:#0e0e0e;color:var(--text);width:100%}button{cursor:pointer;background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}button.secondary{background:#242424;color:var(--text);border-color:#444}button.danger{background:#541d1d;color:white;border-color:#733}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;align-items:end}.actions button{width:auto;white-space:nowrap}.hidden{display:none!important}.status{padding:10px 12px;border-radius:7px;background:#222;margin:12px 0;white-space:pre-wrap}.status.error{color:#ffb0a8}.status.ok{color:#c5f0c7}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold);font-size:13px}.key{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.pill{padding:3px 8px;border:1px solid var(--line);border-radius:20px;font-size:12px}.top-actions{display:flex;gap:8px}.top-actions button{width:auto}@media(max-width:640px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.panel{padding:16px}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}}
</style></head><body>
<header><h1>STAGEPULSE · LİSANS YÖNETİMİ</h1><div class="top-actions"><button id="refresh" class="secondary hidden">Yenile</button><button id="logout" class="secondary hidden">Çıkış</button></div></header>
<main>
<section id="loginPanel" class="panel"><h2>Yönetici girişi</h2><p>Stagepulse, Ses Merkezi ve JARVIS lisanslarını yönetmek için özel yönetici hesabını kullan.</p><form id="loginForm"><label for="username">Kullanıcı adı</label><input id="username" type="text" autocomplete="username" required maxlength="120"><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><div style="margin-top:16px"><button id="loginButton" type="submit">Giriş yap</button></div></form><div id="loginMessage" class="status hidden" role="status"></div></section>
<section id="appPanel" class="hidden">
<div class="panel"><h2>Yeni lisans oluştur</h2><form id="createForm"><div class="grid"><div><label for="customer">Müşteri / kurum</label><input id="customer" required maxlength="160"></div><div><label for="product">Uygulama</label><select id="product" required><option value="stagepulse">Stagepulse</option><option value="ses-merkezi">Ses Merkezi · Windows</option><option value="ses-merkezi-android">Ses Merkezi · Android</option><option value="jarvis-windows">JARVIS · Windows</option><option value="jarvis-android">JARVIS · Android</option></select></div><div><label for="devices">En fazla cihaz</label><input id="devices" type="number" min="1" max="100" value="1" required></div><div><label for="expiry">Bitiş tarihi (isteğe bağlı)</label><input id="expiry" type="date"></div></div><label for="payment">Ödeme durumu</label><select id="payment"><option value="unpaid">Ödenmedi</option><option value="paid">Ödendi</option><option value="refunded">İade edildi</option></select><label for="notes">Not</label><textarea id="notes" rows="2" maxlength="1000"></textarea><div style="margin-top:14px"><button id="createButton">Lisans oluştur</button></div></form><div id="createdKey" class="status hidden"></div></div>
<div class="panel"><div class="actions" style="justify-content:space-between;flex-direction:row;align-items:center"><h2 style="margin:0">Lisanslar</h2><button id="loadButton" class="secondary">Listeyi yenile</button></div><div id="appMessage" class="status hidden" role="status"></div><div class="table-wrap"><table><thead><tr><th>Müşteri</th><th>Ürün</th><th>Durum</th><th>Cihaz</th><th>Bitiş</th><th>İşlem</th></tr></thead><tbody id="licensesBody"><tr><td colspan="6">Henüz yüklenmedi.</td></tr></tbody></table></div></div>
</section>
</main>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://itasctyjzyewcykozuex.supabase.co";
const API=SUPABASE_URL+"/functions/v1/license-admin";
const KEY="sb_publishable_tP3CMhVAjv6FNtrkYfVEOA_dbF9m8Jb";
let token="",expiresAt=0;
const $=id=>document.getElementById(id);
function message(id,text,type){const el=$(id);el.textContent=text;el.className="status "+(type||"");el.classList.remove("hidden")}
function showApp(){$("loginPanel").classList.add("hidden");$("appPanel").classList.remove("hidden");$("logout").classList.remove("hidden");$("refresh").classList.remove("hidden");$("password").value=""}
function showLogin(){token="";expiresAt=0;$("loginPanel").classList.remove("hidden");$("appPanel").classList.add("hidden");$("logout").classList.add("hidden");$("refresh").classList.add("hidden");$("password").value=""}
async function api(action,data={},auth=true){
 if(auth&&(!token||Date.now()>=expiresAt)){showLogin();throw new Error("Oturum sona erdi. Yeniden giriş yap.")}
 const headers={"Content-Type":"application/json","apikey":KEY};if(auth&&token)headers.Authorization="Bearer "+token;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 let response;try{response=await fetch(API,{method:"POST",headers,body:JSON.stringify({action,...data}),cache:"no-store",signal:controller.signal})}
 catch(e){if(e&&e.name==="AbortError")throw new Error("Lisans sunucusu 20 saniye içinde yanıt vermedi. Supabase license-admin fonksiyonunu kontrol edin.");throw new Error("Lisans API bağlantısı kurulamadı. DNS, TLS veya CORS engeli olabilir. İnternet bağlantısını ve Supabase license-admin fonksiyonunu kontrol edin. ("+(e&&e.message?e.message:"Ağ hatası")+")")}
 finally{clearTimeout(timer)}
 const body=await response.json().catch(()=>({error:"Sunucudan geçersiz JSON yanıtı alındı."}));
 if(response.status===401&&auth){showLogin();throw new Error(body.error||"Yönetici oturumu geçersiz veya süresi dolmuş.")}
 if(!response.ok)throw new Error(body.error||("HTTP "+response.status));return body
}
function date(v){if(!v)return "Süresiz";const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleDateString("tr-TR")}
function product(v){return ({stagepulse:"Stagepulse","ses-merkezi":"Ses Merkezi · Windows","ses-merkezi-android":"Ses Merkezi · Android","jarvis-windows":"JARVIS · Windows","jarvis-android":"JARVIS · Android"})[v]||v||"—"}
async function loadLicenses(){
 if(!token||Date.now()>=expiresAt){showLogin();return}
 const body=$("licensesBody");body.innerHTML="<tr><td colspan='6'>Yükleniyor…</td></tr>";
 try{const result=await api("list");body.replaceChildren();for(const item of result.licenses||[]){
  const tr=document.createElement("tr"),devices=Array.isArray(item.activated_devices)?item.activated_devices.length:0;
  for(const value of [item.customer_name,product(item.product_code),item.status==="active"?"Aktif":item.status,devices+" / "+item.max_devices,date(item.expires_at)]){const td=document.createElement("td");td.textContent=String(value??"");tr.appendChild(td)}
  const action=document.createElement("td");if(item.status==="active"){const button=document.createElement("button");button.className="danger";button.textContent="İptal et";button.addEventListener("click",()=>revoke(item.id,item.customer_name));action.appendChild(button)}else action.textContent="—";tr.appendChild(action);body.appendChild(tr)
 }if(!body.children.length)body.innerHTML="<tr><td colspan='6'>Lisans bulunamadı.</td></tr>";message("appMessage",(result.licenses||[]).length+" lisans listelendi.","ok")}
 catch(error){message("appMessage",error.message,"error");body.replaceChildren()}
}
async function revoke(id,name){if(!confirm(name+" lisansını iptal etmek istiyor musunuz?"))return;try{await api("revoke",{id});message("appMessage","Lisans iptal edildi.","ok");await loadLicenses()}catch(error){message("appMessage",error.message,"error")}}
$("loginForm").addEventListener("submit",async event=>{event.preventDefault();$("loginButton").disabled=true;message("loginMessage","Yönetici hesabı doğrulanıyor…");try{
 const result=await api("login",{username:$("username").value.trim(),password:$("password").value},false);
 if(!result.token)throw new Error("Sunucu geçerli oturum belirteci döndürmedi.");token=result.token;expiresAt=Date.now()+Number(result.expires_in||1800)*1000;showApp();await loadLicenses()
 }catch(error){message("loginMessage",error.message,"error")}finally{$("loginButton").disabled=false}});
$("createForm").addEventListener("submit",async event=>{event.preventDefault();$("createButton").disabled=true;$("createdKey").classList.add("hidden");try{
 const result=await api("create",{customer_name:$("customer").value.trim(),product_code:$("product").value,max_devices:Number($("devices").value),expires_at:$("expiry").value?new Date($("expiry").value+"T23:59:59").toISOString():null,notes:$("notes").value.trim()});
 message("createdKey","Lisans anahtarı (yalnızca bir kez gösterilir): "+result.license_key+"\nAnahtarı şimdi güvenli bir yere kopyalayın.","ok");$("customer").value="";$("notes").value="";await loadLicenses()
 }catch(error){message("appMessage",error.message,"error")}finally{$("createButton").disabled=false}});
$("loadButton").addEventListener("click",loadLicenses);$("refresh").addEventListener("click",loadLicenses);$("logout").addEventListener("click",showLogin);
window.addEventListener("pageshow",()=>{if(token&&Date.now()>=expiresAt)showLogin()});
})();
</script></body></html>
