<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Stagepulse JARVIS Patron</title><script src="/shared/runtime-config.js"></script><script src="/jarvis/core/config.js"></script><style>body{margin:0;background:#070707;color:#fff;font:15px system-ui}main{max-width:1200px;margin:auto;padding:16px}.card{background:#101010;border:1px solid #2b2b2b;border-radius:16px;padding:16px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{padding:12px 14px;border-radius:10px;border:1px solid #444;background:#171717;color:#fff;font-weight:700}button.primary{background:#ffb000;color:#111}.hidden{display:none}.grid{display:grid;grid-template-columns:1.6fr .8fr;gap:10px}.chat{height:55vh;overflow:auto;border:1px solid #262626;border-radius:12px;padding:10px}.msg{margin:8px 0;padding:10px 12px;border-radius:12px;white-space:pre-wrap}.u{background:#202020}.a{background:#17130a;border:1px solid #4a3a17}.s{color:#aaa;font-size:12px}.compose{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}input{background:#090909;color:#fff;border:1px solid #363636;border-radius:10px;padding:13px;box-sizing:border-box;width:100%}@media(max-width:850px){.grid{grid-template-columns:1fr}}pre{white-space:pre-wrap;word-break:break-word}.gold{color:#ffb000}</style></head><body><main><section id="login" class="card"><h1>Stagepulse <span class="gold">JARVIS</span></h1><p>Patron Cockpit • merkezi orkestratör</p><input id="email" type="email" autocomplete="username" value="teklifal@stagepulse.com.tr"><div style="height:8px"></div><input id="password" type="password" autocomplete="current-password" placeholder="Şifre"><div class="row" style="margin-top:10px"><button id="open" class="primary" type="button">JARVIS'i Aç</button><button id="reset" type="button">Şifremi Sıfırla</button></div><p id="status">Hazır.</p></section><section id="app" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><b>Patron Orchestrator</b><div><span id="net">● ONLINE</span> <button id="logout">Çıkış</button></div></div></div><div class="grid"><section class="card"><div id="chat" class="chat"></div><div class="compose"><input id="msg" placeholder="JARVIS'e yaz…"><button id="send" class="primary">Gönder</button></div><div class="row" style="margin-top:8px"><button data-q="Durumum nedir?">Durum</button><button data-q="Teklifleri özetle">Teklifler</button><button data-q="Etkinlikleri özetle">Etkinlikler</button><button data-q="Ekipman durumunu özetle">Ekipman</button><button data-q="Personeli listele">Personel</button><button data-q="Ajanları listele">Ajanlar</button><button data-q="Onayları listele">Onaylar</button></div></section><aside class="card"><h3>Onay Kuyruğu <span id="count" class="gold">0</span></h3><div id="approvals">Yükleniyor…</div><hr><h3>Araç Merkezi</h3><div class="row"><button data-tool="github_status">GitHub</button><button data-tool="agents.list">Ajanlar</button><button data-tool="approvals.list">Onaylar</button></div><pre id="tool"></pre></aside></div></section></main><script>(function(){'use strict';const R=window.STAGEPULSE_RUNTIME||{},C=window.STAGEPULSE_JARVIS_CONFIG||{},URL=R.supabaseUrl||C.supabaseUrl||'',KEY=R.supabasePublishableKey||C.publishableKey||'';const fn=n=>C.functions&&C.functions[n]?C.functions[n]:URL+'/functions/v1/'+n;let token=sessionStorage.getItem('stagepulse_jarvis_token')||null;const $=id=>document.getElementById(id);function h(){return {'apikey':KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}async function req(u,m='GET',b){const r=await fetch(u,{method:m,headers:h(),cache:'no-store',body:b?JSON.stringify(b):undefined});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));return d}function log(t,k='a'){const x=document.createElement('div');x.className='msg '+k;x.textContent=t;$('chat').appendChild(x);$('chat').scrollTop=$('chat').scrollHeight}async function login(){const email=$('email').value.trim(),password=$('password').value,b=$('open');if(!email||!password){$('status').textContent='E-posta ve şifre gerekli.';return}b.disabled=true;$('status').textContent='Giriş doğrulanıyor…';try{const d=await req(URL+'/auth/v1/token?grant_type=password','POST',{email,password});token=d.access_token;if(!token)throw Error('Token alınamadı');const u=d.user||{},a=u.app_metadata||{},m=u.user_metadata||{};if(!(['patron','owner','admin'].includes(a.role)||m.admin_access===true||['owner','admin'].includes(m.organization_role)))throw Error('Patron yetkisi bulunmuyor');sessionStorage.setItem('stagepulse_jarvis_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');log('Patron oturumu açıldı.','s');refresh()}catch(e){token=null;sessionStorage.removeItem('stagepulse_jarvis_token');$('status').textContent='Giriş başarısız: '+e.message}finally{b.disabled=false}}async function chat(){const text=$('msg').value.trim();if(!text||!token)return;log('SEN: '+text,'u');$('msg').value='';try{const d=await req(fn('patronAI'),'POST',{message:text});log('JARVIS: '+(d.reply||'Yanıt yok'));await refresh()}catch(e){log('JARVIS servis hatası: '+e.message,'s')}}async function refresh(){try{const d=await req(fn('approve'));const a=(d.approvals||[]).filter(x=>x.status==='pending');$('count').textContent=a.length;$('approvals').textContent=a.length?a.map(x=>(x.preview&&x.preview.title)||x.type||x.id).join('\n'):'Bekleyen onay yok.'}catch(e){$('approvals').textContent='Onay servisi: '+e.message}}async function tool(n){try{$('tool').textContent=JSON.stringify(await req(fn('tools'),'POST',{tool:n,params:{limit:50}}),null,2)}catch(e){$('tool').textContent='Hata: '+e.message}}$('open').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('send').onclick=chat;$('msg').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();chat()}};$('logout').onclick=()=>{sessionStorage.removeItem('stagepulse_jarvis_token');location.reload()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('msg').value=b.dataset.q;chat()});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>tool(b.dataset.tool));if(token)req(fn('approve')).then(()=>{$('login').classList.add('hidden');$('app').classList.remove('hidden');log('Oturum geri yüklendi.','s');refresh()}).catch(()=>{token=null;sessionStorage.removeItem('stagepulse_jarvis_token')})})();</script></body></html>
