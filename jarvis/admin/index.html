<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090909"><title>Stagepulse Jarvis • Patron</title>
<script src="/shared/runtime-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4" crossorigin="anonymous"></script>
<style>
html,body{margin:0;background:#090909;color:#eee;font:15px system-ui,sans-serif}body{min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:18px}.card{background:#121212;border:1px solid #2a2a2a;border-radius:18px;padding:16px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900;font-size:20px}.gold{color:#ffb000}.muted{color:#999}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}input,textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0d0d0d;color:#fff;margin:6px 0 10px}button{border:1px solid #333;border-radius:10px;padding:10px 13px;background:#181818;color:#fff;font-weight:800;cursor:pointer;margin:3px}button.primary{background:#ffb000;color:#111;border-color:#ffb000}button.voice{border-color:#806000;color:#ffcf55}.hidden{display:none}.chat{height:56vh;overflow:auto;padding-right:3px}.msg{padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;line-height:1.45}.user{background:#1d1d1d}.bot{background:#17130a;border:1px solid #493b18}.system{background:#101010;border:1px solid #282828;color:#aaa}.row{display:flex;gap:7px}.row>*{flex:1}.approval{border:1px solid #3b321c;border-radius:12px;padding:12px;margin:8px 0}.approval pre{white-space:pre-wrap;overflow:auto;color:#bbb}.status{font-weight:800}.notice{padding:10px 12px;border-radius:10px;background:#19160d;border:1px solid #493b18;margin-top:10px}.toolbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.small{font-size:12px}.list{white-space:pre-wrap;max-height:260px;overflow:auto;color:#bbb}
</style></head>
<body><main class="wrap">
<section id="login" class="card"><h1>Stagepulse <span class="gold">Jarvis</span></h1><p class="muted">Patron erişimi zorunludur. Oturum açmadan araçlar çalışmaz.</p><form id="loginForm"><label>E-posta<input id="email" type="email" autocomplete="username" required></label><label>Şifre<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Giriş / Kilidi Aç</button><button id="forgotBtn" type="button">Şifremi Sıfırla</button><p id="loginStatus" class="status"></p></form>
<section id="resetBox" class="notice hidden"><b>Şifre sıfırlama</b><form id="resetRequestForm"><label>E-posta<input id="resetEmail" type="email" autocomplete="email" required></label><button class="primary" type="submit">Sıfırlama bağlantısı gönder</button><button id="resetCancel" type="button">İptal</button><p id="resetStatus" class="status"></p></form></section></section>
<section id="recoveryBox" class="card hidden"><h2>Yeni Patron Şifresi</h2><form id="recoveryForm"><label>Yeni şifre<input id="newPassword" type="password" autocomplete="new-password" minlength="10" required></label><label>Yeni şifre tekrar<input id="newPassword2" type="password" autocomplete="new-password" minlength="10" required></label><button class="primary" type="submit">Şifreyi Kaydet ve JARVIS'e Gir</button><p id="recoveryStatus" class="status"></p></form></section>
<section id="app" class="hidden"><div class="top"><div class="brand">Stagepulse <span class="gold">Jarvis Patron</span></div><div><span id="net" class="muted"></span><button id="logout">Çıkış</button></div></div>
<div class="grid"><section class="card"><div id="chat" class="chat"></div><div class="row"><input id="message" placeholder="Jarvis'e yaz veya mikrofonu kullan…"><button id="send" class="primary">Gönder</button></div><div class="toolbar"><button id="mic" class="voice">Mikrofon</button><button id="speak">Son cevabı seslendir</button><button data-q="durum">Durum</button><button data-q="teklifleri listele">Teklifler</button><button data-q="etkinlikleri göster">Etkinlikler</button><button data-q="ekipman durumu">Ekipman</button></div><div id="voiceStatus" class="muted small"></div></section>
<aside><section class="card"><h2>Onaylar <span id="count" class="gold">0</span></h2><div id="approvals"></div></section><section class="card"><h2>Araçlar</h2><div class="toolbar"><button data-tool="github_status">GitHub</button><button data-tool="agents.list">Ajanlar</button></div><pre id="tool" class="list"></pre></section></aside></div></section></main>
<script>
const R=window.STAGEPULSE_RUNTIME||{};const S=supabase.createClient(R.supabaseUrl,R.supabasePublishableKey);const EP=R.supabaseUrl.replace(/\/$/,'')+'/functions/v1/';const $=id=>document.getElementById(id);let session=null,lastReply='',online=navigator.onLine,speechRecognition=null;
function log(t,c='bot',speak=false){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;if(c==='bot'){lastReply=t;if(speak)say(t)}}
function headers(){return session?{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}
async function call(path,opts={}){const r=await fetch(EP+path,Object.assign({headers:headers()},opts));const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Servis hatası HTTP '+r.status));return d}
function say(text){if(!text||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';u.rate=.98;u.pitch=1;window.speechSynthesis.speak(u)}
async function refresh(){try{const d=await call('jarvis-approve');const a=d.approvals||[];$('count').textContent=a.filter(x=>x.status==='pending').length;$('approvals').innerHTML='';a.filter(x=>x.status==='pending').forEach(x=>{const e=document.createElement('div');e.className='approval';e.innerHTML='<b>'+String(x.type)+'</b><p>'+String(x.preview?.title||'İşlem')+'</p><pre>'+JSON.stringify(x.payload||{},null,2).slice(0,3000)+'</pre><button class="primary" data-a="'+x.id+'">Onayla</button><button data-r="'+x.id+'">Reddet</button>';$('approvals').appendChild(e)})}catch(e){$('approvals').textContent=e.message}}
async function chat(t){t=String(t||'').trim();if(!t)return;log(t,'user');$('message').value='';try{const low=t.toLocaleLowerCase('tr-TR');let d;if(/teklif|lead/.test(low))d=await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:'list_leads',params:{limit:20}})});else if(/etkinlik|event/.test(low))d=await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:'list_events',params:{limit:20}})});else if(/ekipman/.test(low))d=await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:'equipment_status',params:{limit:50}})});else if(/github/.test(low))d=await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:'github_status',params:{}})});else d=await call('patron-ai',{method:'POST',body:JSON.stringify({message:t})});const text=typeof d.reply==='string'?d.reply:JSON.stringify(d.result||d,null,2);log(text,'bot',true);refresh()}catch(e){log('Hata: '+e.message,'system');$('voiceStatus').textContent='Jarvis servisi yanıt vermedi.'}}
function startWebSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceStatus').textContent='Bu cihazda ses tanıma motoru yok.';return}if(speechRecognition){speechRecognition.stop();speechRecognition=null;return}const r=new SR();speechRecognition=r;r.lang='tr-TR';r.interimResults=false;r.continuous=false;r.onstart=()=>{$('voiceStatus').textContent='Dinliyorum… konuşun.';$('mic').textContent='Dinleniyor…'};r.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||'';$('message').value=t;chat(t)};r.onerror=e=>{$('voiceStatus').textContent='Ses tanıma hatası: '+e.error};r.onend=()=>{$('mic').textContent='Mikrofon';speechRecognition=null};r.start()}
window.StagepulseAndroidVoiceResult=function(text){if(text){$('message').value=text;chat(text)}$('voiceStatus').textContent=text?'Ses komutu alındı.':'';$('mic').textContent='Mikrofon'};
window.StagepulseAndroidVoiceError=function(text){$('voiceStatus').textContent='Ses tanıma: '+text;$('mic').textContent='Mikrofon'};
$('mic').onclick=()=>{if(window.StagepulseAndroid&&typeof window.StagepulseAndroid.startVoiceRecognition==='function'){window.StagepulseAndroid.startVoiceRecognition();$('voiceStatus').textContent='Dinliyorum…';$('mic').textContent='Dinleniyor…'}else startWebSpeech()};$('speak').onclick=()=>say(lastReply);
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginStatus').textContent='Oturum açılıyor…';try{const {data,error}=await S.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;if(!data.session)throw new Error('Oturum oluşturulamadı');if(!['patron','owner'].includes(data.session.user.app_metadata?.role))throw new Error('Patron yetkisi gerekli');session=data.session;$('login').classList.add('hidden');$('app').classList.remove('hidden');log('Patron Jarvis hazır. Online: '+online);refresh()}catch(e){$('loginStatus').textContent=e.message}});
$('forgotBtn').onclick=()=>{$('resetBox').classList.toggle('hidden');$('resetEmail').value=$('email').value||''};$('resetCancel').onclick=()=>$('resetBox').classList.add('hidden');$('resetRequestForm').addEventListener('submit',async e=>{e.preventDefault();try{const {error}=await S.auth.resetPasswordForEmail($('resetEmail').value.trim(),{redirectTo:location.origin+'/jarvis/admin/'});if(error)throw error;$('resetStatus').textContent='Sıfırlama bağlantısı gönderildi.'}catch(e){$('resetStatus').textContent=e.message}});
$('recoveryForm').addEventListener('submit',async e=>{e.preventDefault();try{const a=$('newPassword').value,b=$('newPassword2').value;if(a!==b)throw new Error('Şifreler eşleşmiyor');if(a.length<10)throw new Error('Şifre en az 10 karakter olmalı');const {data,error}=await S.auth.updateUser({password:a});if(error)throw error;session=(await S.auth.getSession()).data.session;if(!['patron','owner'].includes(data.user.app_metadata?.role))throw new Error('Patron yetkisi gerekli');$('recoveryBox').classList.add('hidden');$('app').classList.remove('hidden');log('Patron Jarvis hazır. Şifre başarıyla güncellendi.');refresh()}catch(e){$('recoveryStatus').textContent=e.message}});
$('logout').onclick=async()=>{await S.auth.signOut();location.reload()};$('send').onclick=()=>chat($('message').value);$('message').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>chat(b.dataset.q));document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=async()=>{try{$('tool').textContent=JSON.stringify(await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:b.dataset.tool,params:{}})}),null,2)}catch(e){$('tool').textContent=e.message}});$('approvals').addEventListener('click',async e=>{const id=e.target.dataset.a||e.target.dataset.r;if(!id)return;try{await call('jarvis-approve',{method:'POST',body:JSON.stringify({approval_id:id,decision:e.target.dataset.a?'approve':'reject'})});refresh()}catch(x){alert(x.message)}});addEventListener('online',()=>{online=true;$('net').textContent='ONLINE';refresh()});addEventListener('offline',()=>{online=false;$('net').textContent='OFFLINE'});$('net').textContent=online?'ONLINE':'OFFLINE';
(async()=>{try{const {data}=await S.auth.getSession();if(data.session&&['patron','owner'].includes(data.session.user.app_metadata?.role)){session=data.session;$('login').classList.add('hidden');$('app').classList.remove('hidden');log('Patron Jarvis hazır. Oturum geri yüklendi.');refresh()}}catch(e){}const hash=new URLSearchParams((location.hash||'').replace(/^#/,''));const code=new URLSearchParams(location.search).get('code');const type=hash.get('type')||new URLSearchParams(location.search).get('type');if(type==='recovery'||code){try{if(code){const r=await S.auth.exchangeCodeForSession(code);if(r.error)throw r.error}else{const r=await S.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(r.error)throw r.error}history.replaceState({},document.title,location.pathname);$('login').classList.add('hidden');$('app').classList.add('hidden');$('recoveryBox').classList.remove('hidden')}catch(e){$('loginStatus').textContent='Sıfırlama bağlantısı geçersiz: '+e.message}}})();
</script></body></html>
