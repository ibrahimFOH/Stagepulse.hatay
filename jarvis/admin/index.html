<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090909"><title>Stagepulse JARVIS • Patron</title>
<script src="/shared/runtime-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4" crossorigin="anonymous"></script>
<style>
:root{--bg:#070707;--panel:#101010;--panel2:#151515;--line:#292929;--gold:#ffb000;--gold2:#ffd36a;--text:#f4f4f4;--muted:#8d8d8d;--ok:#65d48a;--danger:#ff6767}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% -10%,#1c170b 0,#090909 34%,#060606 100%);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{max-width:1320px;margin:auto;padding:18px}.card{background:rgba(16,16,16,.94);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.22)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.brand{font-weight:900;font-size:19px;letter-spacing:.2px}.gold{color:var(--gold)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.65fr);gap:12px}@media(max-width:850px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side .card{margin:0}}@media(max-width:600px){.side{grid-template-columns:1fr}}input,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #333;background:#0b0b0b;color:#fff;outline:0}input:focus{border-color:#765300;box-shadow:0 0 0 3px rgba(255,176,0,.08)}button{border:1px solid #333;border-radius:11px;padding:10px 13px;background:#171717;color:#fff;font-weight:800;cursor:pointer;transition:.15s}button:hover{border-color:#5a4a28;background:#1d1d1d}button.primary{background:var(--gold);color:#111;border-color:var(--gold)}button.voice{border-color:#806000;color:var(--gold2)}button.active{background:#29210e;border-color:var(--gold);color:var(--gold2)}.hidden{display:none!important}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 15px;border:1px solid #3d321d;background:linear-gradient(90deg,#17120a,#101010);border-radius:14px;margin-bottom:12px}.online{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ok);font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}.chat{height:58vh;min-height:420px;overflow:auto;padding:4px 3px 10px;scroll-behavior:smooth}.msg{max-width:88%;padding:11px 13px;border-radius:15px;margin:9px 0;white-space:pre-wrap;line-height:1.5;word-break:break-word}.user{margin-left:auto;background:#202020;border:1px solid #303030}.bot{background:linear-gradient(135deg,#19150c,#121212);border:1px solid #4a3a17}.system{background:#101010;border:1px solid #2a2a2a;color:#aaa;font-size:12px}.meta{font-size:10px;color:#777;margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.compose{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:4px}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.toolbar button{font-size:12px}.statusbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px;font-size:11px}.typing{color:var(--gold2);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}.side h2{font-size:15px;margin:0 0 10px}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #242424}.metric:last-child{border-bottom:0}.metric b{color:var(--gold)}.approval{border:1px solid #3d321d;background:#131109;border-radius:12px;padding:11px;margin:8px 0}.approval pre{white-space:pre-wrap;overflow:auto;color:#aaa;font-size:11px;max-height:180px}.list{white-space:pre-wrap;max-height:250px;overflow:auto;color:#bbb;font-size:11px}.notice{padding:12px;border-radius:12px;background:#17130b;border:1px solid #4b3b17;margin-top:10px}.small{font-size:11px}.loginTitle{font-size:25px;margin:0 0 5px}.kbd{font-size:10px;color:#777;border:1px solid #333;border-radius:5px;padding:2px 5px}.toolsGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.toolsGrid button{width:100%}
</style></head>
<body><main class="wrap">
<section id="login" class="card"><h1 class="loginTitle">Stagepulse <span class="gold">JARVIS</span></h1><p class="muted">Patron Cockpit • Yetkili erişim</p><form id="loginForm"><label>E-posta<input id="email" type="email" autocomplete="username" required></label><label>Şifre<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">JARVIS'i Aç</button> <button id="forgotBtn" type="button">Şifremi Sıfırla</button><p id="loginStatus" class="status"></p></form><section id="resetBox" class="notice hidden"><b>Şifre sıfırlama</b><form id="resetRequestForm"><label>E-posta<input id="resetEmail" type="email" autocomplete="email" required></label><button class="primary" type="submit">Bağlantı Gönder</button><button id="resetCancel" type="button">İptal</button><p id="resetStatus" class="status"></p></form></section></section>
<section id="recoveryBox" class="card hidden"><h2>Yeni Patron Şifresi</h2><form id="recoveryForm"><label>Yeni şifre<input id="newPassword" type="password" autocomplete="new-password" minlength="10" required></label><label>Yeni şifre tekrar<input id="newPassword2" type="password" autocomplete="new-password" minlength="10" required></label><button class="primary" type="submit">Şifreyi Kaydet ve JARVIS'e Gir</button><p id="recoveryStatus" class="status"></p></form></section>
<section id="app" class="hidden"><div class="top"><div class="brand">Stagepulse <span class="gold">JARVIS Patron</span></div><div><span id="net" class="online"><i class="dot"></i>ONLINE</span> <button id="logout">Çıkış</button></div></div><div class="hero"><div><b>Patron Orchestrator</b><div class="muted small">Konuş, sor, veri getir veya onay gerektiren bir işlem iste.</div></div><div><span id="provider" class="kbd">AI: kontrol ediliyor</span></div></div>
<div class="grid"><section class="card"><div id="chat" class="chat"></div><div class="compose"><input id="message" placeholder="JARVIS'e komut ver…" autocomplete="off"><button id="send" class="primary">Gönder</button></div><div class="toolbar"><button id="mic" class="voice">Mikrofon</button><button id="speak">Son yanıtı seslendir</button><button id="autoSpeak">Sesli yanıt: Kapalı</button></div><div class="toolbar"><button data-q="Durumum nedir?">Durum</button><button data-q="Teklifleri özetle">Teklifler</button><button data-q="Etkinlikleri özetle">Etkinlikler</button><button data-q="Ekipman durumunu özetle">Ekipman</button><button data-q="GitHub bağlantısını kontrol et">GitHub</button><button data-q="Ajanları listele">Ajanlar</button></div><div class="statusbar"><span id="voiceStatus" class="muted">Hazır.</span><span><span id="turns">0</span> mesaj</span></div></section>
<aside class="side"><section class="card"><h2>Onay Kuyruğu <span id="count" class="gold">0</span></h2><div id="approvals"><span class="muted small">Bekleyen onay yok.</span></div></section><section class="card"><h2>Araç Merkezi</h2><div class="toolsGrid"><button data-tool="github_status">GitHub</button><button data-tool="agents.list">Ajanlar</button><button data-tool="approvals.list">Onaylar</button></div><pre id="tool" class="list"></pre></section></aside></div></section></main>
<script>
const R=window.STAGEPULSE_RUNTIME||{};const S=supabase.createClient(R.supabaseUrl,R.supabasePublishableKey);const EP=R.supabaseUrl.replace(/\/$/,'')+'/functions/v1/';const $=id=>document.getElementById(id);let session=null,lastReply='',online=navigator.onLine,history=[],speechRecognition=null,autoSpeak=false;
function log(t,c='bot',speak=false){const d=document.createElement('div');d.className='msg '+c;const m=document.createElement('div');m.className='meta';m.textContent=c==='user'?'SEN':c==='bot'?'JARVIS':'SİSTEM';d.appendChild(m);const p=document.createElement('div');p.textContent=t;d.appendChild(p);$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;if(c==='bot'){lastReply=t;if(speak&&autoSpeak)say(t)}$('turns').textContent=history.length}
function headers(){return session?{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}
async function call(path,opts={}){const r=await fetch(EP+path,Object.assign({headers:headers(),cache:'no-store'},opts));const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Servis hatası HTTP '+r.status));return d}
function say(text){if(!text||!('speechSynthesis'in window)){$('voiceStatus').textContent='Bu tarayıcı sesli yanıtı desteklemiyor.';return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';u.rate=.98;u.pitch=1;window.speechSynthesis.speak(u)}
function formatContext(ctx,tool){if(!ctx||!Array.isArray(ctx.items))return '';const items=ctx.items.slice(0,12);if(!items.length)return 'Kayıt bulunamadı.';return items.map((x,i)=>{const name=x.name||x.customer_name||x.company_name||x.title||x.event_name||x.id||('Kayıt '+(i+1));const status=x.status||x.state||'';const date=x.event_date||x.date||'';const price=x.estimated_price||x.total||x.amount||'';return `${i+1}. ${name}${status?' • '+status:''}${date?' • '+date:''}${price?' • '+price:''}`}).join('\n')}
async function chat(t){t=String(t||'').trim();if(!t)return;log(t,'user');history.push({role:'user',content:t});$('message').value='';const typing=document.createElement('div');typing.className='msg bot typing';typing.id='typing';typing.textContent='JARVIS düşünüyor…';$('chat').appendChild(typing);$('chat').scrollTop=$('chat').scrollHeight;try{const d=await call('patron-ai',{method:'POST',body:JSON.stringify({message:t,history:history.slice(-12)})});const node=$('typing');if(node)node.remove();let text=String(d.reply||'');if(d.context&&Array.isArray(d.context.items)&&/teklif|etkinlik|ekipman|personel/.test(t.toLocaleLowerCase('tr-TR'))){const compact=formatContext(d.context,d.read_tool);if(compact&&text.length<80)text+='\n\n'+compact}log(text,'bot',true);history.push({role:'assistant',content:text});$('provider').textContent='AI: '+(d.provider||'fallback');if(d.ai_configured===false)$('provider').textContent='AI: yapılandırılmamış';if(d.proposed_action)$('voiceStatus').textContent='Onay gerektiren işlem kuyruğa alındı.';else $('voiceStatus').textContent='Hazır.';refresh()}catch(e){const node=$('typing');if(node)node.remove();log('JARVIS bağlantı hatası: '+e.message,'system');$('voiceStatus').textContent='Servis yanıt vermedi.'}}
function startWebSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceStatus').textContent='Bu cihazın tarayıcısında ses tanıma yok.';return}if(speechRecognition){speechRecognition.stop();return}const r=new SR();speechRecognition=r;r.lang='tr-TR';r.interimResults=false;r.continuous=false;r.onstart=()=>{$('voiceStatus').textContent='Dinliyorum…';$('mic').textContent='Dinleniyor…';$('mic').classList.add('active')};r.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||'';if(t)chat(t)};r.onerror=e=>{$('voiceStatus').textContent='Ses tanıma hatası: '+e.error};r.onend=()=>{$('mic').textContent='Mikrofon';$('mic').classList.remove('active');speechRecognition=null};r.start()}
window.StagepulseAndroidVoiceResult=function(text){if(text)chat(text);$('voiceStatus').textContent=text?'Ses komutu alındı.':'Hazır.';$('mic').textContent='Mikrofon';$('mic').classList.remove('active')};window.StagepulseAndroidVoiceError=function(text){$('voiceStatus').textContent='Ses tanıma: '+text;$('mic').textContent='Mikrofon';$('mic').classList.remove('active')};
$('mic').onclick=()=>{if(window.StagepulseAndroid&&typeof window.StagepulseAndroid.startVoiceRecognition==='function'){window.StagepulseAndroid.startVoiceRecognition();$('voiceStatus').textContent='Dinliyorum…';$('mic').textContent='Dinleniyor…';$('mic').classList.add('active')}else startWebSpeech()};$('speak').onclick=()=>say(lastReply);$('autoSpeak').onclick=()=>{autoSpeak=!autoSpeak;$('autoSpeak').textContent='Sesli yanıt: '+(autoSpeak?'Açık':'Kapalı');$('autoSpeak').classList.toggle('active',autoSpeak)};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginStatus').textContent='Oturum açılıyor…';try{const {data,error}=await S.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!data.session)throw new Error('Oturum oluşturulamadı');if(!['patron','owner'].includes(data.session.user.app_metadata?.role))throw new Error('Patron yetkisi gerekli');session=data.session;openApp('Patron JARVIS hazır.');}catch(e){$('loginStatus').textContent=e.message}});
function openApp(message){$('login').classList.add('hidden');$('recoveryBox').classList.add('hidden');$('app').classList.remove('hidden');if(message)log(message,'system');refresh()}
$('forgotBtn').onclick=()=>{$('resetBox').classList.toggle('hidden');$('resetEmail').value=$('email').value||''};$('resetCancel').onclick=()=>$('resetBox').classList.add('hidden');$('resetRequestForm').addEventListener('submit',async e=>{e.preventDefault();try{const {error}=await S.auth.resetPasswordForEmail($('resetEmail').value.trim(),{redirectTo:location.origin+'/jarvis/admin/'});if(error)throw error;$('resetStatus').textContent='Sıfırlama bağlantısı gönderildi.'}catch(e){$('resetStatus').textContent=e.message}});
$('recoveryForm').addEventListener('submit',async e=>{e.preventDefault();try{const a=$('newPassword').value,b=$('newPassword2').value;if(a!==b)throw new Error('Şifreler eşleşmiyor');if(a.length<10)throw new Error('Şifre en az 10 karakter olmalı');const {data,error}=await S.auth.updateUser({password:a});if(error)throw error;session=(await S.auth.getSession()).data.session;openApp('Şifre güncellendi. Patron JARVIS hazır.');}catch(e){$('recoveryStatus').textContent=e.message}});
async function refresh(){try{const d=await call('jarvis-approve');const a=d.approvals||d.result||[];$('count').textContent=a.filter(x=>x.status==='pending').length;$('approvals').innerHTML='';const pending=a.filter(x=>x.status==='pending');if(!pending.length){$('approvals').innerHTML='<span class="muted small">Bekleyen onay yok.</span>';return}pending.forEach(x=>{const e=document.createElement('div');e.className='approval';e.innerHTML='<b>'+String(x.type||'İşlem')+'</b><p>'+String(x.preview?.title||'Patron onayı gerekli')+'</p><pre>'+JSON.stringify(x.payload||{},null,2).slice(0,2200)+'</pre><button class="primary" data-a="'+x.id+'">Onayla</button> <button data-r="'+x.id+'">Reddet</button>';$('approvals').appendChild(e)})}catch(e){$('approvals').textContent='Onay servisi: '+e.message}}
$('logout').onclick=async()=>{await S.auth.signOut();location.reload()};$('send').onclick=()=>chat($('message').value);$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>chat(b.dataset.q));document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=async()=>{try{$('tool').textContent='Yükleniyor…';const d=await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:b.dataset.tool,params:{}})});$('tool').textContent=JSON.stringify(d.result??d,null,2)}catch(e){$('tool').textContent=e.message}});$('approvals').addEventListener('click',async e=>{const id=e.target.dataset.a||e.target.dataset.r;if(!id)return;try{await call('jarvis-approve',{method:'POST',body:JSON.stringify({approval_id:id,decision:e.target.dataset.a?'approve':'reject'})});refresh()}catch(x){alert(x.message)}});addEventListener('online',()=>{online=true;$('net').innerHTML='<i class="dot"></i>ONLINE';refresh()});addEventListener('offline',()=>{online=false;$('net').textContent='OFFLINE';$('net').style.color='#ff6767'});
(async()=>{try{const {data}=await S.auth.getSession();if(data.session&&['patron','owner'].includes(data.session.user.app_metadata?.role)){session=data.session;openApp('Oturum geri yüklendi. Patron JARVIS hazır.')}}catch(e){}const hash=new URLSearchParams((location.hash||'').replace(/^#/,''));const code=new URLSearchParams(location.search).get('code');const type=hash.get('type')||new URLSearchParams(location.search).get('type');if(type==='recovery'||code){try{if(code){const r=await S.auth.exchangeCodeForSession(code);if(r.error)throw r.error}else{const r=await S.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(r.error)throw r.error}history.replaceState({},document.title,location.pathname);$('login').classList.add('hidden');$('app').classList.add('hidden');$('recoveryBox').classList.remove('hidden')}catch(e){$('loginStatus').textContent='Sıfırlama bağlantısı geçersiz: '+e.message}}})();
</script></body></html>
