<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Stagepulse JARVIS Patron</title><script src="/shared/runtime-config.js"></script><script src="/jarvis/core/config.js"></script><style>body{margin:0;background:#070707;color:#fff;font:15px system-ui}main{max-width:1250px;margin:auto;padding:16px}.card{background:#101010;border:1px solid #2b2b2b;border-radius:16px;padding:16px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{font:inherit}button{padding:11px 14px;border-radius:10px;border:1px solid #444;background:#171717;color:#fff;font-weight:700}button.primary{background:#ffb000;color:#111}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1.6fr .8fr;gap:10px}.chat{height:54vh;overflow:auto;border:1px solid #262626;border-radius:12px;padding:10px}.msg{margin:8px 0;padding:10px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}.u{background:#202020}.a{background:#17130a;border:1px solid #4a3a17}.s{color:#aaa;font-size:12px}.compose{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}input{background:#090909;color:#fff;border:1px solid #363636;border-radius:10px;padding:13px;box-sizing:border-box;width:100%}.muted{color:#999}.gold{color:#ffb000}.pill{padding:4px 8px;border:1px solid #3b3b3b;border-radius:999px;font-size:11px;color:#bbb}.approval{border:1px solid #493b1a;border-radius:10px;padding:10px;margin:6px 0}.approval button{font-size:12px;padding:8px 10px}@media(max-width:850px){.grid{grid-template-columns:1fr}.chat{height:48vh}}</style></head><body><main>
<section id="login" class="card"><h1>Stagepulse <span class="gold">JARVIS</span></h1><p class="muted">Patron Cockpit • güvenli operasyon merkezi</p><input id="email" type="email" autocomplete="username" value="teklifal@stagepulse.com.tr"><div style="height:8px"></div><input id="password" type="password" autocomplete="current-password" placeholder="Şifre"><div class="row" style="margin-top:10px"><button id="open" class="primary" type="button">JARVIS'i Aç</button><button id="reset" type="button">Şifremi Sıfırla</button></div><p id="status">Hazır.</p></section>
<section id="app" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><div><b>Patron Orchestrator</b> <span id="net" class="pill">ONLINE</span> <span id="provider" class="pill">fallback</span></div><div class="row"><button id="health" type="button">Sistem Testi</button><button id="logout" type="button">Çıkış</button></div></div></div><div class="grid"><section class="card"><div id="chat" class="chat"></div><div class="compose"><input id="msg" placeholder="JARVIS'e yaz…"><button id="send" class="primary" type="button">Gönder</button></div><div class="row" style="margin-top:8px"><button id="mic" type="button">Mikrofon</button><button id="speak" type="button">Seslendir</button><button id="auto" type="button">Oto Ses: Kapalı</button></div><div class="row" style="margin-top:8px"><button data-q="Durumum nedir?" type="button">Durum</button><button data-q="Teklifleri özetle" type="button">Teklifler</button><button data-q="Etkinlikleri özetle" type="button">Etkinlikler</button><button data-q="Ekipman durumunu özetle" type="button">Ekipman</button><button data-q="Personeli listele" type="button">Personel</button><button data-q="Ajanları listele" type="button">Ajanlar</button><button data-q="Onayları listele" type="button">Onaylar</button></div><p id="voice" class="muted">Ses hazır.</p></section><aside class="card"><h3>Onay Kuyruğu <span id="count" class="gold">0</span></h3><div id="approvals" class="muted">Yükleniyor…</div><hr><h3>Araç Merkezi</h3><div class="row"><button data-tool="github_status">GitHub</button><button data-tool="agents.list">Ajanlar</button><button data-tool="approvals.list">Onaylar</button></div><pre id="tool" class="muted"></pre></aside></div></section></main>
<script>(function(){'use strict';const R=window.STAGEPULSE_RUNTIME||{},C=window.STAGEPULSE_JARVIS_CONFIG||{},URL=R.supabaseUrl||C.supabaseUrl||'',KEY=R.supabasePublishableKey||C.publishableKey||'',F=C.functions||{};let token=sessionStorage.getItem('stagepulse_jarvis_token')||null,lastReply='',autoSpeak=false,recognizer=null;const $=id=>document.getElementById(id);function fn(n){return F[n]||URL+'/functions/v1/'+n}function H(){return{'apikey':KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}async function api(u,m='GET',b){const r=await fetch(u,{method:m,headers:H(),cache:'no-store',body:b===undefined?undefined:JSON.stringify(b)});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(!r.ok)throw Error(d.error||d.message||('HTTP '+r.status));return d}function log(t,k='a'){const e=document.createElement('div');e.className='msg '+k;e.textContent=t;$('chat').appendChild(e);$('chat').scrollTop=$('chat').scrollHeight}function say(t){if(!t||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.98;speechSynthesis.speak(u)}async function login(){const b=$('open'),email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('status').textContent='E-posta ve şifre gerekli.';return}b.disabled=true;$('status').textContent='Giriş doğrulanıyor…';try{const d=await api(URL+'/auth/v1/token?grant_type=password','POST',{email,password});if(!d.access_token)throw Error('Token alınamadı');const u=d.user||{},a=u.app_metadata||{},m=u.user_metadata||{};if(!(['patron','owner','admin'].includes(a.role)||m.admin_access===true||['owner','admin'].includes(m.organization_role)))throw Error('Patron yetkisi bulunmuyor');token=d.access_token;sessionStorage.setItem('stagepulse_jarvis_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('status').textContent='';log('Patron oturumu açıldı.','s');await refresh()}catch(e){token=null;sessionStorage.removeItem('stagepulse_jarvis_token');$('status').textContent='Giriş başarısız: '+e.message}finally{b.disabled=false}}async function chat(){const text=$('msg').value.trim();if(!text||!token)return;log('SEN: '+text,'u');$('msg').value='';try{const d=await api(fn('patronAI'),'POST',{message:text});lastReply=String(d.reply||'');log('JARVIS: '+(lastReply||'Yanıt yok'));$('provider').textContent='AI: '+(d.provider||'fallback');if(d.proposed_action)log('İşlem onay kuyruğuna eklendi.','s');if(autoSpeak)say(lastReply);await refresh()}catch(e){log('JARVIS servis hatası: '+e.message,'s')}}async function refresh(){try{const d=await api(fn('approve'));const list=(d.approvals||[]).filter(x=>x.status==='pending');$('count').textContent=list.length;$('approvals').innerHTML=list.length?list.map(x=>`<div class="approval"><b>${String(x.preview?.title||x.type||x.id)}</b><div class="muted">${String(x.preview?.risk||'high')}</div><div class="row"><button data-approve="${String(x.id)}">Onayla</button><button data-reject="${String(x.id)}">Reddet</button></div></div>`).join(''):'Bekleyen onay yok.';document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>decide(b.dataset.approve,'approve'));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>decide(b.dataset.reject,'reject'))}catch(e){$('approvals').textContent='Onay servisi: '+e.message}}async function decide(id,d){try{await api(fn('approve'),'POST',{approval_id:id,decision:d});await refresh();log(d==='approve'?'Onaylandı.':'Reddedildi.','s')}catch(e){log('Onay hatası: '+e.message,'s')}}async function tool(n){try{$('tool').textContent=JSON.stringify(await api(fn('tools'),'POST',{tool:n,params:{limit:50}}),null,2)}catch(e){$('tool').textContent='Hata: '+e.message}}async function health(){try{const d=await api(fn('patronAI'),'POST',{message:'JARVIS sistem testi: Supabase bağlantısı, ajanlar, onaylar, GitHub ve AI durumunu özetle.'});log('SİSTEM TESTİ: '+d.reply,'s')}catch(e){log('SİSTEM TESTİ HATASI: '+e.message,'s')}}function startVoice(){if(window.StagepulseAndroid&&typeof window.StagepulseAndroid.startVoiceRecognition==='function'){window.StagepulseAndroid.startVoiceRecognition();$('voice').textContent='Android ses tanıma dinliyor…';return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voice').textContent='Tarayıcı konuşma tanımayı desteklemiyor.';return}if(!window.isSecureContext){$('voice').textContent='Mikrofon için HTTPS gerekli.';return}recognizer=new SR();recognizer.lang='tr-TR';recognizer.interimResults=false;recognizer.maxAlternatives=1;recognizer.onstart=()=>{$('voice').textContent='Dinliyor…'};recognizer.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript?.trim()||'';$('voice').textContent=t?('Algılandı: '+t):'Konuşma anlaşılamadı.';if(t){$('msg').value=t;chat()}};recognizer.onerror=e=>{$('voice').textContent='Ses hatası: '+e.error};recognizer.onend=()=>{if($('voice').textContent==='Dinliyor…')$('voice').textContent='Ses hazır.'};recognizer.start()}window.StagepulseAndroidVoiceResult=t=>{$('voice').textContent='Algılandı: '+t;$('msg').value=t;chat()};window.StagepulseAndroidVoiceError=t=>{$('voice').textContent=t};$('open').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('send').onclick=chat;$('msg').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();chat()}};$('logout').onclick=()=>{sessionStorage.removeItem('stagepulse_jarvis_token');location.reload()};$('mic').onclick=startVoice;$('speak').onclick=()=>say(lastReply);$('auto').onclick=()=>{autoSpeak=!autoSpeak;$('auto').textContent='Oto Ses: '+(autoSpeak?'Açık':'Kapalı')};$('health').onclick=health;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('msg').value=b.dataset.q;chat()});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>tool(b.dataset.tool));if(token)api(fn('approve')).then(()=>{$('login').classList.add('hidden');$('app').classList.remove('hidden');log('Oturum geri yüklendi.','s');refresh()}).catch(()=>{token=null;sessionStorage.removeItem('stagepulse_jarvis_token')})})();</script></body></html>
