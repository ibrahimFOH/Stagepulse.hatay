<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Stagepulse JARVIS • Patron</title><script src="/shared/runtime-config.js"></script><style>body{margin:0;background:#070707;color:#fff;font:15px system-ui}main{max-width:1200px;margin:auto;padding:16px}.card{background:#101010;border:1px solid #2b2b2b;border-radius:16px;padding:16px;margin:10px 0}button,input{font:inherit}button{padding:12px 14px;border-radius:10px;border:1px solid #444;background:#171717;color:#fff;font-weight:700}button.primary{background:#ffb000;color:#111}.row{display:flex;gap:8px;flex-wrap:wrap}.chat{height:55vh;overflow:auto;border:1px solid #262626;border-radius:12px;padding:10px}.msg{margin:8px 0;padding:10px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}.u{background:#202020;text-align:right}.a{background:#17130a;border:1px solid #4a3a17}.s{background:#111;color:#aaa;font-size:12px}.compose{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}input{background:#090909;color:#fff;border:1px solid #363636;border-radius:10px;padding:13px;width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:1.6fr .8fr;gap:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}}pre{white-space:pre-wrap;word-break:break-word}.muted{color:#999}.gold{color:#ffb000}</style></head><body><main>
<section id="login" class="card"><h1>Stagepulse <span class="gold">JARVIS</span></h1><p class="muted">Patron Cockpit</p><input id="email" type="email" value="teklifal@stagepulse.com.tr" autocomplete="username"><div style="height:8px"></div><input id="password" type="password" autocomplete="current-password" placeholder="Şifre"><div class="row" style="margin-top:10px"><button id="open" class="primary" type="button">JARVIS'i Aç</button><button id="reset" type="button">Şifremi Sıfırla</button></div><p id="status" class="muted">Hazır.</p></section>
<section id="app" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><b>Patron Orchestrator</b><button id="logout" type="button">Çıkış</button></div><p id="net" class="muted">Oturum kontrol ediliyor…</p></div><div class="grid"><section class="card"><div id="chat" class="chat"></div><div class="compose"><input id="msg" placeholder="JARVIS'e yaz…"><button id="send" class="primary" type="button">Gönder</button></div><div class="row" style="margin-top:8px"><button data-q="Durumum nedir?" type="button">Durum</button><button data-q="Teklifleri özetle" type="button">Teklifler</button><button data-q="Etkinlikleri özetle" type="button">Etkinlikler</button><button data-q="Ekipman durumunu özetle" type="button">Ekipman</button><button data-q="Ajanları listele" type="button">Ajanlar</button><button data-q="Onayları listele" type="button">Onaylar</button></div></section><aside class="card"><h3>Onay Kuyruğu <span id="count" class="gold">0</span></h3><div id="approvals" class="muted">Yükleniyor…</div><hr><h3>Araç</h3><div class="row"><button data-tool="github_status" type="button">GitHub</button><button data-tool="agents.list" type="button">Ajanlar</button><button data-tool="approvals.list" type="button">Onaylar</button></div><pre id="tool" class="muted"></pre></aside></div></section></main>
<script>(function(){'use strict';const R=window.STAGEPULSE_RUNTIME||{},URL=String(R.supabaseUrl||'').replace(/\/$/,''),KEY=String(R.supabasePublishableKey||''),EP=URL+'/functions/v1/';let token=null;const $=id=>document.getElementById(id);function headers(){return {'Content-Type':'application/json','apikey':KEY,...(token?{Authorization:'Bearer '+token}:{})}}async function request(path,method='GET',body){const r=await fetch(EP+path,{method,headers:headers(),cache:'no-store',body:body?JSON.stringify(body):undefined});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(!r.ok)throw new Error(d.error||d.message||`HTTP ${r.status}`);return d}function log(t,k='a'){const d=document.createElement('div');d.className='msg '+k;d.textContent=t; $('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('status').textContent='E-posta ve şifre gerekli.';return}const b=$('open');b.disabled=true;$('status').textContent='Supabase oturumu doğrulanıyor…';try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Giriş başarısız');token=d.access_token;if(!token)throw new Error('Oturum tokenı alınamadı');const u=d.user||{},a=u.app_metadata||{},m=u.user_metadata||{};const ok=['patron','owner','admin'].includes(a.role)||m.admin_access===true||['owner','admin'].includes(m.organization_role);if(!ok)throw new Error('Patron yetkisi bulunmuyor');sessionStorage.setItem('stagepulse_jarvis_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('net').textContent='● ONLINE';log('Patron oturumu açıldı.','s');await refresh()}catch(e){token=null;sessionStorage.removeItem('stagepulse_jarvis_token');$('status').textContent='Giriş başarısız: '+e.message}finally{b.disabled=false}}async function chat(){const x=$('msg').value.trim();if(!x||!token)return;log('SEN: '+x,'u');$('msg').value='';try{const d=await request('patron-ai','POST',{message:x});log('JARVIS: '+(d.reply||'Yanıt yok'));await refresh()}catch(e){log('JARVIS servis hatası: '+e.message,'s')}}async function refresh(){try{const d=await request('jarvis-approve');const list=(d.approvals||[]).filter(x=>x.status==='pending');$('count').textContent=list.length;$('approvals').textContent=list.length?list.map(x=>(x.preview&&x.preview.title)||x.type||x.id).join('\n'):'Bekleyen onay yok.'}catch(e){$('approvals').textContent='Onay servisi: '+e.message}}async function tool(n){try{$('tool').textContent='Yükleniyor…';const d=await request('jarvis-tools','POST',{tool:n,params:{limit:50}});$('tool').textContent=JSON.stringify(d.result||d,null,2)}catch(e){$('tool').textContent='Hata: '+e.message}}$('open').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('send').onclick=chat;$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();chat()}});$('logout').onclick=()=>{token=null;sessionStorage.removeItem('stagepulse_jarvis_token');location.reload()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('msg').value=b.dataset.q;chat()});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>tool(b.dataset.tool));const saved=sessionStorage.getItem('stagepulse_jarvis_token');if(saved){token=saved;request('jarvis-approve').then(()=>{$('login').classList.add('hidden');$('app').classList.remove('hidden');$('net').textContent='● ONLINE';log('Oturum geri yüklendi.','s');refresh()}).catch(()=>{token=null;sessionStorage.removeItem('stagepulse_jarvis_token')})}})();</script></body></html>
