<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0b0b"><title>Stagepulse Jarvis • Patron</title><script src="/shared/runtime-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/integrity-placeholder" crossorigin="anonymous"></script><style>html,body{margin:0;background:#090909;color:#eee;font:15px system-ui,sans-serif}body{min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#121212;border:1px solid #2a2a2a;border-radius:18px;padding:18px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900;font-size:20px}.gold{color:#ffb000}.muted{color:#999}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}input,textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0d0d0d;color:#fff;margin:6px 0 12px}button{border:1px solid #333;border-radius:10px;padding:11px 14px;background:#181818;color:#fff;font-weight:800;cursor:pointer;margin:4px}button.primary{background:#ffb000;color:#111;border-color:#ffb000}button.danger{border-color:#6b3030}.hidden{display:none}.chat{height:55vh;overflow:auto}.msg{padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap}.user{background:#1d1d1d}.bot{background:#17130a;border:1px solid #493b18}.row{display:flex;gap:8px}.row>*{flex:1}.approval{border:1px solid #3b321c;border-radius:12px;padding:12px;margin:8px 0}.approval pre{white-space:pre-wrap;overflow:auto;color:#bbb}.status{font-weight:800}</style></head><body><main class="wrap"><section id="login" class="card"><h1>Stagepulse <span class="gold">Jarvis</span></h1><p class="muted">Patron erişimi zorunludur. Oturum açmadan hiçbir araç çalışmaz.</p><form id="loginForm"><label>E-posta<input id="email" type="email" autocomplete="username" required></label><label>Şifre<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Giriş / Kilidi Aç</button><p id="loginStatus" class="status"></p></form></section><section id="app" class="hidden"><div class="top"><div class="brand">Stagepulse <span class="gold">Jarvis Patron</span></div><div><span id="net" class="muted"></span><button id="logout">Çıkış</button></div></div><div class="grid"><section class="card"><div id="chat" class="chat"></div><div class="row"><input id="message" placeholder="durum · teklifleri listele · etkinlikleri göster · ekipman durumu"><button id="send" class="primary">Gönder</button></div><div><button data-q="durum">Durum</button><button data-q="teklifleri listele">Teklifler</button><button data-q="etkinlikleri göster">Etkinlikler</button><button data-q="ekipman durumu">Ekipman</button></div></section><aside><section class="card"><h2>Onaylar <span id="count" class="gold">0</span></h2><div id="approvals"></div></section><section class="card"><h2>Araç</h2><div class="row"><button data-tool="github_status">GitHub</button><button data-tool="agents.list">Ajanlar</button></div><pre id="tool" class="muted"></pre></section></aside></div></section></main><script>const R=window.STAGEPULSE_RUNTIME||{};const S=supabase.createClient(R.supabaseUrl,R.supabasePublishableKey);const EP=R.supabaseUrl.replace(/\/$/,'')+'/functions/v1/';const $=id=>document.getElementById(id);let session=null;let online=navigator.onLine;function log(t,c='bot'){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}function headers(){return session?{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}async function call(path,opts={}){const r=await fetch(EP+path,Object.assign({headers:headers()},opts));const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Servis hatası');return d}async function refresh(){try{const d=await call('jarvis-approve');const a=d.approvals||[];$('count').textContent=a.filter(x=>x.status==='pending').length;$('approvals').innerHTML='';a.filter(x=>x.status==='pending').forEach(x=>{const e=document.createElement('div');e.className='approval';e.innerHTML='<b>'+String(x.type)+'</b><p>'+String(x.preview?.title||'İşlem')+'</p><pre>'+JSON.stringify(x.payload||{},null,2).slice(0,3000)+'</pre><button class="primary" data-a="'+x.id+'">Onayla</button><button class="danger" data-r="'+x.id+'">Reddet</button>';$('approvals').appendChild(e)})}catch(e){$('approvals').textContent=e.message}}async function chat(t){if(!t)return;log(t,'user');$('message').value='';try{const low=t.toLocaleLowerCase('tr-TR');let d;if(/teklif|lead/.test(low))d=await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:'list_leads',params:{limit:20}})});else if(/etkinlik|event/.test(low))d=await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:'list_events',params:{limit:20}})});else if(/ekipman/.test(low))d=await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:'equipment_status',params:{limit:50}})});else if(/github/.test(low))d=await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:'github_status',params:{}})});else d=await call('patron-ai',{method:'POST',body:JSON.stringify({message:t})});log(typeof d.reply==='string'?d.reply:JSON.stringify(d.result||d,null,2));refresh()}catch(e){log('Hata: '+e.message)}}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginStatus').textContent='Oturum açılıyor…';try{const {data,error}=await S.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;if(!data.session)throw new Error('Oturum oluşturulamadı');if(!['patron','owner'].includes(data.session.user.app_metadata?.role))throw new Error('Patron yetkisi gerekli');session=data.session;$('login').classList.add('hidden');$('app').classList.remove('hidden');log('Patron Jarvis hazır. Online: '+online);refresh()}catch(e){$('loginStatus').textContent=e.message}});$('logout').onclick=async()=>{await S.auth.signOut();location.reload()};$('send').onclick=()=>chat($('message').value.trim());$('message').addEventListener('keydown',e=>{if(e.key==='Enter'){$('send').click()}});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>chat(b.dataset.q));document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=async()=>{try{$('tool').textContent=JSON.stringify(await call('jarvis-tools',{method:'POST',body:JSON.stringify({tool:b.dataset.tool,params:{}})}),null,2)}catch(e){$('tool').textContent=e.message}});$('approvals').addEventListener('click',async e=>{const id=e.target.dataset.a||e.target.dataset.r;if(!id)return;try{await call('jarvis-approve',{method:'POST',body:JSON.stringify({approval_id:id,decision:e.target.dataset.a?'approve':'reject'})});refresh()}catch(x){alert(x.message)}});addEventListener('online',()=>{online=true;$('net').textContent='ONLINE';refresh()});addEventListener('offline',()=>{online=false;$('net').textContent='OFFLINE'});$('net').textContent=online?'ONLINE':'OFFLINE';</script></body></html>
