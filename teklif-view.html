<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Stagepulse Teklif</title><link rel="stylesheet" href="style.css"><style>body{background:#080808;color:#eee;font-family:Inter,system-ui}.quote{max-width:850px;margin:50px auto;padding:28px}.qbox{background:#111;border:1px solid #2b2b2b;border-radius:16px;padding:26px}.qtotal{font-size:32px;font-weight:900;margin:20px 0}.qactions{display:flex;gap:10px;flex-wrap:wrap}.qbtn{padding:13px 18px;border-radius:9px;border:1px solid #333;background:#1b1b1b;color:#fff;cursor:pointer}.qbtn.ok{background:#ffb000;color:#111;border-color:#ffb000}.qbtn:disabled{opacity:.5;cursor:not-allowed}.muted{color:#888}.pdfbox{margin-top:18px;padding:16px;border:1px solid #2b2b2b;border-radius:12px;background:#0d0d0d}.pdfbox iframe{width:100%;height:70vh;border:0;border-radius:8px;background:#fff}.hidden{display:none}</style></head><body><main class="quote"><div class="qbox" id="quoteBox">Teklif yükleniyor…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/shared/runtime-config.js?v=20260831-02"></script><script>const __cfg=(typeof globalThis!=='undefined'?globalThis:window).STAGEPULSE_RUNTIME||{};const sb=window.supabase.createClient(__cfg.supabaseUrl||'',__cfg.supabasePublishableKey||'');if(!__cfg.supabaseUrl||!__cfg.supabasePublishableKey){document.getElementById('quoteBox').textContent='Yapılandırma yüklenemedi.';throw new Error('STAGEPULSE_RUNTIME missing')}const params=new URLSearchParams(location.search),token=params.get('token'),code=params.get('code');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(v)||0);const edge=async(action,extra={})=>{const r=await fetch((__cfg.supabaseUrl||'').replace(/\/$/,'')+'/functions/v1/offer-pdf-v3',{method:'POST',headers:{'Content-Type':'application/json',apikey:__cfg.supabasePublishableKey||''},body:JSON.stringify({action,...extra})});const out=await r.json();if(!r.ok)throw new Error(out?.error||'İşlem başarısız.');return out};function fail(msg){document.getElementById('quoteBox').innerHTML='<h2>'+esc(msg)+'</h2>'}async function load(){let q,error;try{if(code){({data:q,error}=await sb.rpc('get_public_quote_by_code',{p_code:code}))}else if(token){const out=await edge('customer_quote',{token});q=out.quote}else return fail('Geçersiz teklif bağlantısı. Lütfen bağlantıyı kontrol edin.')}catch(_e){return fail('Teklif yüklenirken bir sorun oluştu. Lütfen daha sonra tekrar deneyin.')}if(error||!q)return fail('Teklif bulunamadı veya bağlantının süresi dolmuş.');document.title=(q.quote_number||'Teklif')+' | Stagepulse';const canRespond=q.status==='sent'||q.status==='preparing';const pdf=q.pdf&&q.pdf.available!==false;let actionsHtml=canRespond?'<button class="qbtn ok" onclick="respond(\'accepted\')">Teklifi Onayla</button><button class="qbtn" onclick="respond(\'rejected\')">Teklifi Reddet</button>':'<span class="muted">Durum: '+esc(statusLabel(q.status))+'</span>';let pdfHtml=pdf?'<section class="pdfbox" id="pdfBox"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>Teklif PDF</b><div class="muted">Müşteri için hazırlanmış güncel belge</div></div><button class="qbtn" id="pdfOpen">PDFyi Aç</button></div><iframe id="pdfFrame" title="Teklif PDF Önizleme" class="hidden"></iframe></section>':'';document.getElementById('quoteBox').innerHTML='<h1>STAGEPULSE</h1><p class="muted">Profesyonel Ses & Sahne Teknolojileri</p><hr><h2>Teklif '+esc(q.quote_number)+'</h2><p><b>'+esc(q.name)+'</b><br>'+esc(q.company||'')+'<br>'+esc(q.location||'')+'</p><p>Etkinlik: '+esc(q.event_type||q.type||'-')+' · '+esc(q.event_date||'-')+' · '+esc(q.people||'-')+' kişi</p><div class="qtotal">'+money(q.total)+'</div><p>Geçerlilik: <b>'+esc(q.valid_until||'-')+'</b></p><div class="qactions">'+actionsHtml+'</div><p id="msg" class="muted"></p>'+pdfHtml;if(pdf)document.getElementById('pdfOpen').onclick=async()=>{const btn=document.getElementById('pdfOpen');btn.disabled=true;try{const out=await edge('customer_url',code?{code}:{token});const f=document.getElementById('pdfFrame');f.src=out.url;f.classList.remove('hidden');f.scrollIntoView({behavior:'smooth'})}catch(e){document.getElementById('msg').textContent=e.message||'PDF şu anda açılamıyor.'}finally{btn.disabled=false}}}function statusLabel(status){const map={accepted:'Onaylandı',rejected:'Reddedildi',cancelled:'İptal edildi',archived:'Arşivlendi',expired:'Süresi doldu',new:'Yeni',reviewing:'İnceleniyor',preparing:'Hazırlanıyor',sent:'Gönderildi'};return map[status]||status}async function respond(action){const msgEl=document.getElementById('msg'),buttons=document.querySelectorAll('.qbtn');buttons.forEach(b=>b.disabled=true);try{let error;if(code)({error}=await sb.rpc('respond_to_quote_code',{p_code:code,p_action:action}));else{await edge('customer_respond',{token,response:action})}if(error){msgEl.textContent='İşlem gerçekleştirilemedi. Teklifin süresi dolmuş veya zaten yanıtlanmış olabilir.';buttons.forEach(b=>b.disabled=false);return}msgEl.textContent=action==='accepted'?'Teklifiniz onaylandı. Stagepulse sizinle iletişime geçecektir.':'Teklif reddedildi. İlginiz için teşekkürler.';setTimeout(load,500)}catch(e){msgEl.textContent=e.message||'Bir bağlantı sorunu oluştu. Lütfen tekrar deneyin.';buttons.forEach(b=>b.disabled=false)}}load();</script></body></html>
