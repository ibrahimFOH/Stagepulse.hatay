# Stagepulse Supabase config
# verify_jwt=false yalnızca açık kayıt gibi sınırlı herkese açık işlemler veya fonksiyon içi oturum/token/yetki kontrolü varsa kullanılır.
# Bu dosya functions-manifest.json ile scripts/validate-web-security.mjs tarafından eşitlenir.

[api]
enabled = true
schemas = ["public", "graphql_public"]

[functions.admin-data]
verify_jwt = true

[functions.admin-login]
verify_jwt = false

[functions.admin-password-reset]
verify_jwt = false

[functions.license-admin]
verify_jwt = false

[functions.org-admin-control]
verify_jwt = true

[functions.portal-login]
verify_jwt = false

[functions.production-os]
verify_jwt = false

[functions.register-android-device]
verify_jwt = true

[functions.self-password-change]
verify_jwt = true

[functions.send-fcm-notification]
verify_jwt = false

[functions.ses-merkezi-desktop]
verify_jwt = false

[functions.sesm-education-admin]
verify_jwt = true

[functions.staff-manage]
verify_jwt = false

[functions.license-core]
verify_jwt = true
