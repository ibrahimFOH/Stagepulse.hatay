version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /android/license-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: gradle
    directory: /license-manager-app/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /desktop-license
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
