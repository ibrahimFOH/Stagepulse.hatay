name: Vendor Firebase SDK

on:
  push:
    branches: [main]
    paths:
      - 'portal/fcm-register.js'
      - 'firebase-messaging-sw.js'
      - '.github/workflows/vendor-firebase-sdk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned Firebase SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/firebase
          curl --fail --location --retry 3 --retry-delay 2 \
            https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js \
            -o vendor/firebase/firebase-app-compat.js
          curl --fail --location --retry 3 --retry-delay 2 \
            https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js \
            -o vendor/firebase/firebase-messaging-compat.js
          test -s vendor/firebase/firebase-app-compat.js
          test -s vendor/firebase/firebase-messaging-compat.js
          grep -q 'firebase' vendor/firebase/firebase-app-compat.js
          grep -q 'messaging' vendor/firebase/firebase-messaging-compat.js

      - name: Commit vendor files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/firebase/firebase-app-compat.js vendor/firebase/firebase-messaging-compat.js
          if git diff --cached --quiet; then
            echo 'Firebase SDK vendor files are already current.'
            exit 0
          fi
          git commit -m 'chore: vendor Firebase web SDK'
          git push origin HEAD:main
