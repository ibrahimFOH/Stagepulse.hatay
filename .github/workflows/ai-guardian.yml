name: Stagepulse Autonomous Guardian

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: stagepulse-guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardian:
    name: Guardian diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repository security baseline
        shell: bash
        run: |
          set -euo pipefail
          echo 'Running secret/private-key baseline scan...'

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.md' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*["'"'`][A-Za-z0-9._-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            .; then
            echo 'Potential literal credential/private key detected.'
            exit 1
          fi

          echo 'Secret baseline passed.'

      - name: Production-impact policy check
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/ai-guardian.config.yml
          test -f .github/agents/guardian.md
          test -f .github/agents/debugger.md
          test -f .github/agents/tester.md
          test -f .github/agents/fixer.md

          echo 'Guardian policy/config present.'

      - name: Domain smoke check
        shell: bash
        run: |
          set -euo pipefail

          for url in \
            https://stagepulse.com.tr/ \
            https://stagepulse.com.tr/admin \
            https://stagepulse.com.tr/portal; do

            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url")
            echo "$url -> $code"

            case "$code" in
              2*|3*) ;;
              *)
                echo "Smoke check failed for $url"
                exit 1
                ;;
            esac
          done

      - name: Firebase endpoint reachability
        shell: bash
        run: |
          set -euo pipefail

          echo 'Checking public Firebase endpoint reachability only.'
          curl -I -sS --max-time 15 https://firebaseinstallations.googleapis.com/ >/dev/null
          curl -I -sS --max-time 15 https://fcm.googleapis.com/ >/dev/null
          echo 'Firebase public endpoints are reachable from the runner.'

      - name: Guardian workflow policy check
        shell: bash
        run: |
          set -euo pipefail

          echo 'Checking workflow files for unsafe production mutation patterns...'

          if grep -RInE \
            --include='*.yml' \
            --include='*.yaml' \
            'git push .*main|git push origin main|force-with-lease.*main' \
            .github/workflows; then
            echo 'Unsafe direct main push pattern detected in workflow files.'
            exit 1
          fi

          echo 'No direct main push pattern detected.'

      - name: Production safety verification
        shell: bash
        run: |
          set -euo pipefail

          echo '=== PRODUCTION SAFETY ==='
          echo 'Guardian has read-only repository permissions.'
          echo 'Guardian does not push commits.'
          echo 'Guardian does not merge pull requests.'
          echo 'Guardian does not modify production secrets.'
          echo 'Guardian does not modify Supabase/Firebase/Cloudflare production configuration.'
          echo 'Production safety verification passed.'

      - name: Guardian summary
        shell: bash
        run: |
          set -euo pipefail

          echo '============================================'
          echo ' STAGEPULSE AUTONOMOUS GUARDIAN'
          echo ' BASELINE CHECK COMPLETED'
          echo '============================================'
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo 'Node/npm setup intentionally omitted.'
          echo 'Reason: this Guardian baseline does not require Node dependencies.'
          echo 'Runtime/device FCM registration remains a separate smoke test.'
