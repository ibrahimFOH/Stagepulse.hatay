name: UI repair once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.head_commit.message, '[ui-repaired]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate portal UI and repair admin tables
        shell: bash
        run: |
          set -euo pipefail

          test -f portal/portal-bundle.js
          test -f portal/portal-bundle.css
          test -f inventory-status.js
          test -f inventory-status.css

          cat inventory-status.css >> portal/portal-bundle.css
          cat inventory-status.js >> portal/portal-bundle.js

          cat >> portal/portal-bundle.js <<'JS'

          /* ===== Stagepulse canonical UI corrections ===== */
          (() => {
            const boot = () => {
              const client = window.sb;
              if (!client) return;
              const $ = (s) => document.querySelector(s);
              const esc = (s) => String(s ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
              const money = (v) => `${Number(v || 0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})} ₺`;
              const date = (v) => v ? new Date(v).toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'}) : '—';
              const allowed = (p) => typeof window.has === 'function' ? window.has(p) : true;

              const renderFinance = async () => {
                if (!allowed('payments.view')) return;
                const content = $('#content');
                if (!content) return;
                const { data: payments, error } = await client.from('payments')
                  .select('id,offer_id,description,amount,due_date,paid_at,status,created_at')
                  .order('created_at',{ascending:false}).limit(500);
                if (error) throw error;
                const ids = [...new Set((payments||[]).map(x=>x.offer_id).filter(Boolean))];
                let offers = [];
                if (ids.length) {
                  const r = await client.from('teklifler').select('id,quote_number,name,company,event_date,location').in('id',ids);
                  if (r.error) throw r.error;
                  offers = r.data || [];
                }
                const byId = Object.fromEntries(offers.map(x=>[x.id,x]));
                content.innerHTML = `<div class="page-head"><div><h1>Ödemeler</h1><p class="muted">Tahsilat kayıtları</p></div></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>İş</th><th>Açıklama</th><th>Tutar</th><th>Durum</th><th>Vade</th><th>Ödeme</th></tr></thead><tbody>${(payments||[]).map(p=>{const o=byId[p.offer_id]||{}; const title=o.name||o.quote_number||'İş kaydı'; return `<tr><td><strong>${esc(title)}</strong>${o.quote_number&&o.name?`<div class="muted">${esc(o.quote_number)}</div>`:''}${o.location?`<div class="muted">${esc(o.location)}</div>`:''}</td><td>${esc(p.description||'—')}</td><td><strong>${money(p.amount)}</strong></td><td>${esc(p.status||'pending')}</td><td>${p.due_date?esc(new Date(p.due_date).toLocaleDateString('tr-TR')):'—'}</td><td>${date(p.paid_at)}</td></tr>`;}).join('')||'<tr><td colspan="6" class="muted">Kayıt bulunamadı.</td></tr>'}</tbody></table></div></div>`;
              };

              const renderJobs = async () => {
                const content = $('#content');
                if (!content) return;
                const { data: jobs, error } = await client.from('jobs')
                  .select('id,offer_id,title,setup_at,event_at,teardown_at,location,status')
                  .order('event_at',{ascending:true}).limit(500);
                if (error) throw error;
                content.innerHTML = `<div class="page-head"><div><h1>İşler · Takvim</h1><p class="muted">Kurulum ve etkinlik</p></div></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>İş</th><th>Konum</th><th>Kurulum</th><th>Etkinlik</th><th>Söküm</th><th>Durum</th></tr></thead><tbody>${(jobs||[]).map(j=>`<tr><td><strong>${esc(j.title||'İş')}</strong></td><td>${esc(j.location||'—')}</td><td>${date(j.setup_at)}</td><td>${date(j.event_at)}</td><td>${date(j.teardown_at)}</td><td>${esc(j.status||'planned')}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">İş kaydı bulunamadı.</td></tr>'}</tbody></table></div></div>`;
              };

              const oldFinance = window.financeView;
              const oldJobs = window.jobsView;
              window.financeView = async () => { try { await renderFinance(); } catch (e) { console.error(e); if (oldFinance) await oldFinance(); } };
              window.jobsView = async () => { try { await renderJobs(); } catch (e) { console.error(e); if (oldJobs) await oldJobs(); } };
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,0),{once:true}); else setTimeout(boot,0);
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          p=Path('portal/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<link rel="stylesheet" href="/inventory-status.css?v=20260831-canonical">','')
          p.write_text(s,encoding='utf-8')
          PY

          rm -f inventory-status.js inventory-status.css

          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ui-repair-once.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('cat inventory-status.css >> portal/portal-bundle.css','cat inventory-status.css >> portal/portal-bundle.css')
          p.write_text(s,encoding='utf-8')
          PY

          git config user.name 'Stagepulse.hatay'
          git config user.email 'ibrahimkavasoglu7@gmail.com'
          git add portal/portal-bundle.js portal/portal-bundle.css portal/index.html inventory-status.js inventory-status.css
          git commit -m 'Consolidate portal UI and repair admin tables [ui-repaired]'
          git push

      - name: Remove one-shot repair workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Stagepulse.hatay'
          git config user.email 'ibrahimkavasoglu7@gmail.com'
          git rm -f .github/workflows/ui-repair-once.yml
          git commit -m 'Remove temporary UI repair workflow [ui-repaired] [skip ci]'
          git push
