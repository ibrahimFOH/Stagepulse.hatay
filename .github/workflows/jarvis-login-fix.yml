name: JARVIS Login Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch login handler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jarvis/admin/index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          if 'JARVIS LOGIN HOTFIX' in s:
              print('already patched')
              raise SystemExit(0)
          js=r'''<script id="jarvis-login-hotfix">
          /* JARVIS LOGIN HOTFIX: reliable Supabase sign-in and patron authorization. */
          (function(){
            'use strict';
            function install(){
              var form=document.getElementById('loginForm');
              if(!form || form.dataset.loginFixInstalled==='1') return;
              form.dataset.loginFixInstalled='1';
              form.addEventListener('submit', async function(ev){
                ev.preventDefault();
                ev.stopImmediatePropagation();
                var status=document.getElementById('loginStatus');
                var email=(document.getElementById('email')||{}).value||'';
                var password=(document.getElementById('password')||{}).value||'';
                email=email.trim();
                if(!email || !password){ if(status) status.textContent='E-posta ve şifre gerekli.'; return; }
                var btn=form.querySelector('button[type="submit"]');
                if(btn){btn.disabled=true;btn.textContent='Giriş yapılıyor…';}
                if(status) status.textContent='Supabase oturumu doğrulanıyor…';
                try{
                  if(!window.STAGEPULSE_RUNTIME || !STAGEPULSE_RUNTIME.supabaseUrl || !STAGEPULSE_RUNTIME.supabasePublishableKey) throw new Error('Supabase yapılandırması yüklenemedi.');
                  var result=await S.auth.signInWithPassword({email:email,password:password});
                  if(result.error) throw result.error;
                  var sess=result.data && result.data.session;
                  var usr=result.data && result.data.user;
                  if(!sess || !usr) throw new Error('Oturum oluşturulamadı.');
                  var role=(usr.app_metadata&&usr.app_metadata.role)||'';
                  var meta=usr.user_metadata||{};
                  var allowed=['patron','owner','admin'].indexOf(role)>=0 || meta.admin_access===true || meta.organization_role==='owner' || meta.organization_role==='admin';
                  if(!allowed) throw new Error('Bu hesap için Patron/JARVIS yetkisi bulunmuyor.');
                  session=sess;
                  if(typeof window.showApp==='function') window.showApp();
                  else {document.getElementById('login')?.classList.add('hidden');document.getElementById('recoveryBox')?.classList.add('hidden');document.getElementById('app')?.classList.remove('hidden');}
                  if(typeof window.refreshApprovals==='function') window.refreshApprovals().catch(function(){});
                  if(status) status.textContent='';
                  var p=document.getElementById('provider'); if(p) p.textContent='Oturum aktif';
                  if(typeof window.log==='function' && document.getElementById('chat') && !document.getElementById('chat').children.length) window.log('Patron oturumu açıldı. JARVIS hazır.','bot');
                }catch(e){
                  if(status) status.textContent='Giriş başarısız: '+(e&&e.message?e.message:'Bilinmeyen hata');
                  try{await S.auth.signOut();}catch(_){ }
                }finally{
                  if(btn){btn.disabled=false;btn.textContent='JARVIS\'i Aç';}
                }
              }, true);
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true}); else install();
          })();
          </script>
          '''
          if marker not in s: raise SystemExit('body marker missing')
          s=s.replace(marker, js+'\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jarvis/admin/index.html
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m 'fix(jarvis): reliable patron login'
          git push
