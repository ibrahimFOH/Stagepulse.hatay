name: Restore Legacy Gallery Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-legacy-gallery.yml'

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'restore legacy gallery assets') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore gallery from last known good commit
        run: |
          set -euo pipefail
          git fetch origin 7c3afa79f7b97557a546d9e4a1ac1f1dcfeff29a --no-tags
          git checkout 7c3afa79f7b97557a546d9e4a1ac1f1dcfeff29a -- images/gallery
          test -n "$(find images/gallery -type f -name '*.webp' -print -quit)"

      - name: Commit restored gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/gallery
          git commit -m "chore(media): restore legacy gallery assets"
          git push
