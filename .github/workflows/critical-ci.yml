name: Stagepulse Critical CI

on:
  push:
    branches: [main, critical-production-sync]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    name: Critical production checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check critical JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in admin/auth-layer.js admin/staff-permissions.js portal/portal.js portal/portal-permissions.js premium.js; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done

      - name: Verify portal uses live permissions
        shell: bash
        run: |
          set -euo pipefail
          test -f portal/portal.js
          ! grep -q 'DEFAULT_PERMS' portal/portal.js
          grep -q 'staff_permissions' portal/portal.js
          grep -q 'permission_catalog' supabase/functions/staff-session/index.ts

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Check critical Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/staff-manage/index.ts
          deno check supabase/functions/staff-session/index.ts

      - name: Verify permission source exists
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/staff-manage/index.ts
          test -f supabase/functions/staff-session/index.ts
          test -f supabase/config.toml
          grep -q '^\[functions.staff-session\]' supabase/config.toml
          grep -q 'staff_permissions' supabase/functions/staff-session/index.ts
          grep -q 'permission_catalog' supabase/functions/staff-manage/index.ts

      - name: Verify staff jobs compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260821000000_fix_my_jobs_staff_view.sql
          grep -q 'CREATE OR REPLACE VIEW public.my_jobs_staff' supabase/migrations/20260821000000_fix_my_jobs_staff_view.sql
          grep -q 'staff_profiles' supabase/migrations/20260821000000_fix_my_jobs_staff_view.sql
          test -f supabase/migrations/20260821001000_harden_staff_jobs_view_security.sql
          grep -q 'security_invoker = true' supabase/migrations/20260821001000_harden_staff_jobs_view_security.sql
          grep -q 'SECURITY INVOKER' supabase/migrations/20260821001000_harden_staff_jobs_view_security.sql
          test -f supabase/staff-portal.sql.DEPRECATED.md
          test -f functions/DEPRECATED.md

      - name: Verify legacy SQL is explicitly deprecated
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/staff-portal.sql.DEPRECATED.md
          grep -qi 'deprecated' supabase/staff-portal.sql.DEPRECATED.md
