name: Stagepulse Critical CI

on:
  push:
    branches: [main, critical-production-sync]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    name: Critical production checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check critical JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in admin/auth-layer.js admin/staff-permissions.js portal/portal.js portal/portal-permissions.js premium.js; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done

      # Permission validation intentionally checks the layer that owns each source of truth.
      - name: Verify portal uses live permissions
        shell: bash
        run: |
          set -euo pipefail
          test -f portal/portal.js
          ! grep -q 'DEFAULT_PERMS' portal/portal.js
          grep -Eq 'staff_permissions|staffUser\.permissions|\.permissions' portal/portal.js
          grep -Eq 'canonical\(|PERMISSION_ALIAS|can\(' portal/portal.js

      - name: Verify permission source of truth
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/staff-session/index.ts
          test -f supabase/functions/staff-manage/index.ts
          grep -q 'staff_permissions' supabase/functions/staff-session/index.ts
          grep -q 'permission_catalog' supabase/functions/staff-manage/index.ts
          ! grep -Eq 'DEFAULT_PERMS|defaultPermissions|fallback.*permission' supabase/functions/staff-session/index.ts

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Check critical Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/staff-manage/index.ts
          deno check supabase/functions/staff-session/index.ts

      - name: Verify permission source exists
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/staff-manage/index.ts
          test -f supabase/functions/staff-session/index.ts
          test -f supabase/config.toml
          grep -q '^\[functions.staff-session\]' supabase/config.toml
          grep -q 'staff_permissions' supabase/functions/staff-session/index.ts
          grep -q 'permission_catalog' supabase/functions/staff-manage/index.ts

      - name: Verify staff jobs compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          set +e
          failed=0
          check_file() { test -f "$1" || { echo "MISSING FILE: $1"; failed=1; }; }
          check_text() { grep -qF -- "$1" "$2" || { echo "MISSING TEXT: $1 in $2"; failed=1; }; }
          check_file supabase/migrations/20260821000000_fix_my_jobs_staff_view.sql
          if ! grep -Eq 'create[[:space:]]+(or[[:space:]]+replace[[:space:]]+)?view[[:space:]]+public\.my_jobs_staff' supabase/migrations/20260821000000_fix_my_jobs_staff_view.sql; then
            echo 'MISSING VIEW DEFINITION: public.my_jobs_staff in supabase/migrations/20260821000000_fix_my_jobs_staff_view.sql'
            failed=1
          fi
          check_text 'staff_profiles' supabase/migrations/20260821000000_fix_my_jobs_staff_view.sql
          check_file supabase/migrations/20260821001000_harden_staff_jobs_view_security.sql
          check_text 'security_invoker = true' supabase/migrations/20260821001000_harden_staff_jobs_view_security.sql
          check_text 'SECURITY INVOKER' supabase/migrations/20260821001000_harden_staff_jobs_view_security.sql
          check_file supabase/staff-portal.sql.DEPRECATED.md
          check_file functions/DEPRECATED.md
          set -e
          if [ "$failed" -ne 0 ]; then
            echo 'ERROR: staff jobs compatibility layer validation failed.'
            exit 1
          fi

      - name: Verify legacy SQL is explicitly deprecated
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/staff-portal.sql.DEPRECATED.md
          grep -qi 'deprecated' supabase/staff-portal.sql.DEPRECATED.md
