name: Fix CI validation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix broken validation script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/stagepulse-ci.yml')
          s=p.read_text(encoding='utf-8')
          old="assert re.search(r'<meta[^>]+name=[\"\\']description[\"\\']',html,re.I), f'Missing description: {file}'"
          new="assert re.search(r\"<meta[^>]+name=[\\\"']description[\\\"']\",html,re.I), f'Missing description: {file}'"
          if old not in s:
              raise SystemExit('broken validation line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/stagepulse-ci.yml
          git commit -m 'Fix CI metadata validation syntax'
          git push
