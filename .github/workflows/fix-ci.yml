name: Fix CI validation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix broken validation script and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/stagepulse-ci.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("assert re.search(r'<meta[^>]+name=[\"\\']description[\"\\']',html,re.I), f'Missing description: {file}'", "assert re.search(r\"<meta[^>]+name=[\\\"']description[\\\"']\",html,re.I), f'Missing description: {file}'")
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/stagepulse-ci.yml
          git rm .github/workflows/fix-ci.yml
          git commit -m 'Fix CI metadata validation syntax and remove repair workflow'
          git push
