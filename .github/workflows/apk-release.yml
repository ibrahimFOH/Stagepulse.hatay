name: APK Release
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'twa-configs/**'
      - '.github/workflows/apk-release.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android source
        run: |
          test -d android
          test -f twa-configs/admin-web-apk-manifest.json || true
          test -f twa-configs/staff-web-apk-manifest.json || true
          find android -type f | wc -l
