name: Stagepulse Guardian

on:
  push:
    branches:
      - main
      - "guardian/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: stagepulse-guardian-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMAIN: https://stagepulse.com.tr
  NODE_VERSION: "22"

jobs:
  guardian:
    name: Stagepulse Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false
          cache: ""

      - name: Environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Stagepulse Guardian"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"

      - name: Repository structure
        shell: bash
        run: |
          set -euo pipefail

          test -d .github/workflows

          echo "=== Workflows ==="
          find .github/workflows -maxdepth 1 -type f \( -name "*.yml" -o -name "*.yaml" \) -print | sort

          echo "=== Root ==="
          ls -la

      - name: Detect package manager
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          else
            echo "manager=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Install npm
        if: steps.package.outputs.manager == 'npm'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Install yarn
        if: steps.package.outputs.manager == 'yarn'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable

      - name: Install pnpm
        if: steps.package.outputs.manager == 'pnpm'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate npm project
        if: steps.package.outputs.manager == 'npm'
        shell: bash
        run: |
          set -euo pipefail

          if npm run | grep -qE "^[[:space:]]+lint$"; then
            npm run lint
          fi

          if npm run | grep -qE "^[[:space:]]+typecheck$"; then
            npm run typecheck
          fi

          if npm run | grep -qE "^[[:space:]]+test$"; then
            npm test
          fi

          if npm run | grep -qE "^[[:space:]]+build$"; then
            npm run build
          fi

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude="*.map" \
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' \
            .; then
            echo "::error::Private key detected."
            exit 1
          fi

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude="*.map" \
            'service_role[[:space:]]*[:=]' \
            .; then
            echo "::error::Potential Supabase service_role exposure detected."
            exit 1
          fi

          echo "Secret scan passed."

      - name: Production mutation guard
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            'git push|supabase db push|supabase functions deploy|firebase deploy|wrangler deploy' \
            .github/workflows .github/agents 2>/dev/null; then
            echo "::error::Production mutation command detected."
            exit 1
          fi

          echo "Production mutation guard passed."

      - name: Domain health
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            url="$1"

            echo ""
            echo "Checking $url"

            status=$(curl -sS -L --connect-timeout 10 --max-time 30 -A "Stagepulse-Guardian/1.0" -o /dev/null -w "%{http_code}" "$url" || true)

            echo "HTTP: $status"

            case "$status" in
              2??)
                echo "PASS: HTTP 2xx"
                ;;
              3??)
                echo "PASS: HTTP 3xx"
                ;;
              401)
                echo "::warning::$url returned HTTP 401."
                ;;
              403)
                echo "::warning::$url returned HTTP 403."
                echo "Cloudflare/WAF/access protection detected."
                ;;
              404)
                echo "::error::$url returned HTTP 404."
                return 1
                ;;
              5??)
                echo "::error::$url returned HTTP $status."
                return 1
                ;;
              000|"")
                echo "::error::$url is unreachable."
                return 1
                ;;
              *)
                echo "::error::$url returned unexpected HTTP $status."
                return 1
                ;;
            esac
          }

          check_url "$DOMAIN/"
          check_url "$DOMAIN/admin"
          check_url "$DOMAIN/portal"

      - name: Firebase Installations
        shell: bash
        run: |
          set -euo pipefail

          status=$(curl -sS -L --connect-timeout 10 --max-time 30 -A "Stagepulse-Guardian/1.0" -o /dev/null -w "%{http_code}" "https://firebaseinstallations.googleapis.com/" || true)

          echo "Firebase Installations HTTP: $status"

          if [ "$status" = "000" ]; then
            echo "::error::Firebase Installations unreachable."
            exit 1
          fi

      - name: Firebase FCM
        shell: bash
        run: |
          set -euo pipefail

          status=$(curl -sS -L --connect-timeout 10 --max-time 30 -A "Stagepulse-Guardian/1.0" -o /dev/null -w "%{http_code}" "https://fcm.googleapis.com/" || true)

          echo "FCM HTTP: $status"

          if [ "$status" = "000" ]; then
            echo "::error::FCM unreachable."
            exit 1
          fi

      - name: FCM source inspection
        shell: bash
        run: |
          set -euo pipefail

          matches=$(grep -RIl \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            -E 'firebase-messaging|getToken\(|firebase-messaging-sw|serviceWorker|messaging\(' \
            . 2>/dev/null || true)

          if [ -n "$matches" ]; then
            echo "FCM source detected:"
            echo "$matches"
          else
            echo "::warning::No FCM implementation detected."
          fi

      - name: Service worker inspection
        shell: bash
        run: |
          set -euo pipefail

          workers=$(find . \
            -type f \
            \( -iname "*service-worker*" -o -iname "*serviceworker*" -o -iname "firebase-messaging-sw.js" -o -iname "sw.js" \) \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            2>/dev/null || true)

          if [ -n "$workers" ]; then
            echo "$workers"
          else
            echo "::warning::No service worker detected."
          fi

      - name: Supabase health
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ vars.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL is not configured."
            echo "Supabase check skipped."
            exit 0
          fi

          status=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" "${{ vars.SUPABASE_URL }}/rest/v1/" || true)

          echo "Supabase HTTP: $status"

          if [ "$status" = "000" ]; then
            echo "::error::Supabase unreachable."
            exit 1
          fi

      - name: TLS check
        shell: bash
        run: |
          set -euo pipefail

          echo | openssl s_client -connect stagepulse.com.tr:443 -servername stagepulse.com.tr 2>/dev/null | openssl x509 -noout -subject -issuer -dates

      - name: Security headers
        shell: bash
        run: |
          set -euo pipefail

          headers=$(curl -sS -L -I --connect-timeout 10 --max-time 30 -A "Stagepulse-Guardian/1.0" "$DOMAIN/" || true)

          echo "$headers"

          for header in strict-transport-security content-security-policy x-content-type-options referrer-policy; do
            if echo "$headers" | grep -qi "^$header:"; then
              echo "FOUND: $header"
            else
              echo "::warning::Missing security header: $header"
            fi
          done

      - name: Guardian uniqueness
        shell: bash
        run: |
          set -euo pipefail

          count=$(grep -RIl \
            --include="*.yml" \
            --include="*.yaml" \
            '^name:[[:space:]]*Stagepulse Guardian[[:space:]]*$' \
            .github/workflows \
            2>/dev/null | wc -l)

          echo "Stagepulse Guardian workflow count: $count"

          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple Stagepulse Guardian workflows detected."
            exit 1
          fi

      - name: Production impact record
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGEPULSE GUARDIAN"
          echo "=========================================="
          echo "Mode: DIAGNOSTIC / DRY-RUN"
          echo "Production writes: DISABLED"
          echo "Database mutation: DISABLED"
          echo "RLS mutation: DISABLED"
          echo "Auth mutation: DISABLED"
          echo "Firebase deployment: DISABLED"
          echo "Cloudflare mutation: DISABLED"
          echo "Git push: DISABLED"
          echo "Automatic merge: DISABLED"
          echo "Secret logging: DISABLED"
          echo "=========================================="

      - name: Guardian summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Stagepulse Guardian"
            echo ""
            echo "Diagnostic mode: **enabled**"
            echo ""
            echo "Production mutation: **disabled**"
            echo "Direct push: **disabled**"
            echo "Automatic merge: **disabled**"
            echo "Secret logging: **disabled**"
            echo ""
            echo "Checked:"
            echo "- Domain"
            echo "- /admin"
            echo "- /portal"
            echo "- Firebase Installations"
            echo "- FCM"
            echo "- Service Worker"
            echo "- Supabase"
            echo "- TLS"
            echo "- Security headers"
            echo "- Secret exposure"
          } >> "$GITHUB_STEP_SUMMARY"
