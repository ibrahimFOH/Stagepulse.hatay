name: Stagepulse Guardian

on:
  push:
    branches: [main, "guardian/**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: stagepulse-guardian-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMAIN: https://stagepulse.com.tr
  NODE_VERSION: "22"

jobs:
  guardian:
    name: Stagepulse Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          git status --short

      - name: JavaScript syntax integrity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './portal/vendor/*' -not -path './vendor/firebase/*' -not -path './node_modules/*' | sort)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do node --check "$file"; done
          echo "JavaScript syntax integrity passed: ${#files[@]} files."

      - name: Secret exposure guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build --exclude-dir=supabase/functions --exclude='*.map' '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|service_role[[:space:]]*[:=]|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=]|FCM_PRIVATE_KEY[[:space:]]*[:=]' .; then
            echo "::error::Potential secret/private credential exposure detected outside Edge Functions."
            exit 1
          fi
          if grep -RInE --include='*.ts' --include='*.js' 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*["'\''`][A-Za-z0-9._-]{20,}["'\''`]' supabase/functions; then
            echo "::error::Potential hardcoded Edge Function service credential detected."
            exit 1
          fi
          echo "Secret exposure guard passed."

      - name: Guardian production mutation guard
        shell: bash
        run: |
          set -euo pipefail
          GIT_PUSH='git'; GIT_PUSH+=' push'
          SUPA_DB='supabase'; SUPA_DB+=' db push'
          SUPA_FN='supabase'; SUPA_FN+=' functions deploy'
          FIREBASE='firebase'; FIREBASE+=' deploy'
          WRANGLER='wrangler'; WRANGLER+=' deploy'
          if grep -nF "$GIT_PUSH" .github/workflows/stagepulse-guardian.yml || \
             grep -nF "$SUPA_DB" .github/workflows/stagepulse-guardian.yml || \
             grep -nF "$SUPA_FN" .github/workflows/stagepulse-guardian.yml || \
             grep -nF "$FIREBASE" .github/workflows/stagepulse-guardian.yml || \
             grep -nF "$WRANGLER" .github/workflows/stagepulse-guardian.yml; then
            echo "::error::Production mutation command detected inside Guardian."
            exit 1
          fi
          echo "Guardian mutation guard passed."

      - name: Repository and Guardian integrity
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/workflows
          test -s .github/workflows/stagepulse-guardian.yml
          test -s firebase-messaging-sw.js
          test -s portal/fcm-config.js
          test -s portal/fcm-register-v3.js
          test -s portal/index.html
          test -s portal/vendor/firebase/firebase-app-compat.js
          test -s portal/vendor/firebase/firebase-messaging-compat.js
          test -s twa-configs/admin.twa-manifest.json
          test -s twa-configs/staff.twa-manifest.json
          count=$(grep -RIl --include='*.yml' --include='*.yaml' '^name:[[:space:]]*Stagepulse Guardian[[:space:]]*$' .github/workflows | wc -l)
          test "$count" -eq 1
          echo "Repository and Guardian integrity passed."

      - name: FCM implementation integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'stagepulse-905be' firebase-messaging-sw.js
          grep -q '163274034334' firebase-messaging-sw.js
          grep -q 'vapidKey' portal/fcm-config.js
          grep -q 'firebase-messaging-sw.js' portal/fcm-register-v3.js
          grep -q 'register_notification_device' portal/fcm-register-v3.js
          grep -q 'firebaseNetworkProbe' portal/fcm-register-v3.js
          grep -q 'showNotification' firebase-messaging-sw.js
          grep -q 'notificationclick' firebase-messaging-sw.js
          grep -q 'fcm-config.js' portal/index.html
          grep -q 'fcm-register-v3.js' portal/index.html
          ! grep -q 'fcm-register.js' portal/index.html
          ! grep -q 'fcm-register-v2.js' portal/index.html
          echo "FCM implementation integrity passed."

      - name: TWA notification integrity
        shell: bash
        run: |
          set -euo pipefail
          for manifest in twa-configs/admin.twa-manifest.json twa-configs/staff.twa-manifest.json; do
            node -e 'const fs=require("fs");const p=process.argv[1];const d=JSON.parse(fs.readFileSync(p,"utf8"));if(d.enableNotifications!==true)throw new Error(`${p}: enableNotifications must be true`);if(d.fallbackType!=="customtabs")throw new Error(`${p}: fallbackType must be customtabs`);if(!String(d.fullScopeUrl||"").startsWith("https://stagepulse.com.tr/"))throw new Error(`${p}: fullScopeUrl invalid`);' "$manifest"
          done
          echo "TWA notification integrity passed."

      - name: Firebase endpoint reachability
        shell: bash
        run: |
          set -euo pipefail
          check_endpoint() {
            local name="$1" url="$2" status
            status=$(curl -sS -L --connect-timeout 10 --max-time 30 -A "Stagepulse-Guardian/1.0" -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$name -> HTTP $status"
            case "$status" in
              000|'') echo "::error::$name unreachable"; return 1 ;;
              5??) echo "::error::$name server failure"; return 1 ;;
              *) return 0 ;;
            esac
          }
          check_endpoint "Firebase Installations" "https://firebaseinstallations.googleapis.com/"
          check_endpoint "FCM Registration" "https://fcmregistrations.googleapis.com/"

      - name: Domain health
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local url="$1" status
            status=$(curl -sS -L --connect-timeout 10 --max-time 30 -A "Stagepulse-Guardian/1.0" -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$url -> HTTP $status"
            case "$status" in
              2??|3??|401|403) ;;
              404) echo "::error::$url returned 404"; return 1 ;;
              5??) echo "::error::$url returned server error $status"; return 1 ;;
              000|'') echo "::error::$url unreachable"; return 1 ;;
              *) echo "::error::$url unexpected HTTP $status"; return 1 ;;
            esac
          }
          check_url "$DOMAIN/"
          check_url "$DOMAIN/admin/"
          check_url "$DOMAIN/portal/"
          check_url "$DOMAIN/firebase-messaging-sw.js"

      - name: TLS and security headers
        shell: bash
        run: |
          set -euo pipefail
          echo | openssl s_client -connect stagepulse.com.tr:443 -servername stagepulse.com.tr 2>/dev/null | openssl x509 -noout -subject -issuer -dates
          headers=$(curl -sS -L -I --connect-timeout 10 --max-time 30 -A "Stagepulse-Guardian/1.0" "$DOMAIN/" || true)
          echo "$headers"
          for header in strict-transport-security x-content-type-options referrer-policy; do
            echo "$headers" | grep -qi "^$header:" || { echo "::error::Missing required security header: $header"; exit 1; }
          done
          echo "$headers" | grep -qi '^content-security-policy:' || echo "::warning::Content-Security-Policy not visible from this edge response."

      - name: Production impact record
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Stagepulse Guardian"
            echo ""
            echo "Mode: **diagnostic / dry-run**"
            echo "Production writes: **disabled**"
            echo "Database/RLS/Auth mutation: **disabled**"
            echo "Firebase/Cloudflare deployment: **disabled**"
            echo "Automatic merge: **disabled**"
            echo ""
            echo "FCM chain gates: configuration → service worker → portal entrypoint → TWA notification delegation → endpoint reachability."
          } >> "$GITHUB_STEP_SUMMARY"
