name: Stagepulse Guardian

on:
  push:
    branches:
      - main
      - "guardian/**"

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: stagepulse-guardian-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMAIN: https://stagepulse.com.tr
  NODE_VERSION: "22"

jobs:

  guardian:
    name: Stagepulse Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ------------------------------------------------------------
      # 1. REPOSITORY
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. NODE
      # ------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          cache: ""

      - name: Node environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

      # ------------------------------------------------------------
      # 3. REPOSITORY STRUCTURE
      # ------------------------------------------------------------

      - name: Repository structure check
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Stagepulse Guardian ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo

          echo "=== Root ==="
          ls -la

          echo
          echo "=== GitHub workflows ==="

          if [ -d ".github/workflows" ]; then
            find .github/workflows -maxdepth 1 -type f -print | sort
          else
            echo "::error::.github/workflows directory does not exist."
            exit 1
          fi

      # ------------------------------------------------------------
      # 4. PACKAGE MANAGER DETECTION
      # ------------------------------------------------------------

      - name: Detect package manager
        id: package_manager
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=true" >> "$GITHUB_OUTPUT"
            echo "Package manager: npm"

          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=true" >> "$GITHUB_OUTPUT"
            echo "Package manager: yarn"

          elif [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=true" >> "$GITHUB_OUTPUT"
            echo "Package manager: pnpm"

          elif [ -f package.json ]; then
            echo "manager=none" >> "$GITHUB_OUTPUT"
            echo "lockfile=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json exists but no lockfile was found."

          else
            echo "manager=none" >> "$GITHUB_OUTPUT"
            echo "lockfile=false" >> "$GITHUB_OUTPUT"
            echo "No Node package detected."
          fi

      # ------------------------------------------------------------
      # 5. DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install npm dependencies
        if: steps.package_manager.outputs.manager == 'npm'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Install Yarn dependencies
        if: steps.package_manager.outputs.manager == 'yarn'
        shell: bash
        run: |
          set -euo pipefail

          corepack enable

          yarn install --immutable

      - name: Install pnpm dependencies
        if: steps.package_manager.outputs.manager == 'pnpm'
        shell: bash
        run: |
          set -euo pipefail

          corepack enable

          pnpm install --frozen-lockfile --ignore-scripts

      # ------------------------------------------------------------
      # 6. PACKAGE VALIDATION
      # ------------------------------------------------------------

      - name: Validate package scripts
        if: steps.package_manager.outputs.manager != 'none'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "package.json not found."
            exit 0
          fi

          node - <<'NODE'
          const pkg = require("./package.json");

          console.log("Package:", pkg.name || "unnamed");
          console.log("Version:", pkg.version || "unknown");

          console.log("Scripts:");

          if (pkg.scripts) {
            for (const [name, command] of Object.entries(pkg.scripts)) {
              console.log(`- ${name}: ${command}`);
            }
          } else {
            console.log("No scripts.");
          }
          NODE

      # ------------------------------------------------------------
      # 7. LINT / TYPECHECK / TEST
      # ------------------------------------------------------------

      - name: Run npm validation
        if: steps.package_manager.outputs.manager == 'npm'
        shell: bash
        run: |
          set -euo pipefail

          run_script_if_exists() {
            local script="$1"

            if npm run | grep -qE "^[[:space:]]+$script$"; then
              echo
              echo "Running: npm run $script"
              npm run "$script"
            else
              echo "Skipping missing script: $script"
            fi
          }

          run_script_if_exists "lint"
          run_script_if_exists "typecheck"
          run_script_if_exists "test"
          run_script_if_exists "build"

      # ------------------------------------------------------------
      # 8. SECRET SCAN
      # ------------------------------------------------------------

      - name: Secret exposure scan
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning repository for high-confidence secrets."

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude='*.map' \
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' \
            .; then

            echo "::error::Private key detected."
            exit 1
          fi

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude='*.map' \
            'service_role[[:space:]]*[:=]' \
            .; then

            echo "::error::Potential Supabase service_role exposure detected."
            exit 1
          fi

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude='*.map' \
            '(FIREBASE_PRIVATE_KEY|SUPABASE_SERVICE_ROLE_KEY|CLOUDFLARE_API_TOKEN)[[:space:]]*=' \
            .; then

            echo "::error::Potential infrastructure secret exposure detected."
            exit 1
          fi

          echo "Secret baseline passed."

      # ------------------------------------------------------------
      # 9. PRODUCTION MUTATION GUARD
      # ------------------------------------------------------------

      - name: Production mutation guard
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Guardian configuration for dangerous production mutations."

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            'git push|supabase db push|supabase functions deploy|firebase deploy|wrangler deploy' \
            .github/workflows .github/agents 2>/dev/null; then

            echo "::error::Production mutation command detected."
            echo "::error::Guardian is diagnostic-only."
            exit 1
          fi

          echo "Production mutation guard passed."

      # ------------------------------------------------------------
      # 10. DOMAIN HEALTH
      # ------------------------------------------------------------

      - name: Domain and route health
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"

            echo
            echo "======================================"
            echo "Checking: $url"
            echo "======================================"

            response="$(
              curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 10 \
                --max-time 30 \
                --user-agent "Stagepulse-Guardian/1.0" \
                --output /dev/null \
                --write-out '%{http_code}|%{url_effective}' \
                "$url" || true
            )"

            status="${response%%|*}"
            effective="${response#*|}"

            echo "HTTP: $status"
            echo "Effective URL: $effective"

            case "$status" in

              2??)
                echo "PASS: HTTP 2xx"
                ;;

              3??)
                echo "PASS: HTTP 3xx"
                ;;

              401)
                echo "::warning::$url returned HTTP 401."
                echo "Authentication protection detected."
                ;;

              403)
                echo "::warning::$url returned HTTP 403."
                echo "Security/WAF/access protection detected."
                ;;

              404)
                echo "::error::$url returned HTTP 404."
                return 1
                ;;

              5??)
                echo "::error::$url returned server error HTTP $status."
                return 1
                ;;

              000|"")
                echo "::error::$url is unreachable."
                return 1
                ;;

              *)
                echo "::error::$url returned unexpected HTTP $status."
                return 1
                ;;

            esac
          }

          check_url "$DOMAIN/"
          check_url "$DOMAIN/admin"
          check_url "$DOMAIN/portal"

      # ------------------------------------------------------------
      # 11. FIREBASE INSTALLATIONS
      # ------------------------------------------------------------

      - name: Firebase Installations network test
        shell: bash
        run: |
          set -euo pipefail

          URL="https://firebaseinstallations.googleapis.com/"

          echo "Checking Firebase Installations endpoint."

          status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --user-agent "Stagepulse-Guardian/1.0" \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$URL" || true
          )"

          echo "Firebase Installations HTTP: $status"

          if [ "$status" = "000" ]; then
            echo "::error::Firebase Installations unreachable."
            exit 1
          fi

          echo "Firebase Installations network path reachable."

      # ------------------------------------------------------------
      # 12. FCM
      # ------------------------------------------------------------

      - name: Firebase Cloud Messaging network test
        shell: bash
        run: |
          set -euo pipefail

          URL="https://fcm.googleapis.com/"

          echo "Checking Firebase Cloud Messaging endpoint."

          status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --user-agent "Stagepulse-Guardian/1.0" \
              --output /dev/null \
              --write-out '%{http
