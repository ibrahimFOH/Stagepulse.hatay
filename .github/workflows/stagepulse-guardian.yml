name: Stagepulse Guardian

on:
  push:
    branches: [main, "guardian/**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: stagepulse-guardian-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMAIN: https://stagepulse.com.tr
  FCM_SW: https://stagepulse.com.tr/firebase-messaging-sw.js
  SUPABASE_URL: https://mtjcqqrogjqaxkagwkti.supabase.co

jobs:
  guardian:
    name: Stagepulse Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false
          cache: ""

      - name: Baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "Stagepulse Guardian"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Node: $(node --version)"
          test -d .github/workflows

      - name: Project validation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
            npm run lint --if-present
            npm run typecheck --if-present
            npm test --if-present
            npm run build --if-present
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm lint --if-present
            pnpm typecheck --if-present
            pnpm test --if-present
            pnpm build --if-present
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
            yarn lint --if-present
            yarn typecheck --if-present
            yarn test --if-present
            yarn build --if-present
          else
            echo "Static project detected; package-manager validation skipped."
          fi

      - name: Secret exposure scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build --exclude='*.map' \
            -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' .; then
            echo "::error::Private key detected in repository."
            exit 1
          fi
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build --exclude='*.map' \
            'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*["'"'"'`][^"'"'"'`[:space:]]{20,}["'"'"'`]|service_role[[:space:]]*[:=][[:space:]]*["'"'"'`][^"'"'"'`[:space:]]{20,}["'"'"'`]' .; then
            echo "::error::Potential privileged credential value detected."
            exit 1
          fi
          echo "Secret exposure scan passed."

      - name: Guardian uniqueness and mutation guard
        shell: bash
        run: |
          set -euo pipefail
          count=$(grep -RIl --include='*.yml' --include='*.yaml' \
            '^name:[[:space:]]*Stagepulse Guardian[[:space:]]*$' .github/workflows 2>/dev/null | wc -l | tr -d ' ')
          echo "Guardian workflow count: $count"
          [ "$count" -eq 1 ] || { echo "::error::Exactly one Stagepulse Guardian workflow is required."; exit 1; }
          if grep -RInE --exclude-dir=.git 'git push|supabase db push|supabase functions deploy|firebase deploy|wrangler deploy' .github/workflows .github/agents 2>/dev/null; then
            echo "::error::Production mutation command detected."
            exit 1
          fi
          echo "Production mutation guard passed."

      - name: Production routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /admin /portal; do
            status=$(curl -sS -L --connect-timeout 10 --max-time 30 -A 'Stagepulse-Guardian/2.0' -o /dev/null -w '%{http_code}' "$DOMAIN$path" || true)
            echo "$DOMAIN$path -> HTTP $status"
            case "$status" in
              2??|3??) ;;
              401|403) echo "::warning::$DOMAIN$path returned $status; access/WAF protection detected." ;;
              404|5??|000|'') echo "::error::$DOMAIN$path unhealthy: HTTP $status"; exit 1 ;;
              *) echo "::error::$DOMAIN$path unexpected HTTP $status"; exit 1 ;;
            esac
          done

      - name: FCM service worker delivery
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$body" "$headers"' EXIT
          status=$(curl -sS -L --connect-timeout 10 --max-time 30 -A 'Stagepulse-Guardian/2.0' \
            -D "$headers" -o "$body" -w '%{http_code}' "$FCM_SW" || true)
          echo "FCM service worker -> HTTP $status"
          [ "$status" = "200" ] || { echo "::error::firebase-messaging-sw.js is not publicly reachable."; exit 1; }
          grep -q 'firebase-messaging' "$body" || { echo "::error::Firebase Messaging missing from service worker."; exit 1; }
          grep -q 'firebase.initializeApp' "$body" || { echo "::error::Firebase initialization missing from service worker."; exit 1; }
          grep -q 'onBackgroundMessage' "$body" || { echo "::error::Background FCM handler missing."; exit 1; }
          grep -q 'showNotification' "$body" || { echo "::error::Background notification display missing."; exit 1; }
          echo "FCM service worker delivery passed."

      - name: Firebase network diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in https://firebaseinstallations.googleapis.com/ https://fcm.googleapis.com/ https://www.googleapis.com/; do
            status=$(curl -sS -L --connect-timeout 10 --max-time 30 -A 'Stagepulse-Guardian/2.0' -o /dev/null -w '%{http_code}' "$endpoint" || true)
            echo "$endpoint -> HTTP $status"
            [ "$status" != "000" ] || { echo "::error::Firebase endpoint unreachable: $endpoint"; exit 1; }
          done

      - name: FCM registration integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f firebase-messaging-sw.js || { echo "::error::Root FCM service worker missing."; exit 1; }
          test -f portal/fcm-register-v3.js || { echo "::error::FCM v3 registration module missing."; exit 1; }
          grep -q "navigator.serviceWorker.register('/firebase-messaging-sw.js" portal/fcm-register-v3.js || { echo "::error::Root service worker is not registered by FCM client."; exit 1; }
          grep -q 'getToken' portal/fcm-register-v3.js || { echo "::error::FCM getToken missing."; exit 1; }
          grep -q 'serviceWorkerRegistration' portal/fcm-register-v3.js || { echo "::error::FCM token is not bound to service worker registration."; exit 1; }
          grep -q 'Notification.requestPermission' portal/fcm-register-v3.js || { echo "::error::Notification permission flow missing."; exit 1; }
          grep -q 'PushManager' portal/fcm-register-v3.js || { echo "::error::Push API capability check missing."; exit 1; }
          grep -q 'register_notification_device' portal/fcm-register-v3.js || { echo "::error::Supabase notification device RPC call missing."; exit 1; }
          grep -q 'notificationclick' firebase-messaging-sw.js || { echo "::error::Notification click handler missing."; exit 1; }
          echo "FCM client/background integrity passed."

      - name: Supabase notification path
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -L --connect-timeout 10 --max-time 30 -A 'Stagepulse-Guardian/2.0' -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/" || true)
          echo "Supabase REST -> HTTP $status"
          [ "$status" != "000" ] || { echo "::error::Supabase unreachable."; exit 1; }
          migration=$(find supabase/migrations -type f -name '*notification_device*.sql' | sort | tail -n 1)
          test -n "$migration" || { echo "::error::Notification device migration missing."; exit 1; }
          echo "Latest notification migration: $migration"
          grep -q 'register_notification_device' "$migration" || { echo "::error::Notification registration RPC missing."; exit 1; }
          grep -q 'GRANT EXECUTE' "$migration" || { echo "::error::RPC execute grant missing."; exit 1; }
          grep -q 'authenticated' "$migration" || { echo "::error::Authenticated execute grant missing."; exit 1; }

      - name: TLS and security headers
        shell: bash
        run: |
          set -euo pipefail
          echo | openssl s_client -connect stagepulse.com.tr:443 -servername stagepulse.com.tr 2>/dev/null | openssl x509 -noout -subject -issuer -dates
          headers=$(curl -sS -L -I --connect-timeout 10 --max-time 30 -A 'Stagepulse-Guardian/2.0' "$DOMAIN/" || true)
          for header in strict-transport-security x-content-type-options referrer-policy content-security-policy; do
            printf '%s\n' "$headers" | grep -qi "^$header:" || echo "::warning::Missing security header: $header"
          done

      - name: Delivery proof boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "CI has verified the FCM web/service-worker/configuration path."
          echo "CI does NOT claim closed-app Android delivery without a live canary device acknowledgement."
          echo "Canary delivery must use a GitHub Secret/Environment token and must never log credentials or tokens."

      - name: Production impact record
        if: always()
        shell: bash
        run: |
          {
            echo '## Stagepulse Guardian'
            echo ''
            echo '- Diagnostic/dry-run only'
            echo '- Production writes: disabled'
            echo '- Database/RLS/Auth mutation: disabled'
            echo '- Firebase/Cloudflare deployment: disabled'
            echo '- Git push/automatic merge: disabled'
            echo '- Secret logging: disabled'
            echo ''
            echo 'FCM closed-app physical-device delivery is intentionally not claimed by CI without a canary acknowledgement.'
          } >> "$GITHUB_STEP_SUMMARY"
