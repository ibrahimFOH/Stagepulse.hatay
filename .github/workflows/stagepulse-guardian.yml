name: Stagepulse Guardian

on:
  push:
    branches:
      - main
      - "guardian/**"
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Read-only by design. No production mutation, no secret rotation,
# no direct push, no merge, and no deployment from this workflow.
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  security-events: read
  vulnerability-alerts: read

concurrency:
  group: stagepulse-guardian-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  GUARDIAN_DRY_RUN: "true"

jobs:
  guardian:
    name: Guardian diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js without dependency cache
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/workflows
          test -f .github/workflows/stagepulse-guardian.yml
          if [ -d .github/agents ]; then
            echo "Agent prompt directory present."
            find .github/agents -maxdepth 1 -type f -print | sort
          else
            echo "Agent prompt directory not present yet; continuing in diagnostic-only mode."
          fi
          if [ -f .github/ai-guardian.config.yml ]; then
            echo "Guardian config present."
          else
            echo "Guardian config not present yet; using safe workflow defaults."
          fi

      - name: Project detection
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "node=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then echo "npm_lock=true" >> "$GITHUB_OUTPUT"; else echo "npm_lock=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f yarn.lock ]; then echo "yarn=true" >> "$GITHUB_OUTPUT"; else echo "yarn=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install Node dependencies safely
        if: steps.detect.outputs.node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.detect.outputs.npm_lock }}" = "true" ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          elif [ "${{ steps.detect.outputs.yarn }}" = "true" ]; then
            corepack enable
            yarn install --immutable
          else
            npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          fi

      - name: Validate package metadata
        if: steps.detect.outputs.node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"
          node --version
          npm --version

      - name: Application verification
        if: steps.detect.outputs.node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run lint --if-present
          npm run typecheck --if-present
          npm run type-check --if-present
          npm test --if-present
          npm run build --if-present

      - name: Secret exposure baseline
        shell: bash
        run: |
          set -euo pipefail
          found=0

          if git ls-files -z | xargs -0 -r grep -IlE --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' \
            'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*[^[:space:]]{20,}|\n?-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'; then
            echo "Potential literal credential material detected in tracked files."
            found=1
          fi

          while IFS= read -r -d '' file; do
            case "$file" in
              .env.example|.env.sample|.env.template) continue ;;
            esac
            echo "ERROR: environment file is tracked: $file"
            found=1
          done < <(git ls-files -z -- '.env' '.env.*')

          if [ "$found" -ne 0 ]; then
            exit 1
          fi
          echo "Secret exposure baseline passed."

      - name: Production mutation guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.yml' --include='*.yaml' \
            'git[[:space:]]+push[[:space:]]+([^[:space:]]+[[:space:]]+)?main|git[[:space:]]+push[[:space:]]+origin[[:space:]]+main|git[[:space:]]+push[[:space:]]+.*--force' \
            .github/workflows 2>/dev/null; then
            echo "Unsafe direct production push command detected."
            exit 1
          fi
          echo "No direct main push command detected."

      - name: Domain and critical route smoke checks
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://stagepulse.com.tr/ \
            https://stagepulse.com.tr/admin \
            https://stagepulse.com.tr/portal; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "$url -> $code"
            case "$code" in
              2*|3*|401|403) ;;
              *) echo "Unexpected HTTP status: $code"; exit 1 ;;
            esac
          done

      - name: Firebase public endpoint reachability
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI --max-time 20 https://firebaseinstallations.googleapis.com/ >/dev/null
          curl -fsSI --max-time 20 https://fcm.googleapis.com/ >/dev/null
          echo "Firebase public endpoints reachable."

      - name: FCM browser-chain source inspection
        shell: bash
        run: |
          set -euo pipefail
          matches=0
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules \
            'firebase(messaging|/messaging|installations)|getToken\(|serviceWorker|Notification\.requestPermission|onMessage' . 2>/dev/null | head -100; then
            matches=1
          fi
          if [ "$matches" -eq 1 ]; then
            echo "FCM/browser notification integration references found; runtime diagnosis remains read-only."
          else
            echo "No FCM/browser notification references found in tracked workspace."
          fi

      - name: Service worker discovery
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -path './node_modules' -prune -o -type f \( \
            -iname '*service-worker*' -o \
            -iname '*firebase-messaging-sw*' -o \
            -name 'sw.js' \
          \) -print | head -100 || true

      - name: Supabase public URL health check
        if: ${{ vars.SUPABASE_URL != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          url="${SUPABASE_URL%/}/rest/v1/"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url")
          echo "Supabase REST endpoint -> $code"
          case "$code" in
            2*|3*|401|403|404) ;;
            *) echo "Unexpected Supabase status: $code"; exit 1 ;;
          esac

      - name: Production impact record
        shell: bash
        run: |
          echo "Production impact: diagnostic-only run."
          echo "No production branch push, merge, deploy, database mutation, RLS mutation, Cloudflare mutation, or secret rotation is permitted."
          echo "Any future fixer must use branch -> minimal patch -> tests -> CI -> PR -> required human approval -> merge -> deploy."
          echo "Dry-run: ${GUARDIAN_DRY_RUN}"

      - name: Guardian result
        if: always()
        shell: bash
        run: |
          {
            echo "## Stagepulse Guardian"
            echo ""
            echo "- Mode: **diagnostic / dry-run**"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Production mutation: **blocked**"
            echo "- Secret logging: **blocked**"
            echo "- Direct main push: **blocked**"
          } >> "$GITHUB_STEP_SUMMARY"
