name: Stagepulse Guardian

on:
  push:
    branches: [main, "guardian/**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: stagepulse-guardian-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMAIN: https://stagepulse.com.tr
  NODE_VERSION: "22"

jobs:
  guardian:
    name: Stagepulse Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: false
          cache: ""

      - name: Repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/workflows
          test -d portal
          test -d admin
          test -d supabase/functions
          test -d supabase/migrations
          test -f portal/fcm-config.js
          test -f portal/fcm-register-v3.js
          test -f firebase-messaging-sw.js
          test -f portal/vendor/firebase/firebase-app-compat.js
          test -f portal/vendor/firebase/firebase-messaging-compat.js
          test -f portal/index.html
          test -f admin/index.html
          echo "Repository structure: PASS"

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
          echo "JavaScript syntax: PASS"

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='*.map' \
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*["'"'"'`][^"'"'"'`[:space:]]{20,}' .; then
            echo "::error::Private/server credential material detected."
            exit 1
          fi
          echo "Secret scan: PASS"

      - name: Production mutation guard
        shell: bash
        run: |
          set -euo pipefail
          # Match executable command lines only; do not flag this workflow's own detector text.
          if grep -RInE --include='*.yml' --include='*.yaml' \
            '^[[:space:]]*(-[[:space:]]*)?(git push|supabase db push|supabase functions deploy|firebase deploy|wrangler deploy)([[:space:]]|$)' \
            .github/workflows; then
            echo "::error::Direct production mutation command detected in workflow."
            exit 1
          fi
          echo "Production mutation guard: PASS"

      - name: FCM source consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -qF 'fcm-register-v3.js' portal/index.html
          grep -qF 'fcm-register-v3.js' admin/index.html
          ! grep -qF 'fcm-register.js' portal/index.html
          ! grep -qF 'fcm-register-v2.js' portal/index.html
          ! test -e portal/fcm-register.js
          ! test -e portal/fcm-register-v2.js
          grep -qF '/firebase-messaging-sw.js' portal/fcm-register-v3.js
          grep -qF 'register_notification_device' portal/fcm-register-v3.js
          echo "FCM source consistency: PASS"

      - name: Firebase static assets
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            portal/vendor/firebase/firebase-app-compat.js \
            portal/vendor/firebase/firebase-messaging-compat.js \
            firebase-messaging-sw.js; do
            test -s "$file"
          done
          grep -qF '10.14.1' portal/vendor/firebase/VERSION.txt
          echo "Firebase static assets: PASS"

      - name: Domain and route health
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local url="$1"
            local code
            code=$(curl -sS -L --connect-timeout 10 --max-time 30 -A 'Stagepulse-Guardian/1.0' -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$url -> HTTP $code"
            case "$code" in
              2??|3??|401|403) return 0 ;;
              *) echo "::error::$url failed with HTTP $code"; return 1 ;;
            esac
          }
          check_url "$DOMAIN/"
          check_url "$DOMAIN/admin/"
          check_url "$DOMAIN/portal/"
          check_url "$DOMAIN/firebase-messaging-sw.js"
          check_url "$DOMAIN/portal/fcm-config.js"
          check_url "$DOMAIN/portal/vendor/firebase/firebase-app-compat.js"
          check_url "$DOMAIN/portal/vendor/firebase/firebase-messaging-compat.js"

      - name: Firebase network reachability
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://firebaseinstallations.googleapis.com/' \
            'https://fcmregistrations.googleapis.com/' \
            'https://fcm.googleapis.com/'; do
            code=$(curl -sS -L --connect-timeout 10 --max-time 30 -A 'Stagepulse-Guardian/1.0' -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$url -> HTTP $code"
            test "$code" != "000"
          done

      - name: Supabase health
        shell: bash
        run: |
          set -euo pipefail
          url='https://mtjcqqrogjqaxkagwkti.supabase.co'
          code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$url/rest/v1/" || true)
          echo "Supabase -> HTTP $code"
          test "$code" != "000"

      - name: TLS and security headers
        shell: bash
        run: |
          set -euo pipefail
          echo | openssl s_client -connect stagepulse.com.tr:443 -servername stagepulse.com.tr 2>/dev/null | openssl x509 -noout -dates -issuer -subject
          headers=$(curl -sS -L -I --connect-timeout 10 --max-time 30 -A 'Stagepulse-Guardian/1.0' "$DOMAIN/" || true)
          printf '%s\n' "$headers"
          for header in strict-transport-security x-content-type-options referrer-policy; do
            echo "$headers" | grep -qi "^$header:" || echo "::warning::Missing security header: $header"
          done

      - name: Migration integrity
        shell: bash
        run: |
          set -euo pipefail
          duplicates=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]{14}).*/\1/' | sort | uniq -d)
          test -z "$duplicates" || { echo "$duplicates"; exit 1; }
          while IFS= read -r -d '' file; do
            test -s "$file"
            ! grep -qE -- '^[[:space:]]*-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' "$file"
          done < <(find supabase/migrations -type f -name '*.sql' -print0)
          echo "Migration integrity: PASS"

      - name: Guardian summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Stagepulse Guardian'
            echo ''
            echo 'Mode: **diagnostic / dry-run**'
            echo 'Production mutation: **disabled**'
            echo 'Direct main push: **forbidden**'
            echo 'Secret logging: **disabled**'
            echo ''
            echo 'Checked: repository structure, JavaScript syntax, secrets, workflow mutation safety, FCM source/assets, domain routes, Firebase reachability, Supabase, TLS, headers and migrations.'
          } >> "$GITHUB_STEP_SUMMARY"
