<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#090909">
<title>Stagepulse — Yönetim</title>
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">
<div id="loginView" class="auth-shell">
  <div class="auth-card">
    <div class="auth-mark"><span>SP</span></div>
    <div class="admin-brand">STAGEPULSE <b>ADMIN</b></div>
    <h1>Yönetim Merkezi</h1>
    <p>Tek yetkili hesap ile güvenli giriş.</p>
    <form id="loginForm" autocomplete="on">
      <label>Kullanıcı adı
        <input id="loginUsername" autocomplete="username" autocapitalize="none" required>
      </label>
      <label>Şifre
        <input id="loginPassword" type="password" autocomplete="current-password" minlength="8" required>
      </label>
      <button class="admin-btn primary full" type="submit" id="loginBtn">Giriş Yap</button>
      <div id="loginError" class="error" role="alert"></div>
    </form>
    <div class="auth-security"><span>●</span> Supabase Auth + admin yetki kontrolü</div>
  </div>
</div>

<div id="appView" hidden>
  <div id="mobileOverlay" class="mobile-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <a class="side-logo" href="#dashboard" aria-label="Dashboard">
        <span class="sp-logo-dot">SP</span>
        <span>STAGEPULSE<small>CONTROL</small></span>
      </a>
      <button type="button" id="sidebarClose" class="icon-btn mobile-only" aria-label="Menüyü kapat">×</button>
    </div>

    <div class="side-section-label">Yönetim</div>
    <nav id="sideNav" class="side-nav">
      <button type="button" data-view="dashboard" class="side-btn">
        <span class="side-ico">▣</span><span>Genel Bakış</span>
      </button>
      <button type="button" data-view="offers" class="side-btn">
        <span class="side-ico">☰</span><span>Teklifler</span><em id="navOfferBadge"></em>
      </button>
      <button type="button" data-view="customers" class="side-btn">
        <span class="side-ico">◎</span><span>Müşteriler</span>
      </button>
      <button type="button" data-view="pricing" class="side-btn">
        <span class="side-ico">₮</span><span>Fiyatlandırma</span>
      </button>
    </nav>

    <div class="side-spacer"></div>

    <div class="side-section-label">Sistem</div>
    <nav class="side-system">
      <button type="button" data-view="settings" class="side-btn">
        <span class="side-ico">⚙</span><span>Ayarlar</span>
      </button>
      <button type="button" id="logoutBtn" class="side-btn logout">
        <span class="side-ico">→</span><span>Çıkış</span>
      </button>
    </nav>

    <div class="side-user">
      <span class="avatar">SP</span>
      <div><b id="sideAdminName">Admin</b><small id="sideAdminRole">Yetkili</small></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button type="button" id="menuBtn" class="icon-btn mobile-only" aria-label="Menüyü aç">☰</button>
        <div>
          <div class="breadcrumb">STAGEPULSE / <span id="viewTitle">Genel Bakış</span></div>
          <div id="viewSubtitle" class="top-subtitle">Satış ve operasyon özeti</div>
        </div>
      </div>
      <div class="top-actions">
        <a href="../" target="_blank" rel="noopener" class="site-link">Siteyi Gör ↗</a>
        <button type="button" class="top-user" id="topUser">
          <span class="avatar sm">SP</span>
          <span id="adminUser">@admin</span>
        </button>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>
<script src="admin.js"></script>
</body>
</html>
