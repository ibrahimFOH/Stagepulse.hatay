name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: Function name, or "all"
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: stagepulse-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Validate sources
        run: |
          set -euo pipefail
          python3 scripts/validate-functions-manifest.py
          while IFS= read -r -d '' file; do deno check --quiet --no-lock "$file"; done \
            < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts -print0 | sort -z)
      - name: Deploy without deleting live-only functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          REQUESTED_FUNCTION: ${{ inputs.function }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$TURNSTILE_SECRET_KEY"
          npx --yes supabase@2.45.5 secrets set \
            TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY" \
            --project-ref "$SUPABASE_PROJECT_REF"
          mapfile -t functions < <(python3 - "$REQUESTED_FUNCTION" <<'PY'
          import json
          import sys

          requested = sys.argv[1]
          rows = json.load(open("supabase/functions-manifest.json"))["functions"]
          names = [row["name"] for row in rows]
          if requested != "all":
              if requested not in names:
                  raise SystemExit(f"Unknown function: {requested}")
              names = [requested]
          print("\n".join(names))
          PY
          )
          for function in "${functions[@]}"; do
            verify=$(python3 scripts/function-manifest-value.py "$function" verifyJwt)
            args=("$function" --project-ref "$SUPABASE_PROJECT_REF")
            if [ "$verify" = "false" ]; then args+=(--no-verify-jwt); fi
            npx --yes supabase@2.45.5 functions deploy "${args[@]}"
          done
      - name: Validate deployed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          REQUESTED_FUNCTION: ${{ inputs.function }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.45.5 functions list --project-ref "$SUPABASE_PROJECT_REF" --output json > /tmp/functions.json
          python3 - "$REQUESTED_FUNCTION" <<'PY'
          import json
          import sys

          requested = sys.argv[1]
          expected = json.load(open("supabase/functions-manifest.json"))["functions"]
          if requested != "all":
              expected = [row for row in expected if row["name"] == requested]
          live = json.load(open("/tmp/functions.json"))
          live_by_name = {row["name"]: row for row in live}
          for item in expected:
              row = live_by_name.get(item["name"])
              if row is None:
                  raise SystemExit(f"Deployed function missing: {item['name']}")
              status = str(row.get("status", "ACTIVE")).upper()
              if status not in {"ACTIVE", "READY"}:
                  raise SystemExit(f"Function is not active: {item['name']} ({status})")
          print(f"Validated {len(expected)} deployed function(s)")
          PY