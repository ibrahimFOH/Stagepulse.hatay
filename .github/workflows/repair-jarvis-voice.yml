name: Repair JARVIS voice build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'chore: repair JARVIS voice build') && !contains(github.event.head_commit.message, 'chore: remove one-time JARVIS repair workflow') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Repair Kotlin syntax and voice lifecycle
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('android/app/src/main/java/tr/com/stagepulse/app/MainActivity.kt')
          s = p.read_text()
          old = 'putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3 }'
          new = 'putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3) }'
          if old not in s:
              raise SystemExit('Expected broken RecognizerIntent expression not found')
          s = s.replace(old, new, 1)
          s = s.replace('    override fun onPause() { stopVoiceRecognition(); super.onPause() }', '    override fun onPause() { super.onPause() }', 1)
          p.write_text(s)
          PY2
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/tr/com/stagepulse/app/MainActivity.kt
          git commit -m 'chore: repair JARVIS voice build'
          git push origin HEAD:main
      - name: Remove one-time repair workflow
        if: success()
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-jarvis-voice.yml
          git commit -m 'chore: remove one-time JARVIS repair workflow'
          git push origin HEAD:main
