name: Repair JARVIS voice build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'chore: repair JARVIS voice build') && !contains(github.event.head_commit.message, 'chore: remove one-time JARVIS repair workflow') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Repair Android voice bridge and JARVIS output
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('android/app/src/main/java/tr/com/stagepulse/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3 }', 'putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3) }', 1)
          s = s.replace('if (!AndroidUrlPolicy.isTrustedPortalNavigation(url, portalPath, appVariant)) return false', 'if (!AndroidUrlPolicy.isTrustedPortalNavigation(url, portalPath, appVariant) && !url.startsWith(jarvisUrl())) return false', 1)
          s = s.replace('if (!AndroidUrlPolicy.isTrustedPortalNavigation(url, portalPath, appVariant)) { bridgeAllowed = false; return }', 'if (!AndroidUrlPolicy.isTrustedPortalNavigation(url, portalPath, appVariant) && !url.startsWith(jarvisUrl())) { bridgeAllowed = false; return }', 1)
          s = s.replace('    override fun onPause() { stopVoiceRecognition(); super.onPause() }', '    override fun onPause() { super.onPause() }', 1)
          p.write_text(s)

          p = Path('supabase/functions/patron-ai/index.ts')
          s = p.read_text()
          old = 'const system="Sen Stagepulse Patron JARVIS\'sın. Türkçe konuş. Canlı şirket verisi için araçları kullan. Kritik yazma/silme/fiyat/izin/deploy/GitHub işlemlerini doğrudan yapma; approval oluştur.";let messages:any[]=[{role:"system",content:system},{role:"user",content:JSON.stringify({message:userMessage,memory,history})}],lastTool:any=null;'
          new = 'const system="Sen Stagepulse Patron JARVIS\'sın. Türkçe konuş. Canlı şirket verisi için araçları kullan. Kritik yazma/silme/fiyat/izin/deploy/GitHub işlemlerini doğrudan yapma; approval oluştur. Kullanıcıya ham JSON, ham Markdown tablo, kod bloğu, teknik alan adları veya None/null/undefined gösterme. Sonuçları okunabilir Türkçe başlıklar ve madde işaretleriyle sun. Boş değerler için Yok de. Uzun listeleri kısa ama eksiksiz özetle ve devamı gerekiyorsa kendin tamamla.";let messages:any[]=[{role:"system",content:system},...history.filter((x:any)=>x&&["user","assistant"].includes(x.role)&&String(x.content||"").trim()).slice(-12).map((x:any)=>({role:x.role,content:String(x.content)})),{role:"user",content:JSON.stringify({message:userMessage,memory})}],lastTool:any=null;'
          if old in s: s = s.replace(old, new, 1)
          s = s.replace('temperature:.2,max_tokens:1000', 'temperature:.2,max_tokens:1800', 1)
          s = s.replace('select("content,created_at")', 'select("role,content,created_at")', 1)
          p.write_text(s)

          p = Path('jarvis/admin/index.html')
          s = p.read_text()
          old = "function log(t,k='a'){const e=document.createElement('div');e.className='msg '+k;e.textContent=t;$('chat').appendChild(e);$('chat').scrollTop=$('chat').scrollHeight}"
          new = '''function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\"/g,'&quot;').replace(/'/g,'&#39;')}function renderReply(t){let s=String(t||'').replace(/```[\\s\\S]*?```/g,'').replace(/\\*\\*(.*?)\\*\\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/\\bNone\\b/gi,'Yok').replace(/\\bnull\\b/gi,'Yok').replace(/\\bundefined\\b/gi,'Yok');const a=s.split(/\\r?\\n/),o=[];for(let i=0;i<a.length;i++){const l=a[i].trim();if(!l)continue;if(l.includes('|')&&i+1<a.length&&a[i+1].includes('|')&&/[-:| ]+/.test(a[i+1])){const h=l.split('|').map(x=>x.trim()).filter(Boolean);i++;for(;i+1<a.length&&a[i+1].includes('|')&&!/^\\s*\\|?\\s*-+/.test(a[i+1]);i++){const v=a[i+1].split('|').map(x=>x.trim()).filter(Boolean);o.push('<div class="reply-row">'+h.map((x,j)=>'<b>'+esc(x)+':</b> '+esc(v[j]||'Yok')).join(' • ')+'</div>')}continue}o.push(esc(l.replace(/^#{1,6}\\s*/,'')))}return o.join('<br>')}function log(t,k='a'){const e=document.createElement('div');e.className='msg '+k;e.innerHTML=renderReply(t);$('chat').appendChild(e);$('chat').scrollTop=$('chat').scrollHeight}'''
          if old not in s: raise SystemExit('JARVIS log function not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY2
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add android/app/src/main/java/tr/com/stagepulse/app/MainActivity.kt supabase/functions/patron-ai/index.ts jarvis/admin/index.html
          git commit -m 'chore: repair JARVIS voice build'
          git push origin HEAD:main
      - name: Remove one-time repair workflow
        if: success()
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-jarvis-voice.yml
          git commit -m 'chore: remove one-time JARVIS repair workflow'
          git push origin HEAD:main
