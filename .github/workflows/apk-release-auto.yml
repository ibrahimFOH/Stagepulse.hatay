name: Stagepulse APK Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - latest.json
      - app-update.json

permissions:
  actions: write
  contents: read

concurrency:
  group: stagepulse-apk-auto-release
  cancel-in-progress: false

jobs:
  dispatch-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger verified APK release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/apk-release.yml/dispatches" \
            -d '{"ref":"main","inputs":{"minimum_version_code":"preserve","publish":"true"}}'
          echo "Verified APK release workflow dispatched automatically for this main push."
