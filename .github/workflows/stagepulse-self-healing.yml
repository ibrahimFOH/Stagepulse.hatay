name: Stagepulse Self-Healing Agent

on:
  workflow_run:
    workflows: ["Stagepulse CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: stagepulse-self-healing-main
  cancel-in-progress: false

jobs:
  repair:
    name: Guarded automatic repair
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha != ''
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout failed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Download failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/stagepulse-ci-failed.log" || true
          test -s "$RUNNER_TEMP/stagepulse-ci-failed.log"

      - name: Run guarded self-healing agent
        run: python3 scripts/stagepulse_ai_autofix.py --log "$RUNNER_TEMP/stagepulse-ci-failed.log"

      - name: Commit verified repair
        if: ${{ success() }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No safe repair was applied."
            exit 0
          fi
          git config user.name "stagepulse-self-healing-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-ai.js
          git commit -m "fix(ci): apply verified Stagepulse self-healing repair"
          git push origin HEAD:main
