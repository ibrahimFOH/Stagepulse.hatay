name: Stagepulse Targeted UI Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Fix canonical offer media and inventory mobile layout
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('admin/admin-bundle.js')
          s=p.read_text(encoding='utf-8')
          old='''  const loadAdminUi = () => {\n    if (document.querySelector('script[data-sp-admin-core-ui],script[src*="admin-core-ui-v1.js"]')) return;\n    const script = document.createElement('script');\n    script.src = '/admin/admin-core-ui-v1.js?v=20260827-01';\n    script.defer = true;\n    script.dataset.spAdminCoreUi = '1';\n    document.head.appendChild(script);\n  };\n\n  const loadModuleRegistry = () => {\n    if (document.querySelector('script[data-sp-admin-module-registry],script[src*="admin-module-renderers-v2.js"]')) return;\n    const script = document.createElement('script');\n    script.src = '/admin/admin-module-renderers-v2.js?v=20260831-232';\n    script.dataset.spAdminModuleRegistry = '1';\n    document.head.appendChild(script);\n  };\n'''
          new='''  // Canonical bundle already contains the admin UI and module registry.\n  const loadAdminUi = () => {};\n  const loadModuleRegistry = () => {};\n'''
          if old not in s: raise SystemExit('admin menu dynamic loader block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          css=Path('admin/admin-bundle.css')
          c=css.read_text(encoding='utf-8')
          marker='/* Stagepulse canonical mobile offer inventory fix 2026-09-02 */'
          if marker not in c:
              c += '''\n\n/* Stagepulse canonical mobile offer inventory fix 2026-09-02 */\n#spFinalOfferInventory{min-width:0;overflow:hidden;}\n#spFinalOfferInventory .price-row{min-width:0;max-width:100%;overflow:hidden;}\n#spFinalOfferInventory .sp-offer-price-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(110px,.8fr) auto;gap:8px;align-items:end;min-width:0;}\n#spFinalOfferInventory .sp-offer-price-grid>*{min-width:0;}\n#spFinalOfferInventory .sp-inline-form{min-width:0;max-width:100%;flex-wrap:wrap;}\n#spFinalOfferInventory .sp-inline-form label{min-width:0;}\n#spFinalOfferInventory input,#spFinalOfferInventory select,#spFinalOfferInventory textarea{max-width:100%;box-sizing:border-box;}\n@media(max-width:760px){\n  #spFinalOfferInventory .sp-offer-price-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}\n  #spFinalOfferInventory .sp-offer-price-grid>[data-sp-total]{grid-column:1/-1;padding:4px 0;}\n  #spFinalOfferInventory .sp-offer-price-grid>[data-sp-price-save]{grid-column:1/-1;width:100%;}\n  #spFinalOfferInventory .sp-inline-form{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px!important;align-items:end!important;}\n  #spFinalOfferInventory .sp-inline-form label{grid-column:1/-1;}\n  #spFinalOfferInventory .sp-inline-form [data-sp-reserve-save],#spFinalOfferInventory .sp-inline-form [data-sp-remove]{width:100%;}\n}\n@media(max-width:430px){\n  #spFinalOfferInventory .sp-offer-price-grid{grid-template-columns:1fr;}\n  #spFinalOfferInventory .sp-offer-price-grid>*{grid-column:1!important;}\n  #spFinalOfferInventory .sp-inline-form{grid-template-columns:1fr;}\n  #spFinalOfferInventory .sp-inline-form label,#spFinalOfferInventory .sp-inline-form button{grid-column:1!important;width:100%;}\n}\n'''
          css.write_text(c,encoding='utf-8')
          PY
          node --check admin/admin-bundle.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/admin-bundle.js admin/admin-bundle.css
          git commit -m "Fix mobile offer inventory layout" || exit 0
          git push
