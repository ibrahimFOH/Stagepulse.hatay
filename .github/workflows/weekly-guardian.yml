name: Stagepulse Weekly Guardian

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-health:
    name: Weekly production health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read guardian configuration
        id: config
        run: |
          python3 -c "
          import yaml, json
          cfg = yaml.safe_load(open('.github/ai-guardian.config.yml'))
          domain = cfg['checks']['domain'][0]
          routes = cfg['checks']['routes']
          print(f'domain={domain}')
          print('routes=' + json.dumps(routes))
          " >> "$GITHUB_OUTPUT"

      - name: Check production health and routes
        id: health
        run: |
          set -euo pipefail
          domain="${{ steps.config.outputs.domain }}"
          routes='${{ steps.config.outputs.routes }}'
          failures=""

          check_url() {
            local url="$1"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo "000")
            echo "$url -> $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              failures="${failures}\n- ${url} returned HTTP ${code}"
            fi
          }

          check_url "https://${domain}/"
          for route in $(echo "$routes" | python3 -c "import json,sys; print('\n'.join(json.load(sys.stdin)))"); do
            check_url "https://${domain}${route}"
          done

          {
            echo "failures<<EOF"
            echo -e "$failures"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check last CI run on main
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list --workflow=stagepulse-ci.yml --branch main --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null || echo "unknown")
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Open a weekly health issue when attention is required
        if: steps.health.outputs.failures != '' || steps.ci.outputs.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body_file=$(mktemp)
          {
            echo "This issue is generated by the Stagepulse weekly guardian when manual attention is required."
            echo
            echo "- [ ] Review failing subsystem"
            echo "- [ ] Review generated repair PR"
            echo "- [ ] Confirm production impact"
            echo
            echo "## Findings"
            echo
            echo "- Last \`stagepulse-ci.yml\` run on \`main\`: \`${{ steps.ci.outputs.conclusion }}\`"
            echo -e "${{ steps.health.outputs.failures }}"
          } > "$body_file"
          gh issue create \
            --title "Weekly health report: $(date -u +%Y-%m-%d)" \
            --body-file "$body_file"
