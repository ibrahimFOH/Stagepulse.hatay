name: Stagepulse Lisans Uygulamaları
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-license-apk:
    name: Android Lisans APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with: { packages: 'platform-tools' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with: { gradle-version: '8.11.1' }
      - name: Build and verify license APK
        working-directory: android
        run: |
          set -euo pipefail
          gradle :license-app:assembleDebug --no-daemon
          test -s license-app/build/outputs/apk/debug/license-app-debug.apk
          sha256sum license-app/build/outputs/apk/debug/license-app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Stagepulse-Lisans-APK
          path: android/license-app/build/outputs/apk/debug/license-app-debug.apk
          if-no-files-found: error
          retention-days: 14
  windows-license-exe:
    name: Windows Lisans EXE
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-license/package.json
      - name: Build Windows installer
        working-directory: desktop-license
        run: |
          npm install
          npm run dist:win
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Stagepulse-Lisans-EXE
          path: desktop-license/dist/*.exe
          if-no-files-found: error
          retention-days: 14
