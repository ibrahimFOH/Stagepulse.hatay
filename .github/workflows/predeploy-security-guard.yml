name: Pre-Deploy Security Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Block accidental production exposure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check protected files
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0

          if [ -f "admin.html" ]; then
            echo "ERROR: admin.html exists at repository root."
            FOUND=1
          fi

          for f in \
            supabase_rls_policies.sql supabase_complete_hardening.sql \
            stagepulse_fix.py \
            SECURITY_AUDIT_SUMMARY.md SECURITY_HARDENING.md FIXES.md \
            IMPROVEMENTS.md UPGRADE_README.md README_OPTIMIZE.md \
            .env .env.local; do
            if [ -f "$f" ]; then
              echo "ERROR: protected file exists at repository root: $f"
              FOUND=1
            fi
          done

          if [ "$FOUND" -ne 0 ]; then
            echo "Production exposure guard failed."
            exit 1
          fi

          echo "Production exposure guard passed."
