# HTML değişince sitemap.xml lastmod otomatik güncellenir
name: Update sitemap.xml

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh lastmod dates
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f sitemap.xml ]; then
            sed -i "s#<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}</lastmod>#<lastmod>${TODAY}</lastmod>#g" sitemap.xml
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --staged --quiet; then
            echo "sitemap unchanged"
          else
            git commit -m "chore: sitemap lastmod auto-update"
            git push
          fi
