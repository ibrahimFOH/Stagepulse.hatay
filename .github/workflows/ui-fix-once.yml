name: UI fix once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[ui-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repair canonical admin UI and validator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          bundle=Path('admin/admin-bundle.js')
          s=bundle.read_text(encoding='utf-8')
          marker='/* ===== Stagepulse canonical admin UX repairs 2026-09-02 ===== */'
          if marker not in s:
              s += r'''

          /* ===== Stagepulse canonical admin UX repairs 2026-09-02 ===== */
          (() => {
            'use strict';
            const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const money = v => new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(v)||0);
            const fmtDate = v => v ? new Date(v).toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'}) : '—';
            const db = () => window.__stagepulseAdminClient || window.sb || window.supabaseClient;
            const renderTable = (title, sub, headers, rows) => {
              const c=document.getElementById('content'); if(!c) return;
              c.innerHTML=`<div class="page-head"><div><h1>${esc(title)}</h1><p class="muted">${esc(sub)}</p></div></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="99" class="muted">Kayıt bulunamadı.</td></tr>'}</tbody></table></div></div>`;
            };

            window.financeView = async function(){
              const client=db(); if(!client) return;
              try {
                const {data:payments,error}=await client.from('payments').select('id,offer_id,description,amount,due_date,paid_at,status,created_at').order('created_at',{ascending:false}).limit(500);
                if(error) throw error;
                const offerIds=[...new Set((payments||[]).map(x=>x.offer_id).filter(Boolean))];
                let offers=[];
                if(offerIds.length){const r=await client.from('teklifler').select('id,quote_number,name,company,location').in('id',offerIds);if(r.error)throw r.error;offers=r.data||[];}
                const byId=Object.fromEntries(offers.map(x=>[x.id,x]));
                const rows=(payments||[]).map(p=>{const o=byId[p.offer_id]||{};const name=o.name||o.company||'İş kaydı';return `<tr><td><strong>${esc(name)}</strong>${o.quote_number?`<div class="muted">${esc(o.quote_number)}</div>`:''}</td><td>${esc(p.description||'—')}</td><td><strong>${money(p.amount)}</strong></td><td>${esc(p.status||'pending')}</td><td>${p.due_date?esc(new Date(p.due_date).toLocaleDateString('tr-TR')):'—'}</td><td>${fmtDate(p.paid_at)}</td></tr>`;}).join('');
                renderTable('Ödemeler','Tahsilat kayıtları',['İş','Açıklama','Tutar','Durum','Vade','Ödeme'],rows);
              } catch(e) { console.error('financeView',e); window.toast?.(e.message||'Ödemeler yüklenemedi.',false); }
            };

            window.calendarView = async function(){
              const client=db(); if(!client) return;
              try {
                const {data:jobs,error}=await client.from('jobs').select('id,offer_id,title,setup_at,event_at,teardown_at,location,status').order('event_at',{ascending:true}).limit(500);
                if(error) throw error;
                const offerIds=[...new Set((jobs||[]).map(x=>x.offer_id).filter(Boolean))];
                let offers=[];
                if(offerIds.length){const r=await client.from('teklifler').select('id,quote_number,name').in('id',offerIds);if(r.error)throw r.error;offers=r.data||[];}
                const byId=Object.fromEntries(offers.map(x=>[x.id,x]));
                const rows=(jobs||[]).map(j=>{const o=byId[j.offer_id]||{};const title=j.title||o.name||o.quote_number||'İş';return `<tr><td><strong>${esc(title)}</strong>${o.quote_number&&j.title?`<div class="muted">${esc(o.quote_number)}</div>`:''}</td><td>${esc(j.location||'—')}</td><td>${fmtDate(j.setup_at)}</td><td>${fmtDate(j.event_at)}</td><td>${fmtDate(j.teardown_at)}</td><td>${esc(j.status||'planned')}</td></tr>`;}).join('');
                renderTable('İşler · Takvim','Kurulum ve etkinlik',['İş','Konum','Kurulum','Etkinlik','Söküm','Durum'],rows);
              } catch(e) { console.error('calendarView',e); window.toast?.(e.message||'Takvim yüklenemedi.',false); }
            };
          })();
          '''
              bundle.write_text(s,encoding='utf-8')

          css=Path('admin/admin-bundle.css')
          c=css.read_text(encoding='utf-8')
          marker='/* Stagepulse canonical mobile offer editor repair 2026-09-02 */'
          if marker not in c:
              c += r'''

          /* Stagepulse canonical mobile offer editor repair 2026-09-02 */
          .modal,.modal-card,.modal-card *{min-width:0;box-sizing:border-box;}
          .modal{overflow:auto;overflow-x:hidden;place-items:center;padding:10px;}
          .modal-card{width:min(760px,calc(100vw - 20px));max-width:calc(100vw - 20px);max-height:94svh;overflow-x:hidden;overflow-y:auto;}
          .sp-offer-price-grid,.price-row{max-width:100%;min-width:0;}
          .sp-offer-price-grid>*{min-width:0;}
          .price-row{min-width:0;}
          .price-row label{min-width:0;}
          .price-row input,.price-row select,.price-row textarea{width:100%;max-width:100%;}
          .price-row button,.sp-offer-price-grid .btn{white-space:normal;overflow-wrap:anywhere;min-width:0;}
          @media(max-width:700px){
            .modal{align-items:flex-start;padding:8px;}
            .modal-card{width:100%;max-width:100%;padding:14px;border-radius:14px;}
            .sp-offer-price-grid{display:block!important;}
            .sp-offer-price-grid>*{display:block;width:100%;margin:0 0 8px;}
            .price-row{display:flex!important;flex-wrap:wrap!important;align-items:flex-end!important;gap:8px!important;}
            .price-row>*{flex:1 1 115px!important;min-width:0!important;position:static!important;transform:none!important;}
            .price-row label{display:block!important;flex:1 1 115px!important;}
            .price-row .btn{flex:1 1 110px!important;width:auto!important;}
            .modal-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;}
            .modal-actions>*{width:100%;min-width:0;}
          }
          @media(max-width:430px){
            .modal{padding:6px;}
            .modal-card{padding:12px;}
            .price-row>*{flex-basis:100%!important;width:100%!important;}
            .price-row label,.price-row .btn{flex-basis:100%!important;width:100%!important;}
            .modal-actions{grid-template-columns:1fr;}
          }
          '''
              css.write_text(c,encoding='utf-8')

          v=Path('scripts/validate-web-security.mjs')
          x=v.read_text(encoding='utf-8')
          replacements={
            "const adminBridge = read('admin/admin-supabase-bridge-v1.js');":"const adminBundle = read('admin/admin-bundle.js');\nconst adminBridge = adminBundle;",
            "const portalIsolation = read('portal/session-isolation.js');":"const portalBundle = read('portal/portal-bundle.js');\nconst portalIsolation = portalBundle;",
            "const portalPermissions = read('portal/portal-permissions.js');":"const portalPermissions = portalBundle;",
            "const portalCrud = read('portal/portal-crud.js');":"const portalCrud = portalBundle;",
            "const portalInventory = read('portal/inventory-ui-v3.js');":"const portalInventory = portalBundle;",
            "const adminOfferFields = read('admin/admin-offer-final-fields-v1.js');":"const adminOfferFields = adminBundle;",
            "const adminCss = read('admin/admin.css');":"const adminCss = read('admin/admin-bundle.css');"
          }
          for a,b in replacements.items():
              if a in x: x=x.replace(a,b)
          # Admin bridge is now part of the canonical bundle; only admin.js is the live client bootstrap.
          x=x.replace("const adminCreateClientFiles = [\n  'admin/admin.js',\n  'admin/admin-supabase-bridge-v1.js'\n];\nfor (const path of adminCreateClientFiles) {\n  requireMatch(read(path).includes('stagepulse-admin-auth-v2'), `${path} must use the canonical admin storage key.`);\n}", "const adminCreateClientFiles = ['admin/admin.js'];\nrequireMatch(adminShell.includes('stagepulse-admin-auth-v2'), 'admin/admin.js must use the canonical admin storage key.');")
          v.write_text(x,encoding='utf-8')

          # Force fresh admin CSS/JS after the canonical bundle changes.
          p=Path('admin/index.html')
          y=p.read_text(encoding='utf-8').replace('admin-bundle.css?v=20260902-canonical','admin-bundle.css?v=20260902-offerfix2')
          p.write_text(y,encoding='utf-8')
          p=Path('admin/admin-runtime.js')
          y=p.read_text(encoding='utf-8').replace('admin-bundle.js?v=20260902-canonical','admin-bundle.js?v=20260902-offerfix2')
          p.write_text(y,encoding='utf-8')

          node --check admin/admin-bundle.js
          node --check scripts/validate-web-security.mjs
          git config user.name 'Stagepulse.hatay'
          git config user.email 'ibrahimkavasoglu7@gmail.com'
          git add admin/admin-bundle.js admin/admin-bundle.css scripts/validate-web-security.mjs admin/index.html admin/admin-runtime.js
          git commit -m 'Fix mobile offer editor and canonical admin validation [ui-fixed]'
          git push
      - name: Remove one-shot workflow
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'Stagepulse.hatay'
          git config user.email 'ibrahimkavasoglu7@gmail.com'
          git rm -f .github/workflows/ui-fix-once.yml
          git commit -m 'Remove temporary UI fix workflow [ui-fixed] [skip ci]'
          git push
