name: Stagepulse Repo Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit runtime references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=vendor \
            -E 'admin_get_offer_inventory\s*\(' .; then
            echo 'Legacy RPC reference detected.'
            exit 1
          fi

      - name: Audit required directories
        shell: bash
        run: |
          set -euo pipefail
          for path in admin android docs documents portal scripts shared supabase twa-configs vendor/firebase; do
            test -d "$path" || { echo "Missing: $path"; exit 1; }
          done

      - name: Audit JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './vendor/*' -print0 |
          while IFS= read -r -d '' f; do node --check "$f"; done

      - name: Audit Python
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.py' \
            -not -path './.git/*' \
            -print0 |
          while IFS= read -r -d '' f; do python3 -m py_compile "$f"; done
