name: Update media.json

on:
  push:
    branches: [main]
    paths:
      - "images/gallery/**"
      - "videos/**"
      - "documents/**"
      - "generate_media_json.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-media.txt

      - name: Generate media.json
        run: python3 generate_media_json.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media.json images/gallery/
          if git diff --staged --quiet; then
            echo "No media.json changes"
          else
            git commit -m "chore: auto-update media.json"
            git push
          fi
