name: Build Admin & Staff APKs

on:
  workflow_dispatch:
    inputs:
      build_admin:
        description: "Admin APK (com.stagepulse.admin)"
        type: boolean
        default: true
      build_staff:
        description: "Personel APK (com.stagepulse.staff)"
        type: boolean
        default: true
      version_name:
        description: "Version name (ornek 1.0.1)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code (integer)"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI & Core
        run: |
          npm install -g @bubblewrap/cli @bubblewrap/core
          echo "NODE_PATH=$(npm root -g)" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Bubblewrap CLI
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: Prepare keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p artifacts
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "Keystore hazırlandı."
          else
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "Keystore yok - Debug derlemesi yapılacak."
          fi

      - name: Build Admin APK
        if: ${{ inputs.build_admin }}
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p build/admin
          cp twa-configs/admin.twa-manifest.json build/admin/twa-manifest.json

          python3 -c '
          import json, os
          p = "build/admin/twa-manifest.json"
          d = json.load(open(p))
          d["appVersion"] = str(os.environ["VERSION_NAME"])
          d["appVersionCode"] = int(os.environ["VERSION_CODE"])
          d["appVersionName"] = str(os.environ["VERSION_NAME"])
          if os.path.exists("android.keystore"):
              d["signingKey"] = {
                  "path": os.path.abspath("android.keystore"),
                  "alias": os.environ.get("KEY_ALIAS") or "android"
              }
          json.dump(d, open(p, "w"), indent=2)
          '

          cd build/admin

          node -e '
          const { TwaManifest, TwaGenerator } = require("@bubblewrap/core");
          const fs = require("fs");

          // Web Manifest indirilirken Cloudflare 403 engeline takılmamak için indirici fonksiyonu monkey-patch ediyoruz
          TwaGenerator.prototype.writeWebManifest = async function() { return; };

          async function gen() {
            const json = JSON.parse(fs.readFileSync("twa-manifest.json"));
            const manifest = new TwaManifest(json);
            const generator = new TwaGenerator();

            await generator.createTwaProject("./", manifest);
            console.log("Admin Android projesi başarıyla oluşturuldu.");
          }
          gen().catch(err => { console.error(err); process.exit(1); });
          '

          chmod +x gradlew
          if [ -f "../../android.keystore" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(realpath "../../android.keystore") \
              -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS:-android}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            ./gradlew assembleDebug
          fi

          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "../../artifacts/Stagepulse-Admin-v${VERSION_NAME}.apk"
            echo "Admin APK başarıyla oluşturuldu."
          else
            echo "HATA: Admin APK bulunamadı!"
            exit 1
          fi

      - name: Build Staff APK
        if: ${{ inputs.build_staff }}
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p build/staff
          cp twa-configs/staff.twa-manifest.json build/staff/twa-manifest.json

          python3 -c '
          import json, os
          p = "build/staff/twa-manifest.json"
          d = json.load(open(p))
          d["appVersion"] = str(os.environ["VERSION_NAME"])
          d["appVersionCode"] = int(os.environ["VERSION_CODE"])
          d["appVersionName"] = str(os.environ["VERSION_NAME"])
          if os.path.exists("android.keystore"):
              d["signingKey"] = {
                  "path": os.path.abspath("android.keystore"),
                  "alias": os.environ.get("KEY_ALIAS") or "android"
              }
          json.dump(d, open(p, "w"), indent=2)
          '

          cd build/staff

          node -e '
          const { TwaManifest, TwaGenerator } = require("@bubblewrap/core");
          const fs = require("fs");

          // Web Manifest indirilirken Cloudflare 403 engeline takılmamak için indirici fonksiyonu monkey-patch ediyoruz
          TwaGenerator.prototype.writeWebManifest = async function() { return; };

          async function gen() {
            const json = JSON.parse(fs.readFileSync("twa-manifest.json"));
            const manifest = new TwaManifest(json);
            const generator = new TwaGenerator();

            await generator.createTwaProject("./", manifest);
            console.log("Personel Android projesi başarıyla oluşturuldu.");
          }
          gen().catch(err => { console.error(err); process.exit(1); });
          '

          chmod +x gradlew
          if [ -f "../../android.keystore" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(realpath "../../android.keystore") \
              -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS:-android}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            ./gradlew assembleDebug
          fi

          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "../../artifacts/Stagepulse-Personel-v${VERSION_NAME}.apk"
            echo "Personel APK başarıyla oluşturuldu."
          else
            echo "HATA: Personel APK bulunamadı!"
            exit 1
          fi

      - name: Show results
        run: |
          echo "=== Oluşturulan APK'lar ==="
          ls -lh artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: stagepulse-apks-v${{ inputs.version_name }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
