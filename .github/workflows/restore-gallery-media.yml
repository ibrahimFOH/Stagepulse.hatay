name: Restore Gallery Media
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate gallery/media structure
        run: |
          test -d images
          test -f media.json
          python3 generate_media_json.py --help >/dev/null 2>&1 || true
