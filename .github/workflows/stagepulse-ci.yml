name: Stagepulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      function:
        description: Supabase Edge Function name, or all
        required: true
        default: all
        type: string
      apply_missing:
        description: Apply missing production migrations
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '05 21 * * *'
    - cron: '30 03 * * 0'
    - cron: '00 06 * * *'

permissions:
  contents: read

concurrency:
  group: stagepulse-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Static / Security / Supabase Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Validate static site and manifests
        run: |
          set -euo pipefail
          python3 scripts/validate-local-assets.py
          python3 scripts/validate-functions-manifest.py
          python3 scripts/validate-update-manifests.py
          python3 scripts/validate-workflow-safety.py
          node scripts/validate-web-security.mjs
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find admin portal shared -type f -name '*.js' ! -path '*/vendor/*' -print0 | sort -z | xargs -0 -n1 node --check
          node --check core.js
          node --check script.js
          node --check script-controller.js
          node --check sw.js
          node --check portal/app-update.js
      - name: Check Edge Functions
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do deno check --quiet --no-lock "$file"; done < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts -print0 | sort -z)
      - name: Verify migration integrity
        run: python3 scripts/validate-migration-integrity.py
      - name: Credential baseline
        run: |
          set -euo pipefail
          pattern='SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=]|service_role[[:space:]]*[:=]|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          ! git grep -nE "$pattern" -- ':!.github' ':!supabase/functions' ':!supabase/migrations' ':!portal/vendor' ':!vendor/firebase'
      - name: Frontend service-role protection
        run: |
          set -euo pipefail
          ! grep -RIn --include='*.js' --include='*.html' 'SUPABASE_SERVICE_ROLE_KEY' portal admin shared 2>/dev/null
      - name: Private schema protection
        run: |
          set -euo pipefail
          ! grep -RInE 'GRANT USAGE ON SCHEMA private TO (anon|PUBLIC)' supabase/migrations

  android_debug:
    name: Android Debug Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Compile, test, lint and build debug variants
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:lintPersonelDebug :app:lintAdminDebug :app:testPersonelDebugUnitTest :app:testAdminDebugUnitTest :app:assemblePersonelDebug :app:assembleAdminDebug --no-daemon

  public_integrity:
    name: Public SEO / Navigation Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate sitemap, robots and public pages
        run: |
          set -euo pipefail
          test -s sitemap.xml
          test -s robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q 'Sitemap: https://stagepulse.com.tr/sitemap.xml' robots.txt
          test -f dokumanlar.html
          test -f bolgeler.html
          grep -q 'dokumanlar.html' script.js
          grep -q 'bolgeler.html' script.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          urls=re.findall(r'<loc>(https://stagepulse\\.com\\.tr/[^<]*)</loc>',sitemap)
          assert urls and len(urls)==len(set(urls)), 'Invalid or duplicate sitemap URLs'
          for url in urls:
              p=url.removeprefix('https://stagepulse.com.tr/')
              file=Path('index.html') if not p else Path(p.rstrip('/'))
              if file.is_dir(): file=file/'index.html'
              assert file.is_file(), f'Missing sitemap file: {file}'
              html=file.read_text(encoding='utf-8',errors='ignore')
              assert re.search(r'<title>[^<]+</title>',html,re.I), f'Missing title: {file}'
              assert re.search(r'<meta[^>]+name=["\\']description["\\']',html,re.I), f'Missing description: {file}'
          print(f'Validated {len(urls)} sitemap pages.')
          PY
      - name: Verify public navigation controller
        run: |
          set -euo pipefail
          grep -q 'function ensureCoreNavigationLinks' script.js
          grep -q 'ensureCoreNavigationLinks();' script.js
          failed=0
          while IFS= read -r -d '' file; do
            case "$file" in ./admin/*|./portal/*|./android/*|./.github/*) continue;; esac
            if grep -q '<nav' "$file" && ! grep -q 'script.js' "$file"; then echo "Missing shared navigation controller: $file"; failed=1; fi
          done < <(find . -type f -name '*.html' -print0)
          test "$failed" -eq 0

  production_smoke:
    name: Production Smoke / Edge Health
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '00 06 * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.SMOKE_BASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check critical public routes
        run: |
          set -euo pipefail
          BASE="${BASE_URL:-https://stagepulse.com.tr}"
          BASE="${BASE%/}"
          for path in / /teklif.html /admin/ /portal/ /latest.json /firebase-messaging-sw.js /portal/fcm-config.js /robots.txt /sitemap.xml; do
            code=$(curl -sS -L --max-time 25 -A 'Stagepulse-Smoke/1.0' -o /dev/null -w '%{http_code}' "${BASE}${path}" || true)
            echo "$path -> $code"
            case "$code" in 2*|3*|401|403) ;; *) exit 1;; esac
          done
      - name: Check production security headers
        run: |
          set -euo pipefail
          headers=$(curl -sS -L -I --max-time 20 -A 'Stagepulse-Smoke/1.0' https://stagepulse.com.tr/ || true)
          for h in strict-transport-security x-content-type-options referrer-policy; do echo "$headers" | grep -qi "^$h:" || { echo "Missing header: $h"; exit 1; }; done

  guardian:
    name: Daily Production Guardian
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '05 21 * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Full JavaScript syntax guard
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './portal/vendor/*' -not -path './vendor/firebase/*' -not -path './node_modules/*' | sort)
          for file in "${files[@]}"; do node --check "$file"; done
      - name: FCM implementation integrity
        run: |
          set -euo pipefail
          grep -q 'stagepulse-905be' portal/fcm-config.js
          grep -q '163274034334' portal/fcm-config.js
          grep -q 'vapidKey' portal/fcm-config.js
          grep -q 'register_notification_device' portal/fcm-register-v3.js
          grep -q 'showNotification' firebase-messaging-sw.js
          grep -q 'notificationclick' firebase-messaging-sw.js
      - name: Domain health and TLS
        run: |
          set -euo pipefail
          for url in https://stagepulse.com.tr/ https://stagepulse.com.tr/admin/ https://stagepulse.com.tr/portal/ https://stagepulse.com.tr/firebase-messaging-sw.js; do
            code=$(curl -sS -L --max-time 30 -A 'Stagepulse-Guardian/1.0' -o /dev/null -w '%{http_code}' "$url" || true)
            case "$code" in 2*|3*|401|403) ;; *) echo "$url -> HTTP $code"; exit 1;; esac
          done
          echo | openssl s_client -connect stagepulse.com.tr:443 -servername stagepulse.com.tr 2>/dev/null | openssl x509 -noout -dates
      - name: Production mutation guard
        run: |
          set -euo pipefail
          ! grep -RInE 'git push|supabase db push|supabase functions deploy|firebase deploy|wrangler deploy' .github/workflows/stagepulse-ci.yml

  weekly_health:
    name: Weekly Autonomous Health
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 03 * * 0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Repository health
        run: |
          set -euo pipefail
          test -s supabase/config.toml
          test -d supabase/migrations
          while IFS= read -r file; do [[ "$file" =~ ^[0-9]{14}_.+\.sql$ ]] || exit 1; test -s "supabase/migrations/$file"; done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
      - name: Production availability
        run: |
          set -euo pipefail
          for url in https://stagepulse.com.tr/ https://stagepulse.com.tr/admin/ https://stagepulse.com.tr/portal/ https://stagepulse.com.tr/portal/fcm-config.js; do
            code=$(curl -sS -L --max-time 20 -A 'Stagepulse-Weekly-Health/1.0' -o /dev/null -w '%{http_code}' "$url" || true)
            case "$code" in 2*|3*|401|403) ;; *) exit 1;; esac
          done
      - name: Firebase endpoint availability
        run: |
          set -euo pipefail
          curl -I -sS --max-time 15 https://firebaseinstallations.googleapis.com/ >/dev/null
          curl -I -sS --max-time 15 https://fcm.googleapis.com/ >/dev/null

  edge_deploy:
    name: Manual Supabase Edge Deploy
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Validate and deploy selected functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          REQUESTED_FUNCTION: ${{ inputs.function }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$TURNSTILE_SECRET_KEY"
          python3 scripts/validate-functions-manifest.py
          while IFS= read -r -d '' file; do deno check --quiet --no-lock "$file"; done < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts -print0 | sort -z)
          npx --yes supabase@2.45.5 secrets set TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          mapfile -t functions < <(python3 - "$REQUESTED_FUNCTION" <<'PY'
          import json,sys
          requested=sys.argv[1]
          names=[x['name'] for x in json.load(open('supabase/functions-manifest.json'))['functions']]
          if requested!='all':
              if requested not in names: raise SystemExit(f'Unknown function: {requested}')
              names=[requested]
          print('\n'.join(names))
          PY
          )
          for function in "${functions[@]}"; do
            verify=$(python3 scripts/function-manifest-value.py "$function" verifyJwt)
            args=("$function" --project-ref "$SUPABASE_PROJECT_REF")
            [ "$verify" = false ] && args+=(--no-verify-jwt)
            npx --yes supabase@2.45.5 functions deploy "${args[@]}"
          done

  migration_audit:
    name: Manual Supabase Migration Audit
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify immutable local migration ledger
        run: python3 scripts/validate-migration-integrity.py
      - name: Synchronize and verify production ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          APPLY_MISSING: ${{ inputs.apply_missing }}
        run: |
          set -euo pipefail
          python3 scripts/sync-supabase-migrations.py

  pages:
    name: GitHub Pages Build and Deploy
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='supabase' --exclude='twa-configs' --exclude='node_modules' --exclude='tests' ./ _site/
          test -s _site/portal/fcm-config.js
          test -s _site/firebase-messaging-sw.js
          touch _site/.nojekyll
          test -s _site/media.json
      - name: Archive Pages artifact
        run: tar --dereference --hard-dereference --directory _site -cvf "${RUNNER_TEMP}/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  indexnow:
    name: IndexNow Submission
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Submit public URLs
        env:
          INDEXNOW_KEY: 4600ed0ea9e74c0eb00a8ffc500b9260
        run: |
          set -euo pipefail
          urls='["https://stagepulse.com.tr/","https://stagepulse.com.tr/hatay/","https://stagepulse.com.tr/adana/","https://stagepulse.com.tr/gaziantep/","https://stagepulse.com.tr/sanliurfa/","https://stagepulse.com.tr/mersin/","https://stagepulse.com.tr/bolgeler.html","https://stagepulse.com.tr/hizmetler.html","https://stagepulse.com.tr/muhendislik.html","https://stagepulse.com.tr/teklif.html","https://stagepulse.com.tr/galeri.html","https://stagepulse.com.tr/dokumanlar.html","https://stagepulse.com.tr/referanslar.html","https://stagepulse.com.tr/sss.html"]'
          payload=$(jq -n --arg host 'stagepulse.com.tr' --arg key "$INDEXNOW_KEY" --arg keyLocation "https://stagepulse.com.tr/${INDEXNOW_KEY}.txt" --argjson urlList "$urls" '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}')
          curl --fail-with-body --silent --show-error -X POST 'https://api.indexnow.org/IndexNow' -H 'Content-Type: application/json; charset=utf-8' --data "$payload"

  gate:
    name: Canonical Gate
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    needs: [validate, android_debug, public_integrity]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed on mandatory checks
        run: |
          test "${{ needs.validate.result }}" = success
          test "${{ needs.android_debug.result }}" = success
          test "${{ needs.public_integrity.result }}" = success
          echo 'Stagepulse canonical CI gate passed.'
