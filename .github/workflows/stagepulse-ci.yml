name: Stagepulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      function:
        description: Supabase Edge Function name, or all
        required: true
        default: all
        type: string
      apply_missing:
        description: Apply missing production migrations
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '00 06 * * *'
permissions:
  contents: read
concurrency:
  group: stagepulse-ci-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  validate:
    name: Static / Security / Supabase Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install Node dependencies when package lock exists
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Validate canonical operation layout
        run: python3 scripts/validate-canonical-layout.py
      - name: Validate static site and manifests
        run: |
          set -euo pipefail
          test -s index.html
          test -s teklif.html
          test -s portal/index.html
          test -s admin/index.html
          test -s portal/fcm-config.js
          test -s firebase-messaging-sw.js
          test -s media.json
          test -s manifest.webmanifest
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -path './node_modules' -prune -o -path './.git' -prune -o -path './supabase/functions' -prune -o -type f -name '*.js' -print0 | sort -z)
          node --check sw.js
          node --check portal/app-update.js
      - name: Check Edge Functions
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do deno check --quiet --no-lock "$file"; done < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts -print0 | sort -z)
      - name: Verify migrations
        run: python3 scripts/validate-migration-integrity.py
      - name: Credential baseline
        run: |
          set -euo pipefail
          pattern='SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=]|service_role[[:space:]]*[:=]|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          ! git grep -nE "$pattern" -- ':!.github' ':!supabase/functions' ':!supabase/migrations' ':!portal/vendor' ':!vendor/firebase'
      - name: Frontend service-role protection
        run: |
          set -euo pipefail
          ! grep -RIn --include='*.js' --include='*.html' 'SUPABASE_SERVICE_ROLE_KEY' portal admin shared 2>/dev/null
      - name: Private schema protection
        run: |
          set -euo pipefail
          ! grep -RInE 'GRANT USAGE ON SCHEMA private TO (anon|PUBLIC)' supabase/migrations

  android_debug:
    name: Android Debug Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Compile, test, lint and build debug variants
        working-directory: android
        run: gradle :app:lintPersonelDebug :app:lintAdminDebug :app:testPersonelDebugUnitTest :app:testAdminDebugUnitTest :app:assemblePersonelDebug :app:assembleAdminDebug --no-daemon

  public_integrity:
    name: Public SEO / Navigation Integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate public pages
        run: |
          set -euo pipefail
          test -s sitemap.xml
          test -s robots.txt
          test -s media.json
          test -f dokumanlar.html
          test -f bolgeler.html
          grep -q 'dokumanlar.html' script.js
          grep -q 'bolgeler.html' script.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          urls=re.findall(r'<loc>(https://stagepulse\.com\.tr(?:/[^<]*)?)</loc>',sitemap)
          assert urls and len(urls)==len(set(urls)), 'Invalid or duplicate sitemap URLs'
          for url in urls:
              p=url.removeprefix('https://stagepulse.com.tr/').rstrip('/')
              if not p:
                  file=Path('index.html')
              else:
                  file=Path(p)
              if file.is_dir(): file=file/'index.html'
              assert file.is_file(), f'Missing sitemap file: {file}'
              html=file.read_text(encoding='utf-8',errors='ignore')
              assert re.search(r'<title>[^<]+</title>',html,re.I), f'Missing title: {file}'
              assert re.search(r'<meta[^>]+name=["\']description["\']',html,re.I), f'Missing description: {file}'
          print(f'Validated {len(urls)} sitemap pages.')
          PY
      - name: Verify public navigation controller
        run: |
          set -euo pipefail
          grep -q 'function ensureCoreNavigationLinks' script.js
          grep -q 'ensureCoreNavigationLinks();' script.js

  pages_build:
    name: GitHub Pages Build Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='supabase' --exclude='twa-configs' --exclude='node_modules' --exclude='tests' ./ _site/
          test -s _site/portal/fcm-config.js
          test -s _site/firebase-messaging-sw.js
          test -s _site/media.json
          touch _site/.nojekyll
      - name: Validate build output
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/admin/index.html
          test -s _site/portal/index.html
          test -s _site/teklif.html

  pages:
    name: GitHub Pages Deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [pages_build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='supabase' --exclude='twa-configs' --exclude='node_modules' --exclude='tests' ./ _site/
          test -s _site/portal/fcm-config.js
          test -s _site/firebase-messaging-sw.js
          test -s _site/media.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  production_smoke:
    name: Production Smoke / Edge Health
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '00 06 * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check critical public routes
        run: |
          set -euo pipefail
          for path in / /teklif.html /admin/ /portal/ /latest.json /firebase-messaging-sw.js /portal/fcm-config.js /robots.txt /sitemap.xml; do
            code=$(curl -sS -L --max-time 25 -A 'Stagepulse-Smoke/1.0' -o /dev/null -w '%{http_code}' "https://stagepulse.com.tr${path}" || true)
            case "$code" in 2*|3*|401|403) ;; *) echo "$path -> $code"; exit 1;; esac
          done
      - name: Check security headers
        run: |
          set -euo pipefail
          headers=$(curl -sS -L -I --max-time 20 https://stagepulse.com.tr/ || true)
          for h in strict-transport-security x-content-type-options referrer-policy; do echo "$headers" | grep -qi "^$h:" || exit 1; done

  guardian:
    name: Daily Production Guardian
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '00 06 * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run production guardian
        run: python3 scripts/production_guardian.py

  weekly_health:
    name: Weekly Autonomous Health
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run weekly health checks
        run: python3 scripts/weekly_health.py

  supabase_deploy:
    name: Manual Supabase Edge Deploy
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy selected Edge Function
        env:
          FUNCTION: ${{ inputs.function }}
          APPLY_MISSING: ${{ inputs.apply_missing }}
        run: python3 scripts/manual_supabase_deploy.py

  migration_audit:
    name: Manual Supabase Migration Audit
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Audit migration state
        run: python3 scripts/validate-migration-integrity.py
