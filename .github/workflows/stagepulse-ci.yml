name: Stagepulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stagepulse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Required structure
        run: |
          set -euo pipefail
          for path in .github/workflows supabase supabase/migrations supabase/functions portal admin; do test -d "$path"; done
          test -s .github/workflows/stagepulse-guardian.yml
          test -s firebase-messaging-sw.js
          test -s portal/fcm-register-v3.js
      - name: Migration timestamps
        run: |
          set -euo pipefail
          duplicates=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]{14}).*/\1/' | sort | uniq -d)
          test -z "$duplicates"
      - name: Credential scan
        run: |
          set -euo pipefail
          pattern='SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=]|service_role[[:space:]]*[:=]|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          if git grep -nE "$pattern" -- ':!.github' ':!supabase/functions' ':!supabase/migrations' ':!portal/vendor' ':!vendor/firebase'; then
            echo 'Credential pattern detected in tracked application source.'
            exit 1
          fi

  javascript:
    name: JavaScript Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './portal/vendor/*' -not -path './vendor/firebase/*' -print0)

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do deno check "$file"; done < <(find supabase/functions -type f -name '*.ts' -print0)

  security:
    name: Security Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Frontend service-role protection
        run: |
          set -euo pipefail
          ! grep -RIn --include='*.js' --include='*.html' 'SUPABASE_SERVICE_ROLE_KEY' portal admin
      - name: Password recovery guards
        run: |
          set -euo pipefail
          test -s portal/password-recovery.js
          grep -qF 'resetPasswordForEmail(email' portal/password-recovery.js
          grep -qF 'PASSWORD_RECOVERY' portal/password-recovery.js
          grep -qF 'forgotPasswordBtn' portal/index.html

  supabase:
    name: Supabase Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Migration integrity
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            test -s "$file"
            ! grep -qE '^[[:space:]]*-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' "$file"
          done < <(find supabase/migrations -type f -name '*.sql' -print0)
      - name: FCM notification database contract
        run: |
          set -euo pipefail
          grep -RIl --include='*.sql' 'register_notification_device' supabase/migrations | tail -n 1 | xargs grep -q 'p_app_variant'
          grep -RIl --include='*.sql' 'notification_devices_user_token_variant_uidx' supabase/migrations | tail -n 1 | xargs grep -q 'CREATE UNIQUE INDEX'
      - name: Private schema protection
        run: |
          set -euo pipefail
          ! grep -RInE 'GRANT USAGE ON SCHEMA private TO (anon|PUBLIC)' supabase/migrations

  production:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Edge checks
        run: |
          set -euo pipefail
          for url in https://stagepulse.com.tr/ https://stagepulse.com.tr/admin/ https://stagepulse.com.tr/portal/ https://stagepulse.com.tr/firebase-messaging-sw.js; do
            code=$(curl -sS -L -A 'Stagepulse-CI/1.0' --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$url -> $code"
            case "$code" in 2??|3??|401|403) ;; *) exit 1 ;; esac
          done

  gate:
    name: Stagepulse CI Gate
    runs-on: ubuntu-latest
    needs: [integrity, javascript, edge-functions, security, supabase, production]
    if: ${{ always() }}
    steps:
      - name: Verify checks
        run: |
          set -euo pipefail
          for result in '${{ needs.integrity.result }}' '${{ needs.javascript.result }}' '${{ needs.edge-functions.result }}' '${{ needs.security.result }}' '${{ needs.supabase.result }}' '${{ needs.production.result }}'; do
            test "$result" = success
          done
          echo 'STAGEPULSE CI: ALL CHECKS PASSED'
