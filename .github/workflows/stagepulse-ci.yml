name: Stagepulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stagepulse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v2
        with:
          deno-version: v2.x
      - name: Validate static site and manifests
        run: |
          set -euo pipefail
          python3 scripts/validate-local-assets.py
          python3 scripts/validate-functions-manifest.py
          python3 scripts/validate-update-manifests.py
          python3 scripts/validate-workflow-safety.py
          node scripts/validate-web-security.mjs
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find admin portal shared -type f -name '*.js' ! -path '*/vendor/*' -print0 \
            | sort -z | xargs -0 -n1 node --check
          node --check core.js
          node --check script.js
          node --check script-controller.js
          node --check sw.js
          node --check portal/app-update.js
      - name: Check Edge Functions
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            deno check --quiet --no-lock "$file"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts -print0 | sort -z)
      - name: Verify migration filenames
        run: |
          set -euo pipefail
          python3 scripts/validate-migration-integrity.py

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"
      - name: Compile, test, and build Android debug variants
        working-directory: android
        run: |
          set -euo pipefail
          gradle :app:lintPersonelDebug :app:lintAdminDebug \
            :app:testPersonelDebugUnitTest :app:testAdminDebugUnitTest \
            :app:assemblePersonelDebug :app:assembleAdminDebug --no-daemon
      - name: Verify merged application manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          manifests = list(pathlib.Path("android/app/build/intermediates/merged_manifests").glob("**/AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("No merged Android manifests found")
          expected = {"personelDebug": "tr.com.stagepulse.app", "adminDebug": "tr.com.stagepulse.admin"}
          seen = set()
          for path in manifests:
              text = str(path)
              for variant, package in expected.items():
                  if variant.lower() not in text.lower():
                      continue
                  root = ET.parse(path).getroot()
                  if root.attrib.get("package") != package:
                      raise SystemExit(f"{variant} package mismatch in {path}")
                  app = root.find("application")
                  if app is None or app.attrib.get(android + "usesCleartextTraffic") != "false":
                      raise SystemExit(f"{variant} must disable cleartext traffic")
                  seen.add(variant)
          if seen != set(expected):
              raise SystemExit(f"Missing merged manifests: {set(expected) - seen}")
          print("Merged Android manifests are valid")
          PY