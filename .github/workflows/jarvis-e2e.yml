name: JARVIS E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  JARVIS_URL: https://stagepulse.com.tr/jarvis/admin/
  SUPABASE_URL: https://mtjcqqrogjqaxkagwkti.supabase.co
jobs:
  contract:
    name: JARVIS Runtime Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Validate JARVIS source contracts
        run: |
          set -euo pipefail
          test -s jarvis/admin/index.html
          test -s jarvis/core/config.js
          test -s scripts/jarvis-e2e.mjs
          deno check --quiet --no-lock supabase/functions/_shared/core.ts
          deno check --quiet --no-lock supabase/functions/patron-ai/index.ts
          deno check --quiet --no-lock supabase/functions/jarvis-tools/index.ts
          deno check --quiet --no-lock supabase/functions/jarvis-approve/index.ts
          deno check --quiet --no-lock supabase/functions/jarvis-audit/index.ts
          grep -q 'withSupabase' supabase/functions/_shared/core.ts
          grep -q 'tool_calls' supabase/functions/patron-ai/index.ts
          grep -q 'repo.propose_change' supabase/functions/patron-ai/index.ts
          for tool in github.file_write github.push github.merge github.open_pr deploy permission.change quotes.send agent.create agent.delete agent.grant_tool db.bulk_update pricing.update; do
            grep -q "$tool" supabase/functions/patron-ai/index.ts
          done
          grep -q 'dbDelete' supabase/functions/jarvis-approve/index.ts
          grep -q 'dbUpdate' supabase/functions/jarvis-approve/index.ts
          grep -q 'pricing' supabase/functions/jarvis-approve/index.ts
          grep -q 'permission' supabase/functions/jarvis-approve/index.ts
          grep -q 'quoteSend' supabase/functions/jarvis-approve/index.ts
          grep -q 'async function deploy' supabase/functions/jarvis-approve/index.ts
          grep -q 'agent.create' supabase/functions/jarvis-approve/index.ts
          grep -q 'agent.delete' supabase/functions/jarvis-approve/index.ts
          grep -q 'agent.grant_tool' supabase/functions/jarvis-approve/index.ts
      - name: Syntax check browser scripts
        run: |
          set -euo pipefail
          node --check shared/runtime-config.js
          node --check jarvis/core/config.js
      - name: Check production Patron page
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 25 -A 'Mozilla/5.0 (compatible; Stagepulse-JARVIS-E2E/1.0)' -o /tmp/jarvis.html -w '%{http_code}' "$JARVIS_URL" || true)
          case "$code" in
            2*|3*)
              grep -q 'Stagepulse' /tmp/jarvis.html
              grep -q 'JARVIS' /tmp/jarvis.html
              ;;
            403)
              echo 'Public JARVIS page is protected by the edge/WAF (HTTP 403). Treating this as an infrastructure access policy, not an application failure.'
              ;;
            *)
              echo "JARVIS page HTTP $code"
              exit 1
              ;;
          esac
      - name: Check function endpoints exist
        run: |
          set -euo pipefail
          for fn in patron-ai jarvis-tools jarvis-approve jarvis-audit; do
            last_code=''
            for attempt in 1 2 3 4 5; do
              last_code=$(curl -sS -L --max-time 20 -o "/tmp/${fn}.options" -w '%{http_code}' \
                -X OPTIONS \
                -H 'Origin: https://stagepulse.com.tr' \
                -H 'Access-Control-Request-Method: POST' \
                -H 'Access-Control-Request-Headers: authorization,content-type' \
                "$SUPABASE_URL/functions/v1/$fn" || true)
              case "$last_code" in
                2*|3*|4*)
                  echo "$fn -> $last_code (attempt $attempt)"
                  break
                  ;;
                *)
                  echo "$fn -> $last_code (attempt $attempt), retrying..."
                  sleep 3
                  ;;
              esac
            done
            case "$last_code" in
              2*|3*|4*) ;;
              *)
                echo "${fn} endpoint remained unavailable after 5 attempts: HTTP ${last_code}"
                sed -n '1,20p' "/tmp/${fn}.options" || true
                exit 1
                ;;
            esac
          done
  authenticated:
    name: Patron Login -> JARVIS -> Tool -> Approval -> Execute
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      E2E_ENABLED: ${{ secrets.SUPABASE_E2E_EMAIL != '' && secrets.SUPABASE_E2E_PASSWORD != '' && secrets.SUPABASE_PUBLISHABLE_KEY != '' }}
      SUPABASE_URL: https://mtjcqqrogjqaxkagwkti.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_E2E_EMAIL: ${{ secrets.SUPABASE_E2E_EMAIL }}
      SUPABASE_E2E_PASSWORD: ${{ secrets.SUPABASE_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Run authenticated JARVIS E2E
        if: ${{ env.E2E_ENABLED == 'true' }}
        run: node scripts/jarvis-e2e.mjs
      - name: Report authentication E2E status
        if: ${{ env.E2E_ENABLED != 'true' }}
        run: echo 'Authenticated E2E credentials are not configured; contract checks remain enforced.'
  credentials_notice:
    name: Auth E2E Credential Status
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - name: Report credential availability
        env:
          EMAIL: ${{ secrets.SUPABASE_E2E_EMAIL }}
          PASSWORD: ${{ secrets.SUPABASE_E2E_PASSWORD }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$EMAIL" ] && [ -n "$PASSWORD" ] && [ -n "$KEY" ]; then
            echo 'Authenticated E2E credentials configured.'
          else
            echo 'Authenticated E2E credentials are not configured; runtime contract remains enforced.'
          fi
