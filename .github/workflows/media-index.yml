name: Media Index

on:
  push:
    branches: [main]
    paths:
      - 'images/gallery/**'
      - 'documents/**'
      - 'scripts/process_media.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-index-main
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Rebuild media index and WebP assets
        run: python scripts/process_media.py

      - name: Commit optimized assets and media index when changed
        run: |
          if git diff --quiet -- media.json images/gallery; then
            echo "Media assets and index are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media.json images/gallery
          git commit -m "chore(media): optimize images and rebuild media index"
          git push
