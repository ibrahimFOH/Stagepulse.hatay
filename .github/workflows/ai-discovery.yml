name: Stagepulse AI Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: AI / Search Discovery Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate public AI discovery signals
        run: python3 scripts/validate-ai-discovery.py
