name: Pre-Deploy Security Guard

# NOT: Bu workflow siteyi deploy ETMEZ. Sadece main'e push edilen içerikte
# canlıya sızmaması gereken dosyalar var mı diye kontrol eder ve varsa
# build'i FAIL ettirir. Gerçek deploy Cloudflare Pages / hosting entegrasyonu
# tarafından ayrıca tetikleniyor olmalı — eğer host repo kökünü olduğu gibi
# yayınlıyorsa, aşağıdaki dosyalar da (varsa) herkese açık hale gelir.

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Sızmaması gereken dosyaları kontrol et
        run: |
          echo "admin.html ve iç dokümantasyon/script dosyaları kontrol ediliyor..."
          FOUND=0

          if [ -f "admin.html" ]; then
            echo "HATA: admin.html repo kökünde bulundu."
            FOUND=1
          fi

          for f in \
            supabase_rls_policies.sql supabase_complete_hardening.sql \
            stagepulse_fix.py \
            SECURITY_AUDIT_SUMMARY.md SECURITY_HARDENING.md FIXES.md \
            IMPROVEMENTS.md UPGRADE_README.md README_OPTIMIZE.md \
            .env .env.local; do
            if [ -f "$f" ]; then
              echo "UYARI: '$f' repo kökünde duruyor. Host repo kökünü olduğu gibi"
              echo "        statik olarak sunuyorsa bu dosya https://stagepulse.com.tr/$f"
              echo "        adresinden herkese açık hale gelebilir."
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "Öneri: Bu dosyaları ayrı bir /docs veya /internal klasörüne taşıyıp"
            echo "hosting'in yalnızca web'e ait dosyaları (html/css/js/images/videos/documents)"
            echo "yayınlayacağı bir 'publish directory' yapılandırın."
            exit 1
          fi

          echo "Sorun bulunmadı."
