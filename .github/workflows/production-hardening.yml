name: Stagepulse Production Hardening
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in admin/admin.js admin/auth-layer.js portal/portal.js portal/password-recovery.js portal/fcm-register.js; do test -f "$f"; node --check "$f"; done
      - name: Password recovery regression
        run: |
          set -euo pipefail
          grep -qF 'resetPasswordForEmail(email' portal/password-recovery.js
          grep -qF 'forgotPasswordBtn' portal/index.html
          ! grep -qF 'teklifal@stagepulse.com.tr' portal/password-recovery.js
      - name: Supabase migration parity guards
        run: |
          set -euo pipefail
          for f in \
            supabase/migrations/20260821235909_restore_private_offer_wrapper_dependencies_v52.sql \
            supabase/migrations/20260822001000_revoke_anon_trigger_function_execute_v53.sql \
            supabase/migrations/20260822002003_canonicalize_admin_authorizer_private_v53.sql \
            supabase/migrations/20260822002057_protect_staff_profile_security_fields_v54.sql; do test -f "$f"; done
          grep -qF 'private.is_admin()' supabase/migrations/20260822002003_canonicalize_admin_authorizer_private_v53.sql
          grep -qF 'prevent_staff_privilege_escalation' supabase/migrations/20260822002057_protect_staff_profile_security_fields_v54.sql
      - name: Edge function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: |
          set -euo pipefail
          for f in supabase/functions/staff-session/index.ts supabase/functions/staff-manage/index.ts supabase/functions/send-fcm-notification/index.ts; do deno check "$f"; done
