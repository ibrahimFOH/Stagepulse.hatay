name: Ses Merkezi Windows kurulumunu Stagepulse indirme alanına kopyala

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-ses-merkezi-windows.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ses-merkezi-windows-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: EXE dosyasını doğrula ve Stagepulse alan adına yerleştir
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          lfs: false

      - name: En son kararlı sürüm manifestini yayın deposundan hazırla
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, urllib.error, urllib.request
          from pathlib import Path
          api = "https://api.github.com/repos/ibrahimFOH/Stagepulse-Releases/releases/latest"
          request = urllib.request.Request(api, headers={
              "Accept": "application/vnd.github+json",
              "User-Agent": "Stagepulse-Stable-Manifest-Sync/1.0",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  release = json.loads(response.read(2 * 1024 * 1024 + 1))
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("Henüz kararlı GitHub Release yok; site manifestine dokunulmadı.")
                  Path("sync-ready.txt").write_text("false", encoding="ascii")
                  raise SystemExit(0)
              raise
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("GitHub latest endpoint kararlı sürüm döndürmedi.")
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", str(release.get("tag_name", "")))
          if not match:
              raise SystemExit("Kararlı sürüm etiketi geçersiz.")
          version = ".".join(match.groups())
          version_code = int(match.group(1))*10000 + int(match.group(2))*100 + int(match.group(3))
          assets = {item.get("name"): item for item in release.get("assets", [])}
          records = {}
          for platform, extension in (("Windows", "exe"), ("Android", "apk")):
              filename = f"Stagepulse-Ses-Merkezi-{platform}-{version}.{extension}"
              checksum_name = filename + ".sha256"
              package = assets.get(filename)
              checksum = assets.get(checksum_name)
              if not package:
                  print(f"Kararlı {platform} paketi eksik; site manifestine dokunulmadı.")
                  Path("sync-ready.txt").write_text("false", encoding="ascii")
                  raise SystemExit(0)
              digest = str(package.get("digest") or "")
              if re.fullmatch(r"sha256:[a-fA-F0-9]{64}", digest):
                  digest = digest[7:].lower()
              else:
                  if not checksum:
                      raise SystemExit(f"{platform} SHA-256 dosyası eksik.")
                  checksum_url = checksum.get("browser_download_url", "")
                  with urllib.request.urlopen(checksum_url, timeout=25) as response:
                      line = response.read(4096).decode("ascii").strip()
                  found = re.fullmatch(r"([a-fA-F0-9]{64})\s+\*?(.+)", line)
                  if not found or found.group(2) != filename:
                      raise SystemExit(f"{platform} SHA-256 dosyası geçersiz.")
                  digest = found.group(1).lower()
              if not re.fullmatch(r"[a-f0-9]{64}", digest):
                  raise SystemExit(f"{platform} SHA-256 biçimi geçersiz.")
              url = package.get("browser_download_url", "")
              expected = f"https://github.com/ibrahimFOH/Stagepulse-Releases/releases/download/v{version}/{filename}"
              if url != expected:
                  raise SystemExit(f"{platform} GitHub indirme adresi beklenenden farklı.")
              records[platform.lower()] = {"url": url, "sha256": digest, "filename": filename}
          windows_site_url = f"https://stagepulse.com.tr/downloads/ses-merkezi/Stagepulse-Ses-Merkezi-Windows-{version}.bin?version={version}"
          manifest = {
              "ok": True,
              "published": True,
              "version": version,
              "versionName": version,
              "versionCode": version_code,
              "windows": {
                  "url": windows_site_url,
                  "sha256": records["windows"]["sha256"],
                  "filename": records["windows"]["filename"],
                  "release_url": records["windows"]["url"],
              },
              "android": records["android"],
              "url": windows_site_url,
              "sha256": records["windows"]["sha256"],
              "filename": records["windows"]["filename"],
              "apkUrl": records["android"]["url"],
              "apkSha256": records["android"]["sha256"],
              "notes": str(release.get("body") or "")[:2000],
              "release_url": f"https://github.com/ibrahimFOH/Stagepulse-Releases/releases/tag/v{version}",
              "channel": "stable",
              "prerelease": False,
          }
          Path("downloads/ses-merkezi/latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          # Keep the legacy Windows updater URL working for every future stable release.
          redirects_path = Path("_redirects")
          redirects = redirects_path.read_text(encoding="utf-8").splitlines() if redirects_path.exists() else []
          redirect = (
              f"/downloads/ses-merkezi/Stagepulse-Ses-Merkezi-Windows-{version}.bin "
              f"{records['windows']['url']} 302"
          )
          redirects = [
              line for line in redirects
              if not re.match(r"^/downloads/ses-merkezi/Stagepulse-Ses-Merkezi-Windows-\d+\.\d+\.\d+\.bin\s", line)
          ]
          redirects.append(redirect)
          redirects_path.write_text("\n".join(redirects) + "\n", encoding="utf-8")
          Path("sync-ready.txt").write_text("true", encoding="ascii")
          print("STABLE_SITE_MANIFEST_READY", version)
          PY
          ready="$(cat sync-ready.txt)"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Manifesti doğrula ve yayınlanmış Windows dosyasını indir
        if: steps.sync.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          path = Path("downloads/ses-merkezi/latest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if manifest.get("ok") is not True or manifest.get("published") is not True:
              raise SystemExit("Güncelleme bildirimi yayımlanmış değil.")
          channel = manifest.get("channel", "stable")
          prerelease = manifest.get("prerelease", False)
          if channel not in {"stable", "test"} or prerelease is not (channel == "test"):
              raise SystemExit("Güncelleme kanalı ve ön sürüm işareti uyuşmuyor.")
          version = str(manifest.get("version", ""))
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("Sürüm biçimi geçersiz.")
          expected_name = f"Stagepulse-Ses-Merkezi-Windows-{version}.exe"
          windows = manifest.get("windows")
          if not isinstance(windows, dict):
              raise SystemExit("Manifest windows nesnesini içermiyor.")
          if windows.get("filename") != expected_name:
              raise SystemExit("Windows dosya adı sürümle eşleşmiyor.")
          digest = str(windows.get("sha256", "")).lower()
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("Windows SHA-256 biçimi geçersiz.")
          release_url = (
              f"https://github.com/ibrahimFOH/Stagepulse-Releases/releases/download/"
              f"v{version}/{expected_name}"
          )
          declared_url = str(windows.get("release_url") or manifest.get("windows_release_url") or release_url)
          parsed = urlparse(declared_url)
          if parsed.scheme != "https" or parsed.hostname != "github.com" or parsed.path != urlparse(release_url).path:
              raise SystemExit("İndirme kaynağı beklenen Stagepulse Release varlığı değil.")
          Path("/tmp/ses-merkezi-release.env").write_text(
              f"VERSION={version}\nFILENAME={expected_name}\nSHA256={digest}\nURL={release_url}\nCHANNEL={channel}\nPRERELEASE={str(prerelease).lower()}\n",
              encoding="utf-8",
          )
          print(f"Manifest geçerli: {version}")
          print(f"Kaynak: {release_url}")
          print(f"Beklenen SHA-256: {digest}")
          PY
          source /tmp/ses-merkezi-release.env
          mkdir -p downloads/ses-merkezi
          temp_file="$(mktemp)"
          trap 'rm -f "$temp_file"' EXIT
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            --user-agent "Stagepulse-Release-Mirror/1.0" \
            "$URL" --output "$temp_file"
          size="$(stat -c %s "$temp_file")"
          if [ "$size" -lt 1000000 ]; then
            echo "Kurulum paketi beklenenden küçük: $size bayt" >&2
            exit 1
          fi
          if [ "$(head -c 2 "$temp_file")" != "MZ" ]; then
            echo "İndirilen dosya Windows PE/EXE başlığını taşımıyor." >&2
            exit 1
          fi
          actual="$(sha256sum "$temp_file" | awk '{print $1}')"
          if [ "$actual" != "$SHA256" ]; then
            echo "SHA-256 uyuşmazlığı: beklenen=$SHA256 alınan=$actual" >&2
            exit 1
          fi
          install_name="${FILENAME%.exe}.bin"
          install_path="downloads/ses-merkezi/$install_name"
          install_tmp="$install_path.tmp"
          mv "$temp_file" "$install_tmp"
          mv "$install_tmp" "$install_path"
          rm -f "downloads/ses-merkezi/$FILENAME" "downloads/ses-merkezi/$FILENAME.sha256" "downloads/ses-merkezi/$FILENAME.bin" "downloads/ses-merkezi/$FILENAME.bin.sha256"
          printf '%s  %s\n' "$SHA256" "$install_name" > "$install_path.sha256"
          echo "Windows paketi doğrulandı ve site dosya ağacına yerleştirildi: $size bayt"

      - name: Yalnızca doğrulanmış indirme dosyalarını gönder
        if: steps.sync.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A downloads/ses-merkezi/ _redirects
          if git diff --cached --quiet; then
            echo "Windows kurulum dosyası zaten güncel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(downloads): publish verified Ses Merkezi Windows installer"
          git push origin HEAD:main

      - name: Dağıtım dosyalarını doğrula ve alan adı erişimini raporla
        if: steps.sync.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/ses-merkezi-release.env
          export CHANNEL PRERELEASE
          manifest="downloads/ses-merkezi/latest.json"
          package="downloads/ses-merkezi/${FILENAME%.exe}.bin"
          python3 - "$manifest" "$VERSION" "$SHA256" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          version, digest = sys.argv[2], sys.argv[3]
          win = data.get("windows") or {}
          if data.get("published") is not True or data.get("version") != version:
              raise SystemExit("Güncelleme bildirimi sürüm/yayın bilgisi geçersiz.")
          if data.get("channel") != "stable" or data.get("prerelease") is not False:
              raise SystemExit("Site güncelleme bildirimi yalnızca kararlı sürüm içermeli.")
          if win.get("sha256") != digest or f"version={version}" not in win.get("url", ""):
              raise SystemExit("Windows adresi veya SHA-256 bildirimi uyuşmuyor.")
          print(f"Manifest doğrulandı: {version} / {channel} kanalı")
          PY
          test -s "$package"
          size="$(stat -c %s "$package")"
          actual="$(sha256sum "$package" | awk '{print $1}')"
          if [ "$size" -lt 1000000 ] || [ "$(head -c 2 "$package")" != "MZ" ] || [ "$actual" != "$SHA256" ]; then
            echo "Windows paketi boyut, PE başlığı veya SHA-256 doğrulamasından geçemedi." >&2
            exit 1
          fi
          echo "Yerel dağıtım paketi doğrulandı: $size bayt / SHA-256 $actual"

          live_status="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 \
            --user-agent "StagepulseSesMerkezi/3.7.2" --header 'Accept: application/json' \
            --header 'Cache-Control: no-cache' --output /tmp/live-ses-merkezi-manifest.json \
            --write-out '%{http_code}' https://stagepulse.com.tr/downloads/ses-merkezi/latest.json || true)"
          if [ "$live_status" = "200" ]; then
            python3 - "$VERSION" "$SHA256" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path("/tmp/live-ses-merkezi-manifest.json").read_text(encoding="utf-8"))
          win = data.get("windows") or {}
          if data.get("version") != sys.argv[1] or win.get("sha256") != sys.argv[2]:
              raise SystemExit("Canlı alan adı eski veya farklı bir güncelleme bildirimi sunuyor.")
          print("Canlı alan adı manifesti de doğrulandı.")
          PY
          else
            echo "::warning::Stagepulse alan adı GitHub Actions ağından HTTP $live_status döndürdü. Manifest ve paket GitHub kaynağında doğrulandı; alan adı erişimi kullanıcı ağı üzerinden ayrıca doğrulanmalı."
          fi
