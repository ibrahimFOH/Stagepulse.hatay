name: Supabase Migration Audit

on:
  workflow_dispatch:
    inputs:
      apply_missing:
        description: Explicitly apply missing repository migrations (production approval required)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify immutable local migration ledger
        run: python3 scripts/validate-migration-integrity.py
      - name: Synchronize and verify production migration ledger
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          APPLY_MISSING: ${{ inputs.apply_missing }}
        run: |
          set -euo pipefail
          python3 scripts/sync-supabase-migrations.py