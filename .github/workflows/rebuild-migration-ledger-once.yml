name: Rebuild migration ledger once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, 'chore: regenerate migration ledger') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Regenerate and remove one-time workflow
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          root=pathlib.Path('.')
          base=root/'supabase'/'migration-baseline.json'
          migrations=sorted((root/'supabase'/'migrations').glob('*.sql'))
          h=hashlib.sha256(); h.update(base.name.encode()); h.update(b'\0'); h.update(base.read_bytes())
          for p in migrations:
              h.update(p.name.encode()); h.update(b'\0'); h.update(p.read_bytes())
          (root/'supabase'/'migrations.sha256').write_text(h.hexdigest()+'\n',encoding='utf-8')
          print(h.hexdigest())
          PY
          rm .github/workflows/rebuild-migration-ledger-once.yml
          git config user.name 'Stagepulse.hatay'
          git config user.email 'ibrahimkavasoglu7@gmail.com'
          git add supabase/migrations.sha256 .github/workflows/rebuild-migration-ledger-once.yml
          git commit -m 'chore: regenerate migration ledger'
          git push origin HEAD:main
# one-time retry trigger