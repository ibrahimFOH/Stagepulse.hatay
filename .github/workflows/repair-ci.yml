name: Repair CI once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair workflow and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/stagepulse-ci.yml')
          lines=p.read_text(encoding='utf-8').splitlines()
          out=[]
          changed=False
          for line in lines:
              if "assert re.search(r'<meta[^>]+name=" in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  line=indent+'''assert re.search(r"<meta[^>]+name=[\\"']description[\\"']",html,re.I), f"Missing description: {file}"'''
                  changed=True
              out.append(line)
          if not changed:
              raise SystemExit('target assertion not found')
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/stagepulse-ci.yml
          git rm .github/workflows/repair-ci.yml
          git commit -m 'Repair CI metadata assertion and remove helper'
          git push
