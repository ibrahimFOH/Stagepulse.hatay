name: Apply public AI branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename-public-ai:
    if: ${{ !contains(github.event.head_commit.message, 'apply public AI branding') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Replace public-facing Jarvis name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site-ai.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Stagepulse Jarvis Pro public customer agent v3': 'Stagepulse Teknik Asistan public customer agent v3',
              'Stagepulse Jarvis': 'Stagepulse Teknik Asistan',
              'Site Jarvis': 'Site Teknik Asistan',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Commit public AI branding
        run: |
          git config user.name 'Stagepulse Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-ai.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix(public-ai): rename customer assistant'
          git push
