name: Schema Address Check
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/fix-schema-address.yml'
permissions:
  contents: read
jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migrations
        run: |
          test -d supabase/migrations
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort >/tmp/migrations.txt
          test -s /tmp/migrations.txt
