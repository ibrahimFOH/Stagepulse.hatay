name: Stagepulse Autonomous Guardian

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  issues: read
  security-events: read

concurrency:
  group: stagepulse-guardian-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  guardian:
    name: Guardian diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js (no cache dependency)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Guardian structure
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/ai-guardian.config.yml
          for f in guardian debugger tester fixer; do
            test -f ".github/agents/${f}.md"
          done
          echo 'Guardian structure OK.'

      - name: Detect project structure
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then echo 'node_project=true' >> "$GITHUB_OUTPUT"; else echo 'node_project=false' >> "$GITHUB_OUTPUT"; fi
          if [ -f package-lock.json ]; then echo 'lockfile=true' >> "$GITHUB_OUTPUT"; else echo 'lockfile=false' >> "$GITHUB_OUTPUT"; fi

      - name: Install dependencies
        if: steps.detect.outputs.node_project == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.detect.outputs.lockfile }}" = 'true' ]; then npm ci; else npm install; fi

      - name: Secret baseline
        shell: bash
        run: |
          set -euo pipefail
          found=0
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*[^[:space:]]{20,}' .; then
            found=1
          fi
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' -- '^[[:space:]]*-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----[[:space:]]*$' .; then
            found=1
          fi
          if [ "$found" -ne 0 ]; then
            echo 'Potential literal secret/private key detected.'
            exit 1
          fi
          echo 'Secret baseline passed.'

      - name: Domain and route smoke checks
        shell: bash
        run: |
          set -euo pipefail
          for url in https://stagepulse.com.tr/ https://stagepulse.com.tr/admin https://stagepulse.com.tr/portal; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url")
            echo "$url -> $code"
            case "$code" in
              2*|3*|401|403) ;;
              *) echo "Unreachable or unexpected HTTP status: $code"; exit 1 ;;
            esac
          done

      - name: Firebase public endpoint reachability
        shell: bash
        run: |
          set -euo pipefail
          curl -I -sS --max-time 15 https://firebaseinstallations.googleapis.com/ >/dev/null
          curl -I -sS --max-time 15 https://fcm.googleapis.com/ >/dev/null
          echo 'Firebase public endpoints reachable.'

      - name: Service worker discovery
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f \( -iname '*service-worker*' -o -iname '*firebase-messaging-sw*' -o -name 'sw.js' \) -print | head -100 || true

      - name: Node verification
        if: steps.detect.outputs.node_project == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"
          scripts=$(npm run 2>/dev/null || true)
          echo "$scripts"
          if echo "$scripts" | grep -qE '^  lint'; then npm run lint; fi
          if echo "$scripts" | grep -qE '^  typecheck'; then npm run typecheck; elif echo "$scripts" | grep -qE '^  type-check'; then npm run type-check; fi
          if echo "$scripts" | grep -qE '^  test'; then npm test -- --if-present; fi
          if echo "$scripts" | grep -qE '^  build'; then npm run build; fi

      - name: Production mutation guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.yml' --include='*.yaml' '^[[:space:]]*(git[[:space:]]+push[[:space:]]+([^[:space:]]+[[:space:]]+)?main|git[[:space:]]+push[[:space:]]+origin[[:space:]]+main|git[[:space:]]+push[[:space:]]+.*--force)' .github/workflows; then
            echo 'Unsafe direct main push command detected.'
            exit 1
          fi
          echo 'No direct main push command detected.'

      - name: Production impact record
        shell: bash
        run: |
          echo 'Production impact: read-only diagnostics only.'
          echo 'No production code, secrets, database policy, Cloudflare configuration, or deployment target is mutated.'
          echo 'Fixes must follow branch -> minimal patch -> tests -> CI -> PR -> human approval where required -> merge -> deploy.'

      - name: Guardian summary
        run: |
          echo 'STAGEPULSE AUTONOMOUS GUARDIAN - BASELINE COMPLETED'
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
