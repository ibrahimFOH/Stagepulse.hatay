name: Supabase Auth Hardening

# Production auth configuration changes are intentionally manual-only.
# This workflow must never mutate Supabase on every repository push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-hardening:
    name: Supabase Auth Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure leaked password protection
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: mtjcqqrogjqaxkagwkti
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "ERROR: SUPABASE_ACCESS_TOKEN repository secret is required."
            exit 1
          }

          set +e
          HTTP_CODE=$(curl -sS -o auth-config.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"password_hibp_enabled":true}')
          set -e

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            python3 - <<'PY'
          import json
          with open('auth-config.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          if data.get('password_hibp_enabled') is not True:
              raise SystemExit('ERROR: API succeeded but password_hibp_enabled is not true')
          print('PASS: password_hibp_enabled=true')
          PY
          elif [ "$HTTP_CODE" = "402" ]; then
            echo "INFO: Supabase plan does not permit leaked password protection."
          else
            echo "ERROR: Supabase Auth configuration request failed with HTTP $HTTP_CODE"
            rm -f auth-config.json
            exit 1
          fi
          rm -f auth-config.json
