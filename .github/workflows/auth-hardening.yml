name: Supabase Auth Hardening

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Check leaked password protection availability
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: mtjcqqrogjqaxkagwkti
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "ERROR: SUPABASE_ACCESS_TOKEN repository secret is required."; exit 1; }
          set +e
          HTTP_CODE=$(curl -sS -o auth-config.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"password_hibp_enabled":true}')
          set -e
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            python3 - <<'PY'
          import json
          with open('auth-config.json','r',encoding='utf-8') as f: d=json.load(f)
          if d.get('password_hibp_enabled') is not True:
              raise SystemExit('ERROR: API succeeded but password_hibp_enabled was not returned as true')
          print('PASS: password_hibp_enabled=true')
          PY
          elif [ "$HTTP_CODE" = "402" ]; then
            echo "INFO: Supabase plan does not permit leaked password protection; Free plan remains unchanged."
          else
            echo "ERROR: Supabase Auth configuration request failed with HTTP $HTTP_CODE"
            cat auth-config.json
            exit 1
          fi
