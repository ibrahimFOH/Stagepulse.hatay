name: Auth Hardening
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/auth-hardening.yml'
permissions:
  contents: read
jobs:
  auth-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check auth sources
        run: |
          test -d supabase
          test -d supabase/migrations
          grep -R "leaked_password" -n supabase .github || true
          grep -R "rate_limit" -n supabase .github || true
