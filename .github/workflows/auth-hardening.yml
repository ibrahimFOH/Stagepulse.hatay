name: Supabase Auth Hardening

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auth-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Enable leaked password protection
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: mtjcqqrogjqaxkagwkti
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "ERROR: SUPABASE_ACCESS_TOKEN repository secret is required."; exit 1; }
          curl --fail-with-body -sS -X PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"password_hibp_enabled":true}' > auth-config.json
          python3 - <<'PY'
          import json
          with open('auth-config.json','r',encoding='utf-8') as f: d=json.load(f)
          if d.get('password_hibp_enabled') is not True:
              raise SystemExit('ERROR: password_hibp_enabled was not returned as true')
          print('PASS: password_hibp_enabled=true')
          PY
