version: 1
name: stagepulse-autonomous-guardian
mode: dry-run
risk:
  auto_merge: false
  require_human_approval_for:
    - auth
    - rls
    - rpc
    - cloudflare
    - secrets
    - production_deploy
limits:
  max_consecutive_failures: 3
  max_fix_attempts_per_run: 1
  free_plan_protection: true
checks:
  domain: [stagepulse.com.tr]
  routes: [/admin, /portal]
  services: [supabase, firebase, cloudflare, formspree, github, fcm]
  security: [secrets, rls, auth, xss, csrf, open_redirect, injection]
  reliability: [health, latency, http_status, service_worker, fcm_registration]
production:
  direct_push: false
  protected_branches: [main]
